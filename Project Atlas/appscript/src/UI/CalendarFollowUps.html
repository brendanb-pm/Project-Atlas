<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--ink:#182129;--paper:#f4f6f7;--panel:#fff;--line:#dbe1e4;--accent:#d57b1e;--ok:#13763e;--bad:#ad2b2b;--warn:#8a5c00}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Arial,sans-serif}
    .wrap{max-width:1200px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
    .head h1{margin:0}.muted{color:#63727b}.tabs,.actions{display:flex;gap:9px;flex-wrap:wrap}
    .tab,.button{min-height:44px;border:1px solid #b7c4ca;border-radius:5px;background:#fff;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
    .tab.active,.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.button.secondary{background:#e6ecee}
    .button.danger{background:#fff0f0;border-color:#d78282;color:#8d2020}.button[disabled]{opacity:.62;cursor:not-allowed}
    .tab:focus-visible,.button:focus-visible,.field input:focus-visible,.field select:focus-visible{outline:3px solid #287c9a;outline-offset:2px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:18px;margin:16px 0;box-shadow:0 2px 7px rgba(20,34,42,.04);overflow-wrap:anywhere}
    .connection{border-left:5px solid #89999f}.connection.connected{border-left-color:var(--ok)}.connection.attention{border-left-color:var(--bad)}
    .connection h2,.card h2{font-size:19px;margin:0 0 5px}.status{display:inline-block;border-radius:999px;padding:4px 9px;background:#e8edef;color:#40515b;font-weight:700;font-size:13px}
    .status.ok{background:#dcf3e4;color:#0b6230}.status.warn{background:#fff1d9;color:#7a4c00}.status.bad{background:#ffe2e2;color:#8c2020}
    .field{display:flex;flex-direction:column;gap:5px;font-weight:700;min-width:0}.field input,.field select{width:100%;min-height:44px;border:1px solid #aebdc4;border-radius:4px;padding:8px;font:inherit}
    .detail{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}.follow{border-left:5px solid #738b96}.follow.unscheduled{border-left-color:var(--warn)}.follow.conflict,.follow.error,.follow.attention_required{border-left-color:var(--bad)}
    .schedule{font-size:18px;font-weight:700;margin:6px 0}.schedule-form{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.form-error{color:var(--bad);font-weight:700;margin:8px 0}
    .review{border:2px solid #c9811b}.review h2{color:#764704}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.schedule-box{background:#f5f8f9;border:1px solid var(--line);padding:12px;border-radius:5px}
    .day{display:grid;grid-template-columns:115px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.day time{font-weight:700;color:#374a54}
    .empty,.error,.loading{padding:28px;text-align:center;color:#62727a}.error{color:#8c2020}.toast{position:fixed;right:16px;top:16px;z-index:10;max-width:min(400px,calc(100vw - 32px));padding:12px 14px;border-radius:5px;color:#fff;font-weight:700;background:#265c73}.toast.error{background:var(--bad)}.toast.success{background:var(--ok)}.toast[hidden]{display:none}.account{font-size:13px;color:#56666f}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}.wrap{padding:16px}}
    @media(max-width:600px){.wrap{padding:12px}.head{flex-direction:column}.grid,.two,.pair{grid-template-columns:1fr}.tab,.button{flex:1}.day{grid-template-columns:1fr}.actions .button{min-width:calc(50% - 5px)}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <div><h1>Follow-up Calendar</h1><p class="muted">Your MOS account controls access. A connected calendar is optional and synchronizes only scheduled FollowUps.</p></div>
    <nav class="tabs" aria-label="Calendar workspace">
      <button class="tab active" data-view="followups" onclick="view('followups')">FollowUps</button>
      <button class="tab" data-view="today" onclick="view('today')">Today</button>
      <button class="tab" data-view="settings" onclick="view('settings')">Calendar Settings</button>
    </nav>
  </header>
  <section id="content" class="loading card" aria-live="polite">Loading FollowUps…</section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
var state={view:'followups',data:null,busy:{},scheduleId:'',reviewId:'',draft:null};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function note(text,type){var el=document.getElementById('toast');el.textContent=text;el.className='toast '+(type||'');el.hidden=false;setTimeout(function(){el.hidden=true;},5200);}
function messageOf(value){return value&&value.error&&value.error.message||value&&value.message||'That action could not be completed.';}
function run(name,args,ok,fail){
  google.script.run.withSuccessHandler(function(response){
      if(!response||!response.ok){if(fail)fail(messageOf(response),false);else note(messageOf(response),'error');if(response&&response.refreshRequired)setTimeout(load,0);return;}
    ok(response.data);
  }).withFailureHandler(function(error){
    var safeMessage='The result could not be confirmed. Refresh before retrying.';
    if(fail)fail(safeMessage,true);else note(safeMessage,'error');
  })[name].apply(google.script.run,args||[]);
}
function load(preserveEditor){
  document.getElementById('content').setAttribute('aria-busy','true');
  run('getCalendarWorkspace',[],function(data){state.data=data;render();},function(message){
    document.getElementById('content').setAttribute('aria-busy','false');
    if(!preserveEditor){document.getElementById('content').className='card error';document.getElementById('content').textContent=message;}
    note(message,'error');
  });
}
function view(name){if(state.draft&&!confirm('Discard the unsaved schedule?'))return;state.view=name;state.scheduleId='';state.reviewId='';state.draft=null;render();}
function providerName(key){return {GOOGLE_CALENDAR:'Google Calendar',MICROSOFT_GRAPH_CALENDAR:'Microsoft Outlook',APPLE_ICLOUD_CALENDAR:'Apple / iCloud',ICAL_PUBLICATION:'iCal subscription'}[key]||'Connected calendar';}
function providerInfo(key){return (state.data.providers||[]).filter(function(p){return p.providerKey===key;})[0]||{};}
function customer(f){var row=(state.data.customers||[]).filter(function(c){return c.id===f.customerId;})[0];return row&&(row.name||row.companyName)||'Customer not assigned';}
function link(f){return (state.data.links||[]).filter(function(item){return item.followUpId===f.id;})[0];}
function request(f){return (state.data.requests||[]).filter(function(item){return item.followUpId===f.id;})[0];}
function connectionFor(f){var item=link(f);return item&&(state.data.connections||[]).filter(function(c){return c.id===item.connectionId;})[0];}
function ownerConnection(f){return (state.data.connections||[]).filter(function(c){return c.userId===f.ownerUserId&&c.connectionStatus==='CONNECTED';})[0];}
function isClosed(f){return f.status==='COMPLETED'||f.status==='CANCELLED';}
function stateFor(f){var review=request(f),item=link(f),connection=connectionFor(f),owner=ownerConnection(f);if(isClosed(f))return f.status;if(review)return review.changeType==='CONFLICT'?'CONFLICT':review.changeType==='CLEANUP_FAILED'?'CLEANUP_FAILED':'EXTERNAL_CHANGE';if(!f.startAt||!f.endAt||!f.timeZone)return 'UNSCHEDULED';if(state.data.calendarIntegrationEnabled===false)return 'DISABLED';if(!item||!item.hasExternalProjection){if(owner&&(owner.lastError||!providerInfo(owner.provider).authorizationConfigured))return 'ATTENTION_REQUIRED';return 'NOT_CONNECTED';}if(connection&&connection.connectionStatus==='ATTENTION_REQUIRED')return 'ATTENTION_REQUIRED';if(connection&&connection.lastError)return 'ERROR';return 'SYNCED';}
function statusText(value){return {NOT_CONNECTED:'Scheduled in MOS — calendar not connected',DISABLED:'Scheduled in MOS — calendar sync disabled',UNSCHEDULED:'Not scheduled',PENDING:'Syncing',SYNCED:'Synced',EXTERNAL_CHANGE:'Calendar changed — review required',CONFLICT:'Conflict — review required',ERROR:'Sync error',ATTENTION_REQUIRED:'Calendar setup needs attention',COMPLETED:'Completed',CANCELLED:'Cancelled'}[value]||value;}
var calendarStatusText=statusText;
statusText=function(value){return value==='CLEANUP_FAILED'?'Previous calendar cleanup needs review':calendarStatusText(value);};
function statusClass(value){return value==='SYNCED'||value==='COMPLETED'?'ok':(value==='CONFLICT'||value==='CLEANUP_FAILED'||value==='ERROR'||value==='ATTENTION_REQUIRED')?'bad':'warn';}
function localDate(v){return v?String(v).slice(0,10):'';}function localTime(v){if(!v)return '';var d=new Date(v);return isNaN(d)?'':d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
function wallParts(v,timeZone){if(!v||!timeZone)return null;var result={};try{new Intl.DateTimeFormat('en-CA',{timeZone:timeZone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(v)).forEach(function(part){if(part.type!=='literal')result[part.type]=part.value;});return result;}catch(error){return null;}}
function wallDate(v,timeZone){var parts=wallParts(v,timeZone);return parts?parts.year+'-'+parts.month+'-'+parts.day:'';}
function wallTime(v,timeZone){var parts=wallParts(v,timeZone);return parts?parts.hour+':'+parts.minute:'';}
function scheduled(f){return f.startAt?esc(wallDate(f.startAt,f.timeZone))+' · '+esc(wallTime(f.startAt,f.timeZone))+' – '+esc(wallTime(f.endAt,f.timeZone))+'<br><span class="muted">'+esc(f.timeZone)+'</span>':'Not scheduled';}
function render(){document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.view===state.view);});document.getElementById('content').className='';document.getElementById('content').setAttribute('aria-busy','false');document.getElementById('content').innerHTML=state.view==='settings'?settings():state.view==='today'?today():followups();}
function busyButton(button,text){if(!button)return;button.dataset.label=button.textContent;button.disabled=true;button.textContent=text;}
function restoreButton(button){if(!button)return;button.disabled=false;button.textContent=button.dataset.label||button.textContent;}
function settings(){
  var mine=state.data.connections||[];
  var cards=mine.map(connectionCard).join('');
  var available=(state.data.providers||[]).filter(function(p){return !mine.some(function(c){return c.provider===p.providerKey;});}).map(function(p){
    var readOnly=p.supportsReadOnlyPublication;
    return '<article class="card connection"><h2>'+esc(providerName(p.providerKey))+'</h2><p><span class="status warn">'+(readOnly?'Read-only subscription':'Not connected')+'</span></p><p class="muted">'+(readOnly?'Calendar clients may subscribe; changes cannot sync back to MOS.':'Calendar authorization has not been activated for this deployment.')+'</p><button class="button secondary" disabled aria-disabled="true">'+(readOnly?'SUBSCRIPTION NOT CONFIGURED':'CONNECT NOT CONFIGURED')+'</button></article>';
  }).join('');
  return '<section class="card"><h2>MOS account</h2><p>Signed in to MOS as <b>'+esc(state.data.actor)+'</b>.</p><p class="muted">Your MOS account remains active whether or not you connect a calendar.</p></section><h2>Connected calendars</h2><div class="grid">'+(cards||'<article class="card"><p class="muted">No calendar connected. MOS FollowUps still work normally.</p></article>')+available+'</div>';
}
function connectionCard(c){
  var info=providerInfo(c.provider),attention=c.connectionStatus==='ATTENTION_REQUIRED'||!!c.lastError,health=c.connectionStatus==='CONNECTED'?(attention?'Needs attention':'Connected'):'Disconnected';
  return '<article class="card connection '+(attention?'attention':c.connectionStatus==='CONNECTED'?'connected':'')+'"><h2>'+esc(providerName(c.provider))+'</h2><p>'+esc(c.externalAccountDisplayName||'Connected account')+'</p><p><b>Calendar:</b> '+esc(c.externalCalendarDisplayName||'Selected calendar')+'</p><p><span class="status '+(attention?'bad':c.connectionStatus==='CONNECTED'?'ok':'warn')+'">'+esc(health)+'</span></p><p class="muted">Last successful sync: '+esc(c.lastSuccessfulSyncAt?localDate(c.lastSuccessfulSyncAt)+' '+localTime(c.lastSuccessfulSyncAt):'Not yet synced')+'</p>'+(attention?'<p class="form-error">'+esc(c.lastError||'Reconnect this calendar during controlled activation.')+'</p>':'')+'<div class="actions"><button class="button secondary" disabled aria-disabled="true">CHANGE NOT CONFIGURED</button>'+(attention?'<button class="button secondary" disabled aria-disabled="true">REAUTHORIZE DURING ACTIVATION</button>':'')+'<button class="button danger" onclick="disconnect(\''+esc(c.id)+'\',this)">DISCONNECT</button></div><p class="muted">'+(info.authorizationConfigured?'Provider service is configured; authorization controls are activated separately.':'Authorization controls are not active in this deployment.')+'</p></article>';
}
function followups(){var rows=(state.data.followUps||[]).sort(function(a,b){return new Date(a.dueAt)-new Date(b.dueAt);});return (state.data.calendarIntegrationEnabled===false?'<div class="card"><p><b>Calendar synchronization is disabled.</b> Existing schedules remain available in MOS and no external calendar actions will run.</p></div>':'')+'<div class="card"><h2>FollowUps</h2><p class="muted">Follow-up due is the business deadline. Scheduling is optional and separate.</p></div>'+(rows.length?rows.map(followCard).join(''):'<section class="card empty">No FollowUps are available yet.</section>');}
function followCard(f){
  var value=stateFor(f),item=link(f),connection=connectionFor(f),review=request(f),form=state.scheduleId===f.id?scheduleForm(f):'',reviewHtml=state.reviewId===f.id&&review?reviewPanel(f,review):'';
  var owner=ownerConnection(f),provider=item&&item.provider?providerName(item.provider):connection?providerName(connection.provider):owner?providerName(owner.provider):'No external calendar';
  var actions=isClosed(f)?'':(value==='UNSCHEDULED'||value==='NOT_CONNECTED'||value==='DISABLED'?'<button class="button primary" onclick="openSchedule(\''+esc(f.id)+'\')">SCHEDULE</button>':'<button class="button secondary" onclick="openSchedule(\''+esc(f.id)+'\')">RESCHEDULE</button>')+(review?'<button class="button primary" onclick="openReview(\''+esc(f.id)+'\')">REVIEW CHANGE</button><button class="button secondary" disabled aria-disabled="true">REASSIGN AFTER REVIEW</button>':'<button class="button secondary" onclick="ownerPrompt(\''+esc(f.id)+'\',this)">REASSIGN</button>');
  return '<article class="card follow '+value.toLowerCase()+'"><div class="detail"><div><h2>'+esc(f.title||'FollowUp')+'</h2><p class="account">'+esc(customer(f))+' · Owner: '+esc(f.ownerUserId||'Unassigned')+'</p><p><b>Follow-up due:</b> '+esc(localDate(f.dueAt)||'No deadline recorded')+'</p><p class="schedule"><b>Scheduled:</b> '+scheduled(f)+'</p><p><b>Connected calendar:</b> '+esc(provider)+' <span class="status '+statusClass(value)+'">'+esc(statusText(value))+'</span></p></div><div class="actions">'+actions+'</div></div>'+form+reviewHtml+'</article>';
}
function scheduleForm(f){
  var draft=state.draft&&state.draft.id===f.id?state.draft:{id:f.id,date:wallDate(f.startAt,f.timeZone)||localDate(f.dueAt),startTime:wallTime(f.startAt,f.timeZone),endTime:wallTime(f.endAt,f.timeZone),timeZone:f.timeZone||''};
  state.draft=draft;var suffix=esc(f.id);
  return '<form class="schedule-form" onsubmit="saveSchedule(event,\''+suffix+'\','+Number(f.version)+',\''+esc(request(f)&&request(f).id||'')+'\')"><h3>Schedule FollowUp</h3><p id="schedule-help-'+suffix+'" class="muted">Times are interpreted in the selected location. Your follow-up deadline will not change.</p><div class="grid"><div class="field"><label for="date-'+suffix+'">Date</label><input id="date-'+suffix+'" name="date" type="date" value="'+esc(draft.date)+'" required></div><div class="field"><label for="start-'+suffix+'">Start time</label><input id="start-'+suffix+'" name="startTime" type="time" value="'+esc(draft.startTime)+'" required></div><div class="field"><label for="end-'+suffix+'">End time</label><input id="end-'+suffix+'" name="endTime" type="time" value="'+esc(draft.endTime)+'" required></div><div class="field"><label for="zone-'+suffix+'">Time zone</label><input id="zone-'+suffix+'" name="timeZone" value="'+esc(draft.timeZone)+'" placeholder="America/Los_Angeles" required></div></div><p class="form-error" data-form-error aria-live="assertive"></p><div class="actions"><button class="button primary" type="submit">SAVE SCHEDULE</button><button class="button secondary" type="button" onclick="cancelSchedule()">CANCEL</button></div></form>';
}
function readDraft(form,id){return {id:id,date:form.date.value,startTime:form.startTime.value,endTime:form.endTime.value,timeZone:form.timeZone.value};}
function restoreSubmit(form,message){var button=form.querySelector('[type=submit]');button.disabled=false;button.textContent='SAVE SCHEDULE';var error=form.querySelector('[data-form-error]');if(error)error.textContent=message||'';}
function saveSchedule(event,id,version,reviewId){
  event.preventDefault();var form=event.currentTarget,button=form.querySelector('[type=submit]');if(button.disabled||state.busy.schedule)return;state.draft=readDraft(form,id);if(!form.reportValidity())return;
  if(state.draft.startTime>=state.draft.endTime){restoreSubmit(form,'End time must be after start time.');return;}
  state.busy.schedule=true;button.disabled=true;button.textContent='SAVING…';
  var payload={date:state.draft.date,startTime:state.draft.startTime,endTime:state.draft.endTime,timeZone:state.draft.timeZone};
  var name=reviewId?'resolveCalendarExternalChange':'scheduleFollowUp',args=reviewId?[reviewId,'RESCHEDULE',payload]:[id,payload,version];
  run(name,args,function(result){
    state.busy.schedule=false;state.scheduleId='';state.draft=null;
    var sync=result&&result.sync;var text=!sync||sync.result==='PUSHED'?'Schedule saved and synchronized.':sync.result==='NOT_CONNECTED'?'Schedule saved in MOS. No writable calendar is connected.':sync.result==='DISABLED'?'Schedule saved in MOS. Calendar synchronization is disabled.':sync.result==='NOT_CONFIGURED'?'Schedule saved in MOS. Calendar authorization is not configured.':'Schedule saved in MOS, but calendar synchronization needs attention.';
    note(text,sync&&(sync.result==='FAILED'||sync.result==='CONFLICT')?'error':'success');load();
  },function(message,uncertain){
    state.busy.schedule=false;restoreSubmit(form,uncertain?'The result could not be confirmed. MOS is being refreshed before you retry.':message);note(uncertain?'The result could not be confirmed. Refreshing MOS state now.':message,'error');if(uncertain)load(true);
  });
}
function openSchedule(id){state.scheduleId=id;state.reviewId='';state.draft=null;render();}
function cancelSchedule(){if(state.draft&&!confirm('Discard the unsaved schedule?'))return;state.scheduleId='';state.draft=null;render();}
function openReview(id){state.reviewId=id;state.scheduleId='';state.draft=null;render();}
function reviewPanel(f,r){
  if(r.changeType==='CLEANUP_FAILED')return '<section class="schedule-form review" aria-label="Calendar cleanup review"><h2>Previous calendar event needs attention</h2><p><b>'+esc(customer(f))+'</b> · '+esc(f.title)+'</p><p>Your MOS change was saved, but the previous calendar event could not be removed.</p><p class="muted">Retry the cleanup, or acknowledge that an orphan calendar event may remain. The FollowUp stays unchanged in MOS.</p><div class="actions"><button class="button primary" onclick="cleanupReview(\''+esc(r.id)+'\',\'RETRY\',this)">RETRY CLEANUP</button><button class="button secondary" onclick="cleanupReview(\''+esc(r.id)+'\',\'ACKNOWLEDGE\',this)">ACKNOWLEDGE</button></div></section>';
  var external=r.requestedStartAt?wallDate(r.requestedStartAt,r.requestedTimeZone)+' '+wallTime(r.requestedStartAt,r.requestedTimeZone)+' – '+wallTime(r.requestedEndAt,r.requestedTimeZone)+' '+r.requestedTimeZone:'The event was removed from the connected calendar.';
  var conflict=r.changeType==='CONFLICT';
  return '<section class="schedule-form review" aria-label="Calendar change review"><h2>'+(conflict?'Calendar conflict':'Calendar event deleted')+'</h2><p><b>'+esc(customer(f))+'</b> · '+esc(f.title)+'</p><div class="pair"><div class="schedule-box"><b>MOS schedule</b><br>'+scheduled(f)+'</div><div class="schedule-box"><b>Calendar schedule</b><br>'+esc(external)+'</div></div><p class="muted">The MOS FollowUp still exists. Choose the authoritative next step.</p><div class="actions">'+(conflict?'<button class="button secondary" onclick="resolveReview(\''+esc(r.id)+'\',\'KEEP_FOLLOW_UP\',this)">USE MOS TIME</button><button class="button primary" onclick="resolveReview(\''+esc(r.id)+'\',\'USE_CALENDAR_TIME\',this)">USE CALENDAR TIME</button><button class="button secondary" onclick="openSchedule(\''+esc(f.id)+'\')">CHOOSE ANOTHER TIME</button>':'<button class="button secondary" onclick="resolveReview(\''+esc(r.id)+'\',\'KEEP_FOLLOW_UP\',this)">KEEP FOLLOW-UP</button><button class="button primary" onclick="openSchedule(\''+esc(f.id)+'\')">RESCHEDULE</button><button class="button secondary" onclick="resolveReview(\''+esc(r.id)+'\',\'MARK_COMPLETE\',this)">MARK COMPLETE</button><button class="button danger" onclick="resolveReview(\''+esc(r.id)+'\',\'CANCEL_FOLLOW_UP\',this)">CANCEL FOLLOW-UP</button>')+'</div></section>';
}
function cleanupReview(id,action,button){if(state.busy.review)return;state.busy.review=true;busyButton(button,action==='RETRY'?'RETRYING…':'ACKNOWLEDGING…');var endpoint=action==='RETRY'?'retryCalendarCleanup':'acknowledgeCalendarCleanup';run(endpoint,[id],function(result){state.busy.review=false;if(result&&result.result==='FAILED'){restoreButton(button);note(result.error||'Cleanup still needs attention.','error');load();return;}note(action==='RETRY'?'Previous calendar cleanup completed.':'Cleanup issue acknowledged. The external event may still remain.','success');load();},function(message,uncertain){state.busy.review=false;restoreButton(button);note(uncertain?'The result is uncertain. MOS will refresh before another action.':message,'error');if(uncertain)load();});}
function resolveReview(id,action,button){if(state.busy.review)return;state.busy.review=true;busyButton(button,'WORKING…');run('resolveCalendarExternalChange',[id,action,{}],function(result){state.busy.review=false;var sync=result&&result.sync;var message=sync&&sync.result==='PUSHED'?'Calendar review resolved and the MOS schedule was synchronized.':sync&&(sync.result==='FAILED'||sync.result==='NOT_CONFIGURED')?'Review resolved in MOS, but calendar reconciliation still needs attention.':'Calendar review resolved.';note(message,sync&&(sync.result==='FAILED'||sync.result==='NOT_CONFIGURED')?'error':'success');load();},function(message,uncertain){state.busy.review=false;restoreButton(button);note(uncertain?'The result is uncertain. MOS will refresh before another action.':message,'error');if(uncertain)load();});}
function today(){var rows=(state.data.followUps||[]).filter(function(f){return f.startAt&&!isClosed(f);}).sort(function(a,b){return new Date(a.startAt)-new Date(b.startAt);});return '<section class="card"><h2>Operational schedule</h2><p class="muted">Scheduled MOS FollowUps in time order. Your connected calendar remains your complete calendar.</p>'+(rows.length?rows.map(function(f){return '<div class="day"><time>'+esc(wallTime(f.startAt,f.timeZone))+' – '+esc(wallTime(f.endAt,f.timeZone))+'</time><div><b>'+esc(customer(f))+'</b><br>'+esc(f.title||'FollowUp')+'<br><span class="status '+statusClass(stateFor(f))+'">'+esc(statusText(stateFor(f)))+'</span> <span class="muted">Owner: '+esc(f.ownerUserId||'Unassigned')+' · '+esc(f.timeZone)+'</span></div></div>';}).join(''):'<p class="empty">No scheduled FollowUps yet. Unscheduled deadlines remain valid in MOS.</p>')+'</section>';}
function disconnect(id,button){if(state.busy.disconnect||!confirm('Disconnect this calendar? MOS FollowUps and history will remain.'))return;state.busy.disconnect=true;busyButton(button,'DISCONNECTING…');run('disconnectCalendarConnection',[id],function(result){state.busy.disconnect=false;var attention=(result.cleanup||[]).some(function(item){return item.result==='FAILED'||item.result==='NOT_CONFIGURED';});note(attention?'Calendar disconnected. Some external events require reconciliation.':'Calendar disconnected. MOS FollowUps remain active.',attention?'error':'success');load();},function(message,uncertain){state.busy.disconnect=false;restoreButton(button);note(uncertain?'Disconnect result is uncertain. Refreshing MOS before retry.':message,'error');if(uncertain)load();});}
function ownerPrompt(id,button){var f=(state.data.followUps||[]).filter(function(item){return item.id===id;})[0],owner=prompt('Assign this FollowUp to which MOS user?',f.ownerUserId);if(!owner||owner===f.ownerUserId||state.busy.reassign)return;state.busy.reassign=true;busyButton(button,'REASSIGNING…');run('reassignFollowUp',[id,owner,f.version],function(result){state.busy.reassign=false;var sync=result.sync||{},cleanup=result.cleanup||{};var text=sync.result==='PUSHED'?'FollowUp reassigned and synchronized to the new owner.':sync.result==='NOT_CONNECTED'?'FollowUp reassigned. The new owner has no writable calendar, so it remains active only in MOS.':'FollowUp reassigned in MOS. Calendar reconciliation needs attention.';if(cleanup.result==='FAILED'||cleanup.result==='NOT_CONFIGURED')text+=' The previous calendar event also requires review.';note(text,(sync.result==='FAILED'||cleanup.result==='FAILED')?'error':'success');load();},function(message,uncertain){state.busy.reassign=false;restoreButton(button);note(uncertain?'Reassignment result is uncertain. Refreshing MOS before retry.':message,'error');if(uncertain)load();});}
load();
</script>
