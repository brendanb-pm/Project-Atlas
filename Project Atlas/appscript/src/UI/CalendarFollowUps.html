<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#182129;--paper:#f4f6f7;--panel:#fff;--line:#dbe1e4;--accent:#d57b1e;--ok:#13763e;--bad:#ad2b2b;--warn:#9c6800}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.head h1{margin:0}.muted{color:#63727b}.tabs,.actions{display:flex;gap:9px;flex-wrap:wrap}.tab,.button{min-height:44px;border:1px solid #b7c4ca;border-radius:5px;background:#fff;padding:0 14px;font-weight:700;cursor:pointer;font:inherit}.tab.active,.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.button.secondary{background:#e6ecee}.button.danger{background:#fff0f0;border-color:#d78282;color:#8d2020}.button[disabled]{opacity:.6;cursor:wait}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:18px;margin:16px 0;box-shadow:0 2px 7px rgba(20,34,42,.04)}.connection{border-left:5px solid #89999f}.connection.connected{border-left-color:var(--ok)}.connection.attention,.connection.error{border-left-color:var(--bad)}.connection h2,.card h2{font-size:19px;margin:0 0 5px}.status{display:inline-block;border-radius:999px;padding:4px 9px;background:#e8edef;color:#40515b;font-weight:700;font-size:13px}.status.ok{background:#dcf3e4;color:#0b6230}.status.warn{background:#fff1d9;color:#8b5700}.status.bad{background:#ffe2e2;color:#8c2020}.field{display:flex;flex-direction:column;gap:5px;font-weight:700}.field input,.field select{min-height:44px;border:1px solid #aebdc4;border-radius:4px;padding:8px;font:inherit}.detail{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}.follow{border-left:5px solid #738b96}.follow.unscheduled{border-left-color:var(--warn)}.follow.conflict,.follow.error{border-left-color:var(--bad)}.schedule{font-size:18px;font-weight:700;margin:6px 0}.schedule-form{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.review{border:2px solid #c9811b}.review h2{color:#764704}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.schedule-box{background:#f5f8f9;border:1px solid var(--line);padding:12px;border-radius:5px}.day{display:grid;grid-template-columns:115px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.day time{font-weight:700;color:#374a54}.empty,.error,.loading{padding:28px;text-align:center;color:#62727a}.error{color:#8c2020}.toast{position:fixed;right:16px;top:16px;z-index:10;max-width:400px;padding:12px 14px;border-radius:5px;color:#fff;font-weight:700;background:#265c73}.toast.error{background:var(--bad)}.toast.success{background:var(--ok)}.toast[hidden]{display:none}.account{font-size:13px;color:#56666f}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}.wrap{padding:16px}}@media(max-width:600px){.wrap{padding:12px}.head{flex-direction:column}.grid,.two,.pair{grid-template-columns:1fr}.tab,.button{flex:1}.day{grid-template-columns:1fr}.actions .button{min-width:calc(50% - 5px)}}
</style></head><body><main class="wrap"><header class="head"><div><h1>Follow-up Calendar</h1><p class="muted">Your MOS account controls access. A connected calendar is optional and only synchronizes scheduled FollowUps.</p></div><div class="tabs"><button class="tab active" data-view="followups" onclick="view('followups')">FollowUps</button><button class="tab" data-view="today" onclick="view('today')">Today</button><button class="tab" data-view="settings" onclick="view('settings')">Calendar Settings</button></div></header><section id="content" class="loading card">Loading FollowUps…</section></main><div id="toast" class="toast" hidden></div><script>
var state={view:'followups',data:null,busy:{},scheduleId:'',reviewId:''};function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function note(text,type){var el=document.getElementById('toast');el.textContent=text;el.className='toast '+(type||'');el.hidden=false;setTimeout(function(){el.hidden=true},4200)}function run(name,args,ok){google.script.run.withSuccessHandler(function(r){if(!r||!r.ok){note((r&&r.error&&r.error.message)||'That action could not be completed.','error');return}ok(r.data)}).withFailureHandler(function(e){note((e&&e.message)||'Connection error.','error')})[name].apply(google.script.run,args||[])}function load(){run('getCalendarWorkspace',[],function(data){state.data=data;render()})}function view(name){state.view=name;state.scheduleId='';state.reviewId='';render()}function providerName(key){return {GOOGLE_CALENDAR:'Google Calendar',MICROSOFT_GRAPH_CALENDAR:'Microsoft Outlook',APPLE_ICLOUD_CALENDAR:'Apple / iCloud',ICAL_PUBLICATION:'iCal subscription'}[key]||'Connected calendar'}function humanConnection(c){if(!c)return 'Calendar not connected';if(c.connectionStatus==='ATTENTION_REQUIRED')return 'Reconnect calendar';if(c.lastError)return 'Sync error';return c.connectionStatus==='CONNECTED'?'Connected':c.connectionStatus==='DISCONNECTED'?'Disconnected':'Calendar not connected'}function customer(f){var row=(state.data.customers||[]).filter(function(c){return c.id===f.customerId})[0];return row&&(row.name||row.companyName)||f.customerId||'Customer not assigned'}function link(f){return (state.data.links||[]).filter(function(l){return l.followUpId===f.id})[0]}function request(f){return (state.data.requests||[]).filter(function(r){return r.followUpId===f.id})[0]}function connectionFor(f){var l=link(f);return l&&(state.data.connections||[]).filter(function(c){return c.id===l.connectionId})[0]}function stateFor(f){var r=request(f),l=link(f),c=connectionFor(f);if(r)return r.changeType==='CONFLICT'?'CONFLICT':'EXTERNAL_CHANGE';if(!f.startAt||!f.endAt||!f.timeZone)return 'UNSCHEDULED';if(!l)return 'NOT_CONNECTED';if(c&&c.connectionStatus==='ATTENTION_REQUIRED')return 'ATTENTION_REQUIRED';if(c&&c.lastError)return 'ERROR';return 'SYNCED'}function statusText(s){return {NOT_CONNECTED:'Calendar not connected',UNSCHEDULED:'Not scheduled',PENDING:'Syncing',SYNCED:'Synced',EXTERNAL_CHANGE:'Calendar changed',CONFLICT:'Needs review',ERROR:'Sync error',ATTENTION_REQUIRED:'Reconnect calendar'}[s]||s}function statusClass(s){return s==='SYNCED'?'ok':(s==='CONFLICT'||s==='ERROR'||s==='ATTENTION_REQUIRED')?'bad':'warn'}function localDate(v){if(!v)return '';return String(v).slice(0,10)}function localTime(v){if(!v)return '';var d=new Date(v);return isNaN(d)?'':d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}function scheduled(f){return f.startAt?localDate(f.startAt)+' · '+localTime(f.startAt)+' – '+localTime(f.endAt)+'<br><span class="muted">'+esc(f.timeZone)+'</span>':'Not scheduled'}function render(){document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.view===state.view)});var out=state.view==='settings'?settings():state.view==='today'?today():followups();document.getElementById('content').className='';document.getElementById('content').innerHTML=out}function settings(){var mine=state.data.connections||[],cards=mine.map(connectionCard).join('');var providers=(state.data.providers||[]).filter(function(p){return !mine.some(function(c){return c.provider===p.providerKey})}).map(function(p){var ro=p.supportsReadOnlyPublication;return '<article class="card connection"><h2>'+esc(providerName(p.providerKey))+'</h2><p><span class="status '+(ro?'warn':'')+'">'+(ro?'Read-only subscription':'Not connected')+'</span></p><p class="muted">'+(ro?'Calendar clients may subscribe; scheduling cannot sync back to MOS.':'Connect this calendar separately from your MOS account.')+'</p><button class="button secondary" onclick="connectInfo(\''+esc(p.providerKey)+'\')">CONNECT</button></article>'}).join('');return '<section class="card"><h2>MOS account</h2><p>Signed in to MOS as <b>'+esc(state.data.actor)+'</b>.</p><p class="muted">Connecting a calendar grants optional schedule synchronization. It does not change your MOS login.</p></section><h2>Connected calendars</h2><div class="grid">'+(cards||'<article class="card"><p class="muted">No calendar connected. MOS FollowUps still work normally.</p></article>')+providers+'</div>'}function connectionCard(c){var health=humanConnection(c),cls=health==='Connected'?'connected':health==='Reconnect calendar'||health==='Sync error'?'attention':'';return '<article class="card connection '+cls+'"><h2>'+esc(providerName(c.provider))+'</h2><p>'+esc(c.externalAccountDisplayName||'Connected account')+'</p><p><b>Calendar:</b> '+esc(c.externalCalendarDisplayName||'Selected calendar')+'</p><p><span class="status '+(cls?'bad':'ok')+'">'+esc(health)+'</span></p><p class="muted">Last successful sync: '+esc(c.lastSuccessfulSyncAt?localDate(c.lastSuccessfulSyncAt)+' '+localTime(c.lastSuccessfulSyncAt):'Not yet synced')+'</p><div class="actions"><button class="button secondary" onclick="connectInfo(\''+esc(c.provider)+'\')">CHANGE CALENDAR</button>'+(c.lastError||c.connectionStatus==='ATTENTION_REQUIRED'?'<button class="button primary" onclick="retry(\''+esc(c.id)+'\')">RETRY</button>':'')+'<button class="button danger" onclick="disconnect(\''+esc(c.id)+'\')">DISCONNECT</button></div></article>'}function connectInfo(provider){note(providerName(provider)+' authorization is configured separately. No account is connected from this screen.','')}function followups(){var rows=(state.data.followUps||[]).sort(function(a,b){return new Date(a.dueAt)-new Date(b.dueAt)});return '<div class="card"><h2>FollowUps</h2><p class="muted">Due At is your business deadline. A scheduled block is optional and is the only thing that can appear on a connected calendar.</p></div>'+(rows.length?rows.map(followCard).join(''):'<section class="card empty">No FollowUps are available yet.</section>')}function followCard(f){var s=stateFor(f),c=connectionFor(f),r=request(f),form=state.scheduleId===f.id?scheduleForm(f):'',review=state.reviewId===f.id&&r?reviewPanel(f,r):'';return '<article class="card follow '+s.toLowerCase()+'"><div class="detail"><div><h2>'+esc(f.title)+'</h2><p class="account">'+esc(customer(f))+' · Owner: '+esc(f.ownerUserId)+'</p><p><b>Follow-up due:</b> '+esc(localDate(f.dueAt)||'No deadline recorded')+'</p><p class="schedule"><b>Scheduled:</b> '+scheduled(f)+'</p><p><b>Calendar:</b> '+esc(c?providerName(c.provider):'Not scheduled')+' <span class="status '+statusClass(s)+'">'+esc(statusText(s))+'</span></p></div><div class="actions">'+(s==='UNSCHEDULED'||s==='NOT_CONNECTED'?'<button class="button primary" onclick="openSchedule(\''+esc(f.id)+'\')">SCHEDULE</button>':'<button class="button secondary" onclick="openSchedule(\''+esc(f.id)+'\')">RESCHEDULE</button>')+(r?'<button class="button primary" onclick="openReview(\''+esc(f.id)+'\')">REVIEW CHANGE</button>':'')+'<button class="button secondary" onclick="ownerPrompt(\''+esc(f.id)+'\')">REASSIGN</button></div></div>'+form+review+'</article>'}function scheduleForm(f){return '<form class="schedule-form" onsubmit="saveSchedule(event,\''+esc(f.id)+'\','+Number(f.version)+')"><h3>Schedule FollowUp</h3><div class="grid"><div class="field"><label>Date</label><input name="date" type="date" value="'+esc(localDate(f.startAt)||localDate(f.dueAt))+'" required></div><div class="field"><label>Start time</label><input name="start" type="time" value="'+esc(f.startAt?String(f.startAt).slice(11,16):'')+'" required></div><div class="field"><label>End time</label><input name="end" type="time" value="'+esc(f.endAt?String(f.endAt).slice(11,16):'')+'" required></div><div class="field"><label>Time zone</label><input name="timeZone" value="'+esc(f.timeZone||'America/Los_Angeles')+'" placeholder="America/Los_Angeles" required></div></div><p class="muted">The selected time zone is shown to you and sent with the scheduled block. The deadline is not changed.</p><div class="actions"><button class="button primary" type="submit">SAVE SCHEDULE</button><button class="button secondary" type="button" onclick="state.scheduleId=\'\';render()">CANCEL</button></div></form>'}function saveSchedule(e,id,version){e.preventDefault();var form=e.currentTarget,button=form.querySelector('[type=submit]');if(button.disabled||!form.reportValidity())return;var d=form.date.value,start=form.start.value,end=form.end.value;if(start>=end){note('End time must be after start time.','error');return}button.disabled=true;button.textContent='SAVING…';var schedule={startAt:d+'T'+start+':00Z',endAt:d+'T'+end+':00Z',timeZone:form.timeZone.value};run('scheduleFollowUp',[id,schedule,version],function(){state.scheduleId='';note('Schedule saved. The deadline was not changed.','success');load()})}function openSchedule(id){state.scheduleId=id;state.reviewId='';render()}function openReview(id){state.reviewId=id;state.scheduleId='';render()}function reviewPanel(f,r){var external=r.requestedStartAt?localDate(r.requestedStartAt)+' '+localTime(r.requestedStartAt)+' – '+localTime(r.requestedEndAt)+' '+r.requestedTimeZone:'The event was deleted from the connected calendar.';var title=r.changeType==='CONFLICT'?'Calendar conflict':'Calendar event deleted';return '<section class="schedule-form review"><h2>'+esc(title)+'</h2><p><b>'+esc(customer(f))+'</b> · '+esc(f.title)+'</p><div class="pair"><div class="schedule-box"><b>MOS schedule</b><br>'+scheduled(f)+'</div><div class="schedule-box"><b>Calendar change</b><br>'+esc(external)+'</div></div><p class="muted">Your MOS FollowUp is still intact. Choose what should happen next.</p><div class="actions">'+(r.changeType==='CONFLICT'?'<button class="button secondary" onclick="resolve(\''+esc(r.id)+'\',\'KEEP_FOLLOW_UP\')">USE MOS TIME</button><button class="button primary" onclick="resolve(\''+esc(r.id)+'\',\'USE_CALENDAR_TIME\')">USE CALENDAR TIME</button><button class="button secondary" onclick="openSchedule(\''+esc(f.id)+'\')">CHOOSE ANOTHER TIME</button>':'<button class="button secondary" onclick="resolve(\''+esc(r.id)+'\',\'KEEP_FOLLOW_UP\')">KEEP FOLLOW-UP</button><button class="button primary" onclick="openSchedule(\''+esc(f.id)+'\')">RESCHEDULE</button><button class="button secondary" onclick="resolve(\''+esc(r.id)+'\',\'MARK_COMPLETE\')">MARK COMPLETE</button><button class="button danger" onclick="resolve(\''+esc(r.id)+'\',\'CANCEL_FOLLOW_UP\')">CANCEL FOLLOW-UP</button>')+'</div></section>'}function resolve(id,action){run('resolveCalendarExternalChange',[id,action,{}],function(){note('Calendar review resolved.','success');load()})}function today(){var rows=(state.data.followUps||[]).filter(function(f){return f.startAt}).sort(function(a,b){return new Date(a.startAt)-new Date(b.startAt)});return '<section class="card"><h2>Operational schedule</h2><p class="muted">A lightweight MOS view of scheduled work; it does not replace your full calendar.</p>'+(rows.length?rows.map(function(f){return '<div class="day"><time>'+esc(localTime(f.startAt))+' – '+esc(localTime(f.endAt))+'</time><div><b>'+esc(customer(f))+'</b><br>'+esc(f.title)+'<br><span class="status '+statusClass(stateFor(f))+'">'+esc(statusText(stateFor(f)))+'</span> <span class="muted">Owner: '+esc(f.ownerUserId)+'</span></div></div>'}).join(''):'<p class="empty">No scheduled FollowUps yet. Unscheduled deadlines remain valid in MOS.</p>')+'</section>'}function disconnect(id){if(!confirm('Disconnect this calendar? Your MOS FollowUps and history will remain.'))return;run('disconnectCalendarConnection',[id],function(){note('Calendar disconnected. MOS FollowUps remain active.','success');load()})}function retry(id){run('retryCalendarConnection',[id],function(){note('Connection retry requested.','success');load()})}function ownerPrompt(id){var f=(state.data.followUps||[]).filter(function(x){return x.id===id})[0],owner=prompt('Assign this FollowUp to which MOS user?',f.ownerUserId);if(!owner||owner===f.ownerUserId)return;run('reassignFollowUp',[id,owner,f.version],function(){var connected=(state.data.connections||[]).some(function(c){return c.userId===owner&&c.connectionStatus==='CONNECTED'});note(connected?'FollowUp reassigned; calendar projection can move to the new owner.':'FollowUp reassigned. The new owner has no writable calendar connected, so it remains active in MOS.','success');load()})}load();
</script></body></html>

<script>
/* Resolve a pending review and its operator-entered schedule in one operation. */
scheduleForm=function(f){var r=request(f);return '<form class="schedule-form" onsubmit="saveScheduleForReview(event,\''+esc(f.id)+'\','+Number(f.version)+',\''+esc(r&&r.id||'')+'\')"><h3>Schedule FollowUp</h3><div class="grid"><div class="field"><label>Date</label><input name="date" type="date" value="'+esc(localDate(f.startAt)||localDate(f.dueAt))+'" required></div><div class="field"><label>Start time</label><input name="start" type="time" required></div><div class="field"><label>End time</label><input name="end" type="time" required></div><div class="field"><label>Time zone</label><input name="timeZone" value="'+esc(f.timeZone||'America/Los_Angeles')+'" required></div></div><div class="actions"><button class="button primary" type="submit">SAVE SCHEDULE</button><button class="button secondary" type="button" onclick="state.scheduleId=\'\';render()">CANCEL</button></div></form>';};
function saveScheduleForReview(e,id,version,reviewId){e.preventDefault();var form=e.currentTarget,button=form.querySelector('[type=submit]');if(button.disabled||!form.reportValidity())return;var date=form.date.value,start=form.start.value,end=form.end.value;if(start>=end){note('End time must be after start time.','error');return}button.disabled=true;button.textContent='SAVING…';var schedule={startAt:date+'T'+start+':00Z',endAt:date+'T'+end+':00Z',timeZone:form.timeZone.value},name=reviewId?'resolveCalendarExternalChange':'scheduleFollowUp',args=reviewId?[reviewId,'RESCHEDULE',schedule]:[id,schedule,version];run(name,args,function(){state.scheduleId='';note('Schedule saved. The deadline was not changed.','success');load()});}
</script>
