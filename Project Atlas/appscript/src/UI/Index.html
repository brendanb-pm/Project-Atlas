<!doctype html><html><head><base target="_top"><style>body{font:14px Arial;margin:20px;max-width:960px}fieldset{margin:12px 0;padding:12px}input,select,button{margin:4px;padding:7px}table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border:1px solid #ddd;padding:6px;text-align:left}.error{color:#a00;white-space:pre-wrap}.success{color:#067a28;white-space:pre-wrap}.hidden{display:none}</style></head><body>
<h1>VMOS MVP</h1><p>Customer to RFQ to Quote to Job to Invoice</p><div id="message" class="error"></div><div id="confirmation" class="success"></div><div id="forms"></div><div id="editor"></div><div id="lists"></div>
<script>
const config={Customer:[['name','Customer name'],['email','Email'],['phone','Phone']],RFQ:[['customerId','Customer ID'],['description','Description'],['dueDate','Due date']],Quote:[['rfqId','RFQ ID'],['customerId','Customer ID (optional)'],['total','Total']],Job:[['quoteId','Quote ID'],['customerId','Customer ID (optional)'],['dueDate','Due date']],Invoice:[['jobId','Job ID'],['customerId','Customer ID (optional)'],['total','Total'],['dueDate','Due date']]};
let currentData={};
function esc(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function form(entity){return '<fieldset><legend>New '+entity+'</legend><form onsubmit="submitForm(event,\''+entity+'\')">'+config[entity].map(x=>'<label>'+x[1]+' <input name="'+x[0]+'"></label>').join('')+'<button>Create</button></form></fieldset>'}
function submitForm(event,entity){event.preventDefault();let input=Object.fromEntries(new FormData(event.target));google.script.run.withSuccessHandler(result=>{if(!result.ok)return show(result.error.message);event.target.reset();confirm('Created '+entity+' '+result.data.id+'.');load(entity);}).createMvpRecord(entity,input)}
function show(message){document.querySelector('#message').textContent=message||'';if(message)document.querySelector('#confirmation').textContent=''}
function confirm(message){document.querySelector('#confirmation').textContent=message||'';document.querySelector('#message').textContent=''}
function load(focusEntity){google.script.run.withSuccessHandler(result=>{if(!result.ok)return show(result.error.message);currentData=result.data;document.querySelector('#lists').innerHTML=Object.keys(currentData).map(e=>'<section id="section-'+e+'"><h2>'+e+'s</h2>'+table(e,currentData[e])+'</section>').join('');if(focusEntity){const section=document.querySelector('#section-'+focusEntity);if(section)section.scrollIntoView();}}).getMvpBootstrap()}
function table(entity,rows){if(!rows.length)return '<p>No records.</p>';let keys=Object.keys(rows[0]);return '<table><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'<td><button data-entity="'+esc(entity)+'" data-id="'+esc(r.id)+'" onclick="startEdit(this.dataset.entity,this.dataset.id)">Edit</button></td></tr>').join('')+'</tbody></table>'}
function startEdit(entity,id){const record=(currentData[entity]||[]).find(row=>String(row.id)===String(id));if(!record)return show('Record not found. Refresh and try again.');const fields=Object.keys(record).filter(key=>!['id','createdAt','updatedAt','createdBy','updatedBy'].includes(key));document.querySelector('#editor').innerHTML='<fieldset><legend>Edit '+esc(entity)+' '+esc(id)+'</legend><form onsubmit="saveEdit(event,\''+esc(entity)+'\',\''+esc(id)+'\')"><label>ID <input value="'+esc(id)+'" disabled></label>'+fields.map(key=>'<label>'+esc(key)+' <input name="'+esc(key)+'" value="'+esc(record[key])+'"></label>').join('')+'<button>Save Changes</button><button type="button" onclick="cancelEdit()">Cancel</button></form></fieldset>';document.querySelector('#editor').scrollIntoView();}
function saveEdit(event,entity,id){event.preventDefault();const original=(currentData[entity]||[]).find(row=>String(row.id)===String(id));if(!original)return show('Record not found. Refresh and try again.');const submitted=Object.fromEntries(new FormData(event.target));const changes={};Object.keys(submitted).forEach(key=>{if(String(submitted[key])!==String(original[key]??''))changes[key]=submitted[key];});if(!Object.keys(changes).length)return confirm('No changes to save.');google.script.run.withSuccessHandler(result=>{if(!result.ok)return show(result.error.message);cancelEdit();confirm('Saved changes to '+entity+' '+id+'.');load(entity);}).updateMvpRecord(entity,id,changes)}
function cancelEdit(){document.querySelector('#editor').innerHTML=''}
document.querySelector('#forms').innerHTML=Object.keys(config).map(form).join('');load();
</script></body></html>
