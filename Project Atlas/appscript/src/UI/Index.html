<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ink:#182129;--ink-2:#24313a;--steel:#50616c;--paper:#f4f6f7;--panel:#fff;--line:#dbe1e4;--accent:#d57b1e;--accent-dark:#a95609;--ok:#13763e;--bad:#ad2b2b;--warn:#9c6800;--shadow:0 8px 24px rgba(23,34,42,.1)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#1a242b;font:15px/1.4 Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:64px 1fr}.topbar{grid-column:1/-1;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 24px;gap:16px}.brand{font-weight:700;letter-spacing:.04em}.brand small{display:block;font-size:10px;color:#b8c4ca;letter-spacing:.12em}.profile{margin-left:auto;color:#cbd5da;font-size:13px}.menu-toggle{display:none;background:transparent;border:1px solid #61717a;color:white}.sidebar{background:var(--ink-2);padding:18px 12px}.nav-label{color:#91a3ac;font-size:11px;font-weight:700;letter-spacing:.1em;margin:0 10px 8px}.nav-button{width:100%;border:0;background:transparent;color:#d7e0e4;text-align:left;padding:12px 14px;margin:2px 0;border-radius:4px;font:inherit;cursor:pointer;min-height:44px}.nav-button:hover,.nav-button:focus-visible{background:#33434d;outline:2px solid #9ec1cc;outline-offset:1px}.nav-button.active{background:#41545f;color:#fff;border-left:4px solid var(--accent);padding-left:10px}.workspace{padding:26px;min-width:0}.page-head{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;margin-bottom:18px}.page-head h1{font-size:25px;margin:0}.page-head p{margin:4px 0 0;color:#687780}.button{min-height:44px;border:0;border-radius:4px;padding:0 16px;font-weight:700;cursor:pointer;background:var(--ink-2);color:#fff}.button:hover{background:#354752}.button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #75a9bd;outline-offset:2px}.button.primary{background:var(--accent)}.button.primary:hover{background:var(--accent-dark)}.button.secondary{background:#e6ecee;color:#24313a}.button[disabled]{opacity:.6;cursor:wait}.toolbar{display:flex;align-items:center;gap:12px;margin:14px 0}.search{min-height:44px;border:1px solid #b8c4c9;border-radius:4px;padding:0 12px;max-width:360px;width:100%;font:inherit}.count{color:#5e6c74;font-size:13px}.surface{background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(23,34,42,.04);border-radius:6px}.form-card{padding:18px;margin:16px 0}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:13px;font-weight:700;color:#40515b}.required:after{content:' *';color:var(--bad)}.field input,.field textarea{font:inherit;border:1px solid #aebdc4;border-radius:4px;min-height:42px;padding:9px;background:#fff}.field textarea{min-height:76px;resize:vertical}.form-actions{display:flex;gap:10px;margin-top:16px}.list-wrap{overflow:auto}.record-table{border-collapse:collapse;width:100%;min-width:680px}.record-table th{background:#eef2f3;color:#4b5b64;font-size:12px;letter-spacing:.03em;text-transform:uppercase}.record-table th,.record-table td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;vertical-align:middle}.record-table tbody tr:hover{background:#f8fafb}.record-table tr.highlight{animation:flash 2.5s ease-out;background:#fff2dd}@keyframes flash{to{background:transparent}}.record-table .id{font-family:Consolas,monospace;font-size:12px;font-weight:700}.row-action{min-height:36px;padding:0 10px;background:#e8edef;color:#27363e}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,.65fr);gap:20px}.detail{padding:18px;position:sticky;top:16px;align-self:start}.detail h2{font-size:18px;margin:0}.detail-meta{color:#66757e;margin:3px 0 16px}.status{display:inline-block;border-radius:999px;background:#e9eef0;color:#40515b;padding:3px 9px;font-size:12px;font-weight:700}.audit{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;color:#63717a;font-size:12px}.audit dt{font-weight:700;float:left;clear:left;margin-right:8px}.audit dd{margin:0 0 5px}.cards{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:14px;margin-bottom:22px}.metric{padding:16px}.metric b{display:block;font-size:27px;color:var(--ink)}.metric span{font-size:13px;color:#64737c}.recent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.recent{padding:16px}.recent h2{font-size:16px;margin:0 0 10px}.recent button{border:0;background:transparent;padding:8px 0;width:100%;text-align:left;color:#1e4e64;cursor:pointer;border-bottom:1px solid var(--line)}.empty,.loading,.error-state{padding:28px;text-align:center;color:#65757e}.loading:before{content:'';display:inline-block;width:18px;height:18px;border:3px solid #c5d0d5;border-top-color:var(--accent);border-radius:50%;vertical-align:-4px;margin-right:8px;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast-region{position:fixed;right:20px;top:78px;z-index:20;display:grid;gap:9px;max-width:420px}.toast{padding:12px 14px;border-radius:5px;color:#fff;box-shadow:var(--shadow);font-weight:700}.toast.success{background:var(--ok)}.toast.error{background:var(--bad)}.toast.warning{background:var(--warn)}.toast.info{background:#265c73}.busy{position:fixed;inset:0;background:rgba(16,27,34,.18);z-index:15;display:flex;align-items:center;justify-content:center;pointer-events:none}.busy-card{background:#fff;padding:14px 18px;border-radius:5px;box-shadow:var(--shadow);font-weight:700}.hidden{display:none}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.detail{position:static}.recent-grid{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:58px auto 1fr}.topbar{padding:0 14px}.menu-toggle{display:block}.sidebar{display:none;padding:10px}.app.nav-open .sidebar{display:block}.profile{display:none}.workspace{padding:16px}.page-head{align-items:stretch;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.search{max-width:none}.record-table{min-width:600px}.toast-region{left:12px;right:12px;top:66px}.detail{padding:15px}}
</style></head><body><div class="app" id="app">
<header class="topbar"><button class="menu-toggle" aria-label="Toggle navigation" onclick="toggleNav()">Menu</button><div class="brand">VMOS<small>PROJECT ATLAS / VITALITY MANUFACTURING OPERATING SYSTEM</small></div><div class="profile">Manufacturing Operations</div></header>
<aside class="sidebar" aria-label="Primary navigation"><p class="nav-label">WORKSPACE</p><nav id="navigation"></nav></aside>
<main class="workspace" id="workspace" aria-live="polite"></main></div><div class="toast-region" id="toasts" aria-live="assertive" aria-atomic="true"></div><div class="busy hidden" id="busy" aria-live="polite"><div class="busy-card">Saving...</div></div>
<script>
const entities=['Customer','RFQ','Quote','Job','Invoice'];
const config={Customer:{plural:'Customers',create:[['name','Company name','text',true],['email','Email','email'],['phone','Phone','tel']],columns:[['id','Customer ID'],['name','Company'],['primaryContact','Primary Contact'],['email','Email'],['phone','Phone']]},RFQ:{plural:'RFQs',create:[['customerId','Customer ID','text',true],['description','Description','text',true],['dueDate','Due date','date']],columns:[['id','RFQ ID'],['customerId','Customer'],['description','Description'],['dueDate','Due Date'],['status','Status']]},Quote:{plural:'Quotes',create:[['rfqId','RFQ ID','text',true],['customerId','Customer ID','text'],['total','Total','number']],columns:[['id','Quote ID'],['rfqId','RFQ'],['customerId','Customer'],['total','Total'],['status','Status']]},Job:{plural:'Jobs',create:[['quoteId','Quote ID','text',true],['customerId','Customer ID','text'],['dueDate','Due date','date']],columns:[['id','Job ID'],['customerId','Customer'],['partId','Part'],['quantity','Quantity'],['dueDate','Due Date'],['status','Status'],['machine','Machine']]},Invoice:{plural:'Invoices',create:[['jobId','Job ID','text',true],['customerId','Customer ID','text'],['total','Total','number'],['dueDate','Due date','date']],columns:[['id','Invoice ID'],['jobId','Job'],['customerId','Customer'],['invoiceDate','Invoice Date'],['total','Total'],['status','Status']]}};
const state={data:{},active:'CommandCenter',search:{},showCreate:false,selected:null,pending:{},highlight:null};
function esc(value){return String(value===undefined||value===null?'':value).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});}
function label(key){return String(key).replace(/([A-Z])/g,' $1').replace(/^./,function(c){return c.toUpperCase();});}
function inputType(key){if(/email/i.test(key))return 'email';if(/phone/i.test(key))return 'tel';if(/date/i.test(key))return 'date';if(/total|subtotal|cost|hours|quantity|score|margin|limit|amount|tax|shipping|nre|tooling|material/i.test(key))return 'number';return 'text';}
function inputValue(value,type){if(value===undefined||value===null)return '';var text=String(value);return type==='date'&&text.length>=10?text.slice(0,10):text;}
function toggleNav(){document.getElementById('app').classList.toggle('nav-open');}
function toast(type,message){var item=document.createElement('div');item.className='toast '+type;item.textContent=(type==='success'?'Success: ':type==='error'?'Error: ':type==='warning'?'Warning: ':'Info: ')+message;document.getElementById('toasts').appendChild(item);setTimeout(function(){item.remove();},5500);}
function setBusy(key,active,button){state.pending[key]=active;document.getElementById('busy').classList.toggle('hidden',!active);if(button){if(active){button.dataset.originalText=button.textContent;button.textContent='Saving...';button.disabled=true;}else{button.textContent=button.dataset.originalText||button.textContent;button.disabled=false;}}}
function isPending(key){return !!state.pending[key];}
function nav(){var items=[['CommandCenter','Command Center']].concat(entities.map(function(e){return [e,config[e].plural];}));document.getElementById('navigation').innerHTML=items.map(function(item){return '<button class="nav-button '+(state.active===item[0]?'active':'')+'" onclick="selectSection(\''+item[0]+'\')">'+item[1]+'</button>';}).join('')+'<button class="nav-button" onclick="window.location.href=window.location.pathname+\'?dashboard=1\'">Operations Dashboard</button><button class="nav-button" onclick="window.location.href=window.location.pathname+\'?ideas=1\'">Ideas Backlog</button>';}
function selectSection(section){state.active=section;state.showCreate=false;state.selected=null;document.getElementById('app').classList.remove('nav-open');render();}
function refreshData(onComplete){if(isPending('bootstrap'))return;setBusy('bootstrap',true);google.script.run.withSuccessHandler(function(result){setBusy('bootstrap',false);if(!result||!result.ok){toast('error',(result&&result.error&&result.error.message)||'VMOS data could not be loaded.');return;}state.data=result.data||{};render();if(onComplete)onComplete();}).withFailureHandler(function(){setBusy('bootstrap',false);toast('error','VMOS data could not be loaded. Try again.');render();}).getMvpBootstrap();}
function render(){nav();var workspace=document.getElementById('workspace');if(!Object.keys(state.data).length){workspace.innerHTML='<div class="surface loading">Loading VMOS records...</div>';return;}workspace.innerHTML=state.active==='CommandCenter'?commandCenter():entityPage(state.active);}
function commandCenter(){var cards=entities.map(function(entity){return '<div class="surface metric"><b>'+((state.data[entity]||[]).length)+'</b><span>'+config[entity].plural+'</span></div>';}).join('');return '<div class="page-head"><div><h1>Command Center</h1><p>Live production workflow overview</p></div></div><div class="cards">'+cards+'</div><div class="recent-grid">'+['RFQ','Job','Invoice'].map(recentPanel).join('')+'</div>';}
function recentPanel(entity){var rows=(state.data[entity]||[]).slice(0,5);return '<section class="surface recent"><h2>Recent '+config[entity].plural+'</h2>'+(rows.length?rows.map(function(row){return '<button onclick="openRecord(\''+entity+'\',\''+esc(row.id)+'\')"><b>'+esc(row.id)+'</b><br><small>'+esc(summary(row,entity))+'</small></button>';}).join(''):'<p class="empty">No '+config[entity].plural.toLowerCase()+' yet.</p>')+'</section>';}
function summary(row,entity){if(entity==='RFQ')return row.description||row.status||'';if(entity==='Job')return row.partId||row.status||'';return row.total||row.status||'';}
function entityPage(entity){var rows=filteredRows(entity), selection=state.selected&&state.selected.entity===entity?detailPanel(entity,state.selected.id):'';return '<div class="page-head"><div><h1>'+config[entity].plural+'</h1><p>Manage live '+config[entity].plural.toLowerCase()+'</p></div><button class="button primary" onclick="toggleCreate(\''+entity+'\')">'+(state.showCreate===entity?'Close form':'+ New '+entity)+'</button></div>'+(state.showCreate===entity?createForm(entity):'')+'<div class="split"><div><div class="toolbar"><input class="search" value="'+esc(state.search[entity]||'')+'" oninput="searchRecords(\''+entity+'\',this.value)" placeholder="Search '+config[entity].plural.toLowerCase()+'" aria-label="Search '+config[entity].plural+'"><span class="count">'+rows.length+' record'+(rows.length===1?'':'s')+'</span></div>'+recordList(entity,rows)+'</div>'+selection+'</div>';}
function toggleCreate(entity){state.showCreate=state.showCreate===entity?false:entity;state.selected=null;render();}
function createForm(entity){return '<section class="surface form-card"><h2>New '+entity+'</h2><form id="create-'+entity+'" onsubmit="submitCreate(event,\''+entity+'\')"><div class="form-grid">'+config[entity].create.map(function(field){return fieldHtml(field[0],field[1],field[2],field[3]);}).join('')+'</div><div class="form-actions"><button class="button primary" type="submit">Create '+entity+'</button><button class="button secondary" type="button" onclick="toggleCreate(\''+entity+'\')">Cancel</button></div></form></section>';}
function fieldHtml(key,text,type,required,value,disabled){var valueText=inputValue(value,type), requiredText=required?' required':'';var labelClass=required?'required':'';if(/description|notes/i.test(key))return '<div class="field"><label class="'+labelClass+'" for="'+esc(key)+'">'+esc(text)+'</label><textarea id="'+esc(key)+'" name="'+esc(key)+'" data-original="'+esc(valueText)+'"'+requiredText+(disabled?' disabled':'')+'>'+esc(valueText)+'</textarea></div>';return '<div class="field"><label class="'+labelClass+'" for="'+esc(key)+'">'+esc(text)+'</label><input id="'+esc(key)+'" name="'+esc(key)+'" type="'+type+'" value="'+esc(valueText)+'" data-original="'+esc(valueText)+'"'+requiredText+(disabled?' disabled':'')+'></div>';}
function recordList(entity,rows){if(!rows.length)return '<section class="surface empty">No '+config[entity].plural.toLowerCase()+' found.</section>';var columns=config[entity].columns;return '<section class="surface list-wrap"><table class="record-table"><thead><tr>'+columns.map(function(c){return '<th>'+esc(c[1])+'</th>';}).join('')+'<th>Actions</th></tr></thead><tbody>'+rows.map(function(row){var selected=state.highlight&&state.highlight.entity===entity&&state.highlight.id===row.id?'highlight':'';return '<tr class="'+selected+'">'+columns.map(function(c){return '<td class="'+(c[0]==='id'?'id':'')+'">'+esc(row[c[0]])+'</td>';}).join('')+'<td><button class="button row-action" onclick="openRecord(\''+entity+'\',\''+esc(row.id)+'\')">Edit</button></td></tr>';}).join('')+'</tbody></table></section>';}
function filteredRows(entity){var query=(state.search[entity]||'').toLowerCase();return (state.data[entity]||[]).filter(function(row){return !query||Object.keys(row).some(function(key){return String(row[key]===undefined?'':row[key]).toLowerCase().indexOf(query)!==-1;});});}
function searchRecords(entity,query){state.search[entity]=query;render();}
function openRecord(entity,id){state.active=entity;state.showCreate=false;state.selected={entity:entity,id:id};render();setTimeout(function(){var panel=document.querySelector('.detail');if(panel)panel.scrollIntoView({block:'nearest'});},0);}
function detailPanel(entity,id){var row=(state.data[entity]||[]).filter(function(record){return String(record.id)===String(id);})[0];if(!row)return '';var editable=Object.keys(row).filter(function(key){return ['id','createdAt','updatedAt','createdBy','updatedBy'].indexOf(key)===-1;});var audit=['createdAt','updatedAt','createdBy','updatedBy'].filter(function(key){return row[key]!==undefined;});return '<aside class="surface detail"><h2>'+esc(entity)+' <span class="status">'+esc(row.status||'Record')+'</span></h2><p class="detail-meta">'+esc(row.id)+'</p><form id="edit-'+entity+'" onsubmit="submitUpdate(event,\''+entity+'\',\''+esc(id)+'\')"><div class="form-grid">'+fieldHtml('id','ID','text',false,row.id,true)+editable.map(function(key){return fieldHtml(key,label(key),inputType(key),config[entity].create.some(function(field){return field[0]===key&&field[3];}),row[key]);}).join('')+'</div><div class="form-actions"><button class="button primary" type="submit">Save Changes</button><button class="button secondary" type="button" onclick="closeDetail()">Cancel</button></div></form>'+(audit.length?'<dl class="audit">'+audit.map(function(key){return '<dt>'+esc(label(key))+'</dt><dd>'+esc(row[key])+'</dd>';}).join('')+'</dl>':'')+'</aside>';}
function closeDetail(){state.selected=null;render();}
function formValues(form){var output={};Array.prototype.forEach.call(form.querySelectorAll('[name]:not([disabled])'),function(control){output[control.name]=control.value;});return output;}
function submitCreate(event,entity){event.preventDefault();var key='create-'+entity,form=event.currentTarget,button=form.querySelector('[type="submit"]');if(isPending(key)||!form.reportValidity())return;var values=formValues(form);form.dataset.operationId=form.dataset.operationId||('UI-'+Date.now()+'-'+Math.random().toString(16).slice(2));values._operationId=form.dataset.operationId;setBusy(key,true,button);google.script.run.withSuccessHandler(function(result){setBusy(key,false,button);if(!result||!result.ok){toast('error',config[entity].plural+' could not be saved: '+((result&&result.error&&result.error.message)||'Unknown error.'));if(result&&result.refreshRequired)refreshData();return;}delete form.dataset.operationId;state.showCreate=false;state.highlight={entity:entity,id:result.data.id};toast('success',entity+' '+result.data.id+' created successfully.');refreshData();}).withFailureHandler(function(){setBusy(key,false,button);toast('error',config[entity].plural+' could not be saved. Refresh before retrying.');refreshData();}).createMvpRecord(entity,values);}
function submitUpdate(event,entity,id){event.preventDefault();var key='update-'+entity+'-'+id,form=event.currentTarget,button=form.querySelector('[type="submit"]');if(isPending(key)||!form.reportValidity())return;var changes={};Array.prototype.forEach.call(form.querySelectorAll('[name]:not([disabled])'),function(control){if(control.value!==control.dataset.original)changes[control.name]=control.value;});if(!Object.keys(changes).length){toast('info','No changes to save.');return;}setBusy(key,true,button);google.script.run.withSuccessHandler(function(result){setBusy(key,false,button);if(!result||!result.ok){toast('error',entity+' '+id+' could not be updated: '+((result&&result.error&&result.error.message)||'Unknown error.'));return;}state.highlight={entity:entity,id:id};state.selected={entity:entity,id:id};toast('success',entity+' '+id+' updated successfully.');refreshData();}).withFailureHandler(function(){setBusy(key,false,button);toast('error',entity+' '+id+' could not be updated. Refresh before retrying.');}).updateMvpRecord(entity,id,changes);}
refreshData();
</script></body></html>
