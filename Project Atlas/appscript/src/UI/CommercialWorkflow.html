div><p class="atlas-eyebrow">Contextual workflow</p><h1 id="title">Commercial work</h1><p>Move from Customer request to Work Order and Invoice, or create Internal shop work through the same operational Job engine.</p></div></header><nav id="crumbs" class="crumbs" aria-label="Record context"></nav><div id="notice" class="atlas-notice notice" role="status" aria-live="polite" hidden></div><section class="layout"><aside class="atlas-panel atlas-surface"><div class="toolbar"><label class="atlas-field" style="flex:1">Search<input id="search" class="atlas-input" type="search"></label><button id="search-button" class="atlas-button atlas-button--secondary" type="button">Search</button></div><div id="directory" class="directory" aria-live="polite"></div></aside><section id="detail" class="atlas-panel atlas-surface" aria-live="polite" aria-busy="true"><p class="atlas-loading" role="status">Loading workspace…</p></section></section></main><script>
var commercialRouteContext={route:'<?= atlasRequestedRoute ?>',id:'<?= atlasRequestedRecordId ?>'},labels={customers:'Customers',rfqs:'RFQs',quotes:'Quotes',jobs:'Jobs / Work Orders',invoices:'Invoices'},route=Object.prototype.hasOwnProperty.call(labels,commercialRouteContext.route)?commercialRouteContext.route:'customers',selectedId=commercialRouteContext.id||'',model=null,busy=false,paymentBusy=false,paymentAttempt=null,loadGeneration=0,jobOptionsGeneration=0,internalOptions=null;window.atlasServerRoute=route;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function unpack(r){if(!r||r.ok===false)throw new Error(r&&r.error&&r.error.message||'The workflow is unavailable.');return r.data;}function notice(text,error){var n=document.getElementById('notice');n.textContent=text;n.className='atlas-notice notice '+(error?'atlas-notice--error':'atlas-notice--success');n.hidden=false;}function call(name,args,done){if(busy)return;busy=true;document.querySelectorAll('button').forEach(function(b){b.disabled=true;});google.script.run.withSuccessHandler(function(r){busy=false;try{if(!r||r.ok===false){notice(r&&r.error&&r.error.message||'The result could not be confirmed.',true);if(r&&r.refreshRequired)load();return;}done(r.data);}catch(e){notice(e.message,true);}finally{document.querySelectorAll('button').forEach(function(b){b.disabled=false;});}}).withFailureHandler(function(){busy=false;notice('The result could not be confirmed. Atlas is refreshing before another attempt.',true);load();})[name].apply(google.script.run,args||[]);}
function label(row){return row.name||row.title||row.description||row.partId||row.customerRfqNumber||row.id;}function href(kind,id){return kind==='quotes'&&id?'?route=quote-builder&quoteId='+encodeURIComponent(id):kind==='jobs'&&id?'?route=job&jobId='+encodeURIComponent(id):'?route='+kind+(id?'&id='+encodeURIComponent(id):'');}function openRecord(id){location.href=href(route,id);}function detailBusy(value){var detail=document.getElementById('detail');if(detail.setAttribute)detail.setAttribute('aria-busy',String(value));}function workflowFailure(message,response){if(AtlasUi.sessionExpired(response,document.getElementById('notice')))return;notice(message,true);detailBusy(false);document.getElementById('directory').innerHTML='<div class="atlas-error" role="alert"><h2>Directory unavailable</h2><p>Atlas could not load these records.</p><button class="atlas-button" type="button" onclick="load()">Retry</button></div>';document.getElementById('detail').innerHTML='<div class="atlas-error"><h2>Workspace unavailable</h2><p>Retry the workspace when the connection is available.</p></div>';}function load(){var owner=++loadGeneration;if(route==='quotes'&&selectedId){location.replace(href('quotes',selectedId));return;}if(route==='jobs'&&selectedId){location.replace(href('jobs',selectedId));return;}document.getElementById('title').textContent=labels[route]||'Commercial work';document.getElementById('directory').innerHTML='<p class="atlas-loading" role="status">Loading records…</p>';detailBusy(true);document.getElementById('detail').innerHTML='<p class="atlas-loading" role="status">Loading workspace…</p>';google.script.run.withSuccessHandler(function(r){if(owner!==loadGeneration)return;try{model=unpack(r);render();detailBusy(false);}catch(e){workflowFailure(e.message,r);}}).withFailureHandler(function(){if(owner!==loadGeneration)return;workflowFailure('The workflow could not be loaded. Try again.');}).getCommercialWorkflowWorkspace({route:route,id:selectedId,query:document.getElementById('search').value});}
function render(){var d=model.directory||{},rows=d.items||[],create=(route==='customers'&&model.actions.createCustomer?'<button class="atlas-button" onclick="newCustomer()">+ New Customer</button>':'')+(route==='jobs'&&model.actions.createJob?'<button class="atlas-button" onclick="formJob()">+ New Job</button>':'');document.getElementById('directory').innerHTML=create+(rows.length?rows.map(function(x){return '<button class="record" aria-current="'+(model.selected&&x.id===model.selected.id)+'" onclick="openRecord(\''+esc(x.id)+'\')"><strong>'+esc(label(x))+'</strong><br>'+(x.classificationLabel?'<span class="classification">'+esc(x.classificationLabel)+'</span> ':'')+'<span>'+esc(x.status||'')+'</span> <span class="reference">'+esc(x.id)+'</span></button>';}).join(''):'<p class="atlas-empty">No matching records.</p>')+(d.truncated?'<p>Showing the first bounded results. Refine the search.</p>':'');renderDetail();}
function crumbs(){var c=model.context||{},items=[];if(c.customer)items.push(['customers',c.customer.id,c.customer.name]);if(c.rfq)items.push(['rfqs',c.rfq.id,'RFQ '+c.rfq.id]);if(c.quote)items.push(['quotes',c.quote.id,'Quote '+c.quote.id]);if(c.job)items.push(['jobs',c.job.id,'Job '+c.job.id]);document.getElementById('crumbs').innerHTML=items.map(function(x){return '<a class="atlas-button atlas-button--secondary" href="'+href(x[0],x[1])+'">'+esc(x[2])+'</a>';}).join('');}
function kv(name,value){return '<div><b>'+esc(name)+'</b><br>'+esc(value||'Not recorded')+'</div>';}function related(){var r=model.related||{},groups=[['rfqs','RFQs',r.rfqs],['quotes','Quotes',r.quotes],['jobs','Jobs',r.jobs],['invoices','Invoices',r.invoices]];return '<div class="related">'+groups.filter(function(g){return g[2]&&g[2].length;}).map(function(g){return '<div><b>'+g[1]+'</b>'+g[2].map(function(x){return '<a href="'+href(g[0],x.id)+'">'+esc(label(x))+'<br><span class="reference">'+esc(x.id)+'</span></a>';}).join('')+'</div>';}).join('')+'</div>';}
function renderDetail(){var host=document.getElementById('detail'),x=model.selected,a=model.actions||{},r=model.related||{};crumbs();if(!x){host.innerHTML=route==='quotes'?'<div class="atlas-empty"><h2>Choose a Quote</h2><p>Open a Quote to work with its draft, issued, and accepted revisions in one lifecycle workspace.</p></div>':route==='jobs'?'<div class="atlas-empty"><h2>Choose or create a Job</h2><p>Customer and Internal work share the same planning and shop-floor engine.</p>'+(a.createJob?'<button class="atlas-button" onclick="formJob()">Create Job</button>':'')+'<div id="form"></div></div>':'<div class="atlas-empty"><h2>Choose a '+esc((model.entity||'record').replace('Customer','Customer'))+'</h2><p>Search or select a record to open its business context.</p></div>';return;}var internal=model.entity==='Job'&&x.workClassification==='INTERNAL',summary='<div class="summary-grid">'+kv(model.entity+' reference',x.id)+kv('Status',x.status)+(model.entity==='Job'?kv('Work classification',x.classificationLabel):'')+kv('Customer',internal?'Internal / non-revenue':model.context.customer&&model.context.customer.name)+kv('Description / work',x.title||x.description||x.partId||model.context.rfq&&model.context.rfq.description)+(internal?kv('Asset / equipment',x.assetId||'No Asset linked'):kv('Amount',x.total===''?'Pending draft pricing':x.total))+kv('Due date',x.dueDate)+'</div>',buttons=[];if(model.entity==='Customer'){if(a.logActivity)buttons.push('<a class="atlas-button" href="?route=sales-activity&customer='+encodeURIComponent(x.id)+'">Log Activity</a>');if(a.createFollowUp)buttons.push('<a class="atlas-button atlas-button--secondary" href="?route=follow-ups&customer='+encodeURIComponent(x.id)+'">Create Follow-Up</a>');if(a.createRfq)buttons.push('<button class="atlas-button" onclick="formRfq()">Create RFQ</button>');}if(model.entity==='RFQ'&&a.writeQuote)buttons.push(r.quote?'<a class="atlas-button" href="'+href('quotes',r.quote.id)+'">Open revision workspace</a>':'<button class="atlas-button" onclick="formQuote()">Create Quote</button>');if(model.entity==='Job'&&a.createInvoice)buttons.push(r.invoice?'<a class="atlas-button" href="'+href('invoices',r.invoice.id)+'">Open Invoice</a>':'<button class="atlas-button" onclick="formInvoice()">Create draft Invoice</button>');host.innerHTML='<header><p class="atlas-eyebrow">'+esc(model.entity)+'</p><h2>'+esc(label(x))+'</h2><p class="reference">'+esc(x.id)+'</p></header>'+summary+'<div class="actions" style="margin-top:14px">'+buttons.join('')+'</div><div id="form"></div>'+(model.entity==='Customer'?'<h3>Related work</h3>'+related():'');}
function setForm(html){document.getElementById('form').innerHTML='<form class="context-form" onsubmit="return false">'+html+'</form>';var first=document.querySelector('#form input,#form select,#form textarea,#form button');if(first)first.focus();}function formRfq(){setForm('<h3>Create RFQ for this Customer</h3><label>Request / description<textarea id="description" required></textarea></label><label>Customer RFQ number<input id="customer-rfq"></label><label>Due date<input id="due" type="date"></label><button class="atlas-button" onclick="createRfq()">Create RFQ</button>');}function createRfq(){call('createContextualRfq',[model.selected.id,{description:document.getElementById('description').value,customerRfqNumber:document.getElementById('customer-rfq').value,dueDate:document.getElementById('due').value}],function(x){location.href=href('rfqs',x.id);});}
function formJob(){var target=document.getElementById('form')||document.getElementById('detail');target.innerHTML='<form class="context-form" id="job-form" onsubmit="return false"><h3>Create Job</h3><fieldset class="work-kind"><legend><b>Work Type</b></legend><label><input type="radio" name="work-kind" value="CUSTOMER" onchange="chooseJobKind(this.value)"> Customer Work</label><label><input type="radio" name="work-kind" value="INTERNAL" onchange="chooseJobKind(this.value)"> Internal Work</label></fieldset><div id="job-fields" role="status" aria-live="polite"><p>Choose the work type to continue.</p></div></form>';target.querySelector('input[name="work-kind"]').focus();}
function chooseJobKind(kind){var host=document.getElementById('job-fields');if(kind==='CUSTOMER'){jobOptionsGeneration++;host.innerHTML='<h4>Customer Work</h4><p>Use the established Customer → RFQ → Quote path. Accepted Quote work keeps its authoritative commercial context.</p><a class="atlas-button" href="?route=customers">Open Customers</a> <a class="atlas-button atlas-button--secondary" href="?route=quotes">Open Quotes</a>';return;}loadInternalOptions('');}
function loadInternalOptions(query){var owner=++jobOptionsGeneration,host=document.getElementById('job-fields');host.setAttribute('aria-busy','true');host.innerHTML='<p class="atlas-loading" role="status">Loading Internal Job options…</p>';google.script.run.withSuccessHandler(function(response){if(owner!==jobOptionsGeneration)return;try{internalOptions=unpack(response);renderInternalFields();}catch(error){internalOptionFailure();}}).withFailureHandler(function(){if(owner!==jobOptionsGeneration)return;internalOptionFailure();}).getInternalJobCreationOptions(query||'');}
function internalOptionFailure(){var host=document.getElementById('job-fields');host.setAttribute('aria-busy','false');host.innerHTML='<div class="atlas-error" role="alert"><h4>Internal Job options unavailable</h4><p>Retry when the workspace connection is available. No Job was created.</p><button class="atlas-button" type="button" onclick="loadInternalOptions(\'\')">Retry</button></div>';}
function assetOptions(){var rows=internalOptions&&internalOptions.assets&&internalOptions.assets.items||[];return '<option value="">No Asset linked</option>'+rows.map(function(asset){return '<option value="'+esc(asset.id)+'">'+esc(asset.assetCode+' — '+asset.name)+'</option>';}).join('');}
function renderInternalFields(){var host=document.getElementById('job-fields'),types=internalOptions.internalWorkTypes||[];host.setAttribute('aria-busy','false');host.innerHTML='<h4>Internal Work</h4><p>Internal work uses the same planning, operation, Traveler, QR, labor, material, and completion engine without customer revenue authority.</p><label for="internal-type">Internal Work Type<select id="internal-type" required><option value="">Choose type</option>'+types.map(function(value){return '<option value="'+esc(value)+'">'+esc(value.replace(/_/g,' '))+'</option>';}).join('')+'</select></label><label for="job-title">Job title<input id="job-title" required maxlength="160"></label><label for="job-description">Description / work instructions<textarea id="job-description" maxlength="2000"></textarea></label><div class="toolbar"><label for="asset-search" style="flex:1">Find active Asset<input id="asset-search" maxlength="80"></label><button class="atlas-button atlas-button--secondary" type="button" onclick="searchInternalAssets()">Search Assets</button></div><label for="job-asset">Asset / Equipment (optional)<select id="job-asset">'+assetOptions()+'</select></label><p id="asset-status">Showing up to '+esc(internalOptions.assets.bound)+' active Assets.'+(internalOptions.assets.truncated?' Refine the search for more precise results.':'')+'</p><label for="job-priority">Priority<select id="job-priority"><option value="">Standard</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>URGENT</option></select></label><label for="job-planned">Planned start<input id="job-planned" type="date"></label><label for="job-due">Due date<input id="job-due" type="date"></label><button class="atlas-button" type="button" onclick="createInternal()">Create Internal Job</button>';document.getElementById('internal-type').focus();}
function searchInternalAssets(){var owner=++jobOptionsGeneration,query=document.getElementById('asset-search').value,status=document.getElementById('asset-status');status.textContent='Searching active Assets…';google.script.run.withSuccessHandler(function(response){if(owner!==jobOptionsGeneration)return;try{var options=unpack(response);internalOptions.assets=options.assets;document.getElementById('job-asset').innerHTML=assetOptions();status.textContent='Showing up to '+internalOptions.assets.bound+' matching active Assets.'+(internalOptions.assets.truncated?' Refine the search for more precise results.':'');}catch(error){status.textContent='Asset search failed. Retry or create the Job without an Asset.';}}).withFailureHandler(function(){if(owner!==jobOptionsGeneration)return;status.textContent='Asset search failed. Retry or create the Job without an Asset.';}).getInternalJobCreationOptions(query);}
function createInternal(){var form=document.getElementById('job-form');if(!form.reportValidity())return;call('createInternalJob',[{internalWorkType:document.getElementById('internal-type').value,title:document.getElementById('job-title').value,description:document.getElementById('job-description').value,assetId:document.getElementById('job-asset').value,priority:document.getElementById('job-priority').value,plannedStart:document.getElementById('job-planned').value,dueDate:document.getElementById('job-due').value}],function(x){location.href=href('jobs',x.id);});}
function formQuote(){setForm('<h3>Create Quote from this RFQ</h3><p>Customer and RFQ context will be preserved. Customer pricing and issuance continue in the revision workspace.</p><label>Lead time<input id="lead"></label><label>Notes<textarea id="notes"></textarea></label><button class="atlas-button" onclick="createQuote()">Create Quote draft</button>');}function createQuote(){call('createQuoteFromRfq',[model.selected.id,{leadTime:document.getElementById('lead').value,notes:document.getElementById('notes').value}],function(x){location.href=href('quotes',x.id);});}
function formInvoice(){setForm('<h3>Create draft Invoice for this Job</h3><p>The Quote total is used only when already authoritative. Otherwise the draft amount remains pending.</p><label>Due date<input id="due" type="date"></label><label>Notes<textarea id="notes"></textarea></label><button class="atlas-button" onclick="createInvoice()">Create draft Invoice</button>');}function createInvoice(){call('createInvoiceFromJob',[model.selected.id,{dueDate:document.getElementById('due').value,notes:document.getElementById('notes').value}],function(x){location.href=href('invoices',x.id);});}
function newCustomer(){setForm('<h3>New Customer</h3><label>Company name<input id="company" required></label><label>Email<input id="email" type="email"></label><label>Phone<input id="phone" type="tel"></label><button class="atlas-button" onclick="createCustomer()">Create Customer</button>');}function createCustomer(){call('createMvpRecord',['Customer',{name:document.getElementById('company').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,_operationId:'CW-'+Date.now()}],function(x){location.href=href('customers',x.id);});}
function paymentKey(){return 'atlas-payment-attempt:'+model.selected.id;}function loadPaymentAttempt(){try{return JSON.parse(sessionStorage.getItem(paymentKey())||'null');}catch(ignored){return null;}}function savePaymentAttempt(){try{sessionStorage.setItem(paymentKey(),JSON.stringify(paymentAttempt));}catch(ignored){}}function clearPaymentAttempt(){try{sessionStorage.removeItem(paymentKey());}catch(ignored){}paymentAttempt=null;}
function newPaymentCommand(){var value=window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);return 'PAY-'+value.toUpperCase();}
function paymentValues(){return {receivedDate:document.getElementById('payment-date').value,amount:document.getElementById('payment-amount').value,paymentMethod:document.getElementById('payment-method').value.trim(),referenceNumber:document.getElementById('payment-reference').value.trim()};}
function paymentStatus(text,tone){var status=document.getElementById('payment-status');if(!status)return;status.textContent=text;status.className='atlas-notice '+(tone?'atlas-notice--'+tone:'');status.hidden=false;}
function renderPaymentAttempt(){if(!paymentAttempt)return;var locked=paymentAttempt.state!=='READY';['payment-date','payment-amount','payment-method','payment-reference'].forEach(function(id){document.getElementById(id).disabled=locked;});var submit=document.getElementById('payment-submit'),check=document.getElementById('payment-check'),reset=document.getElementById('payment-reset');submit.disabled=paymentBusy||['SUBMITTING','UNCERTAIN','CONFIRMED'].indexOf(paymentAttempt.state)!==-1;submit.textContent=paymentAttempt.state==='FAILED_SAFE_TO_RETRY'?'Retry same payment':'Record payment';check.hidden=paymentAttempt.state!=='UNCERTAIN';check.disabled=paymentBusy;reset.hidden=['CONFIRMED','FAILED_SAFE_TO_RETRY'].indexOf(paymentAttempt.state)===-1;reset.textContent=paymentAttempt.state==='CONFIRMED'?'Record another payment':'Change payment details';if(paymentAttempt.state==='SUBMITTING')paymentStatus('Recording payment…','info');else if(paymentAttempt.state==='UNCERTAIN')paymentStatus('Atlas cannot yet confirm whether this payment was recorded. Check authoritative payment state before trying again.','warning');else if(paymentAttempt.state==='FAILED_SAFE_TO_RETRY')paymentStatus('Atlas confirmed that this payment was not recorded. You may safely retry the same attempt.','error');else if(paymentAttempt.state==='CONFIRMED'){var r=paymentAttempt.result||{};paymentStatus('Payment recorded as '+(r.id||'a Cash Receipt')+': '+Number(r.amount||0).toFixed(2)+' via '+(r.paymentMethod||'payment')+' on '+(r.receivedDate||'the recorded date')+(r.referenceNumber?' · Reference '+r.referenceNumber:'')+'. Invoice balances are not recalculated by this action.','success');}}
function formPayment(){paymentAttempt=loadPaymentAttempt();var p=paymentAttempt&&paymentAttempt.payload||{};setForm('<h3>Record Payment / Cash Receipt</h3><p>The Invoice and Customer come from this context. Recording a receipt does not recalculate the Invoice balance.</p><div id="payment-status" class="atlas-notice" role="status" hidden></div><label>Received date<input id="payment-date" type="date" required value="'+esc(p.receivedDate||'')+'"></label><label>Amount received<input id="payment-amount" type="number" min="0.01" step="0.01" required value="'+esc(p.amount||'')+'"></label><label>Payment method<input id="payment-method" required value="'+esc(p.paymentMethod||'')+'"></label><label>Reference number<input id="payment-reference" value="'+esc(p.referenceNumber||'')+'"></label><div class="actions"><button id="payment-submit" class="atlas-button atlas-button--primary" onclick="recordPayment()">Record payment</button><button id="payment-check" class="atlas-button" onclick="reconcilePayment()" hidden>Check payment status</button><button id="payment-reset" class="atlas-button atlas-button--secondary" onclick="resetPayment()" hidden>Record another payment</button></div>');if(paymentAttempt){if(paymentAttempt.state==='SUBMITTING')paymentAttempt.state='UNCERTAIN';renderPaymentAttempt();if(paymentAttempt.state==='UNCERTAIN')reconcilePayment();}}
function recordPayment(){if(paymentBusy)return;var values=paymentAttempt&&paymentAttempt.payload||paymentValues();if(!values.receivedDate||!values.amount||Number(values.amount)<=0||!values.paymentMethod)return paymentStatus('Enter a received date, amount greater than zero, and payment method.','error');if(!paymentAttempt)paymentAttempt={commandId:newPaymentCommand(),state:'READY',payload:values};paymentAttempt.state='SUBMITTING';savePaymentAttempt();paymentBusy=true;renderPaymentAttempt();google.script.run.withSuccessHandler(function(r){paymentBusy=false;if(r&&r.ok!==false){paymentAttempt.state='CONFIRMED';paymentAttempt.result=r.data;savePaymentAttempt();return renderPaymentAttempt();}paymentAttempt.state='UNCERTAIN';savePaymentAttempt();renderPaymentAttempt();reconcilePayment();}).withFailureHandler(function(){paymentBusy=false;paymentAttempt.state='UNCERTAIN';savePaymentAttempt();renderPaymentAttempt();reconcilePayment();}).recordInvoicePayment(model.selected.id,Object.assign({paymentCommandId:paymentAttempt.commandId},paymentAttempt.payload));}
function reconcilePayment(){if(paymentBusy||!paymentAttempt)return;paymentBusy=true;paymentAttempt.state='UNCERTAIN';savePaymentAttempt();renderPaymentAttempt();google.script.run.withSuccessHandler(function(r){paymentBusy=false;if(!r||r.ok===false){savePaymentAttempt();return renderPaymentAttempt();}var result=r.data||{};if(result.state==='CONFIRMED'){paymentAttempt.state='CONFIRMED';paymentAttempt.result=result.receipt;}else if(result.state==='NOT_COMPLETED')paymentAttempt.state='FAILED_SAFE_TO_RETRY';else paymentAttempt.state='UNCERTAIN';savePaymentAttempt();renderPaymentAttempt();}).withFailureHandler(function(){paymentBusy=false;paymentAttempt.state='UNCERTAIN';savePaymentAttempt();renderPaymentAttempt();}).reconcileInvoicePaymentAttempt(model.selected.id,Object.assign({paymentCommandId:paymentAttempt.commandId},paymentAttempt.payload));}
function resetPayment(){if(!paymentAttempt||['CONFIRMED','FAILED_SAFE_TO_RETRY'].indexOf(paymentAttempt.state)===-1)return;clearPaymentAttempt();formPayment();}
var renderCommercialDetail_=renderDetail;renderDetail=function(){renderCommercialDetail_();if(model&&model.entity==='Invoice'&&model.selected&&model.actions&&model.actions.recordPayment){var actions=document.querySelector('#detail .actions');if(actions)actions.insertAdjacentHTML('beforeend','<button class="atlas-button" onclick="formPayment()">Record Payment / Cash Receipt</button>');if(loadPaymentAttempt())formPayment();}};
document.getElementById('search-button').addEventListener('click',function(){selectedId='';load();});document.getElementById('search').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();selectedId='';load();}});load();
</script></body></html>
