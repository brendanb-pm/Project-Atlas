<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><?!= includeAtlasUi_('UI/AtlasDesignSystem') ?><style>.layout{display:grid;grid-template-columns:minmax(260px,.72fr) minmax(0,1.5fr);gap:18px}.toolbar,.actions,.crumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.directory{display:grid;gap:7px}.record{width:100%;text-align:left;background:#fff;border:1px solid var(--atlas-border);border-radius:6px;padding:11px;min-height:52px}.record[aria-current=true]{border:3px solid var(--atlas-accent)}.reference{font-family:Consolas,monospace;font-size:.82rem}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.summary-grid div{padding:10px;background:var(--atlas-surface-muted,#f3f6f7);border-radius:5px}.related{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.related a{display:block;padding:10px;border:1px solid var(--atlas-border);border-radius:5px;overflow-wrap:anywhere}.context-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--atlas-border)}.context-form label{display:grid;gap:5px;margin:9px 0;font-weight:700}.context-form input,.context-form textarea{min-height:44px;padding:8px}.context-form textarea{min-height:76px}.notice{margin-bottom:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.related{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.atlas-page{padding:12px}.summary-grid,.related{grid-template-columns:1fr}.actions .atlas-button{width:100%}}</style></head><body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="atlas-page"><header class="atlas-page-header"><div><p class="atlas-eyebrow">Contextual workflow</p><h1 id="title">Commercial work</h1><p>Move from Customer request to Work Order and Invoice without re-entering internal record identifiers.</p></div></header><nav id="crumbs" class="crumbs" aria-label="Record context"></nav><div id="notice" class="atlas-notice notice" role="status" hidden></div><section class="layout"><aside class="atlas-panel atlas-surface"><div class="toolbar"><label class="atlas-field" style="flex:1">Search<input id="search" class="atlas-input" type="search"></label><button id="search-button" class="atlas-button atlas-button--secondary" type="button">Search</button></div><div id="directory" class="directory" aria-live="polite"></div></aside><section id="detail" class="atlas-panel atlas-surface" aria-live="polite"><p class="atlas-loading">Loading workspace…</p></section></section></main><script>
var params=new URLSearchParams(location.search),route=params.get('route')||'customers',selectedId=params.get('id')||'',model=null,busy=false;var labels={customers:'Customers',rfqs:'RFQs',quotes:'Quotes',jobs:'Jobs / Work Orders',invoices:'Invoices'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function unpack(r){if(!r||r.ok===false)throw new Error(r&&r.error&&r.error.message||'The workflow is unavailable.');return r.data;}function notice(text,error){var n=document.getElementById('notice');n.textContent=text;n.className='atlas-notice notice '+(error?'atlas-notice--error':'atlas-notice--success');n.hidden=false;}function call(name,args,done){if(busy)return;busy=true;document.querySelectorAll('button').forEach(function(b){b.disabled=true;});google.script.run.withSuccessHandler(function(r){busy=false;try{if(!r||r.ok===false){notice(r&&r.error&&r.error.message||'The result could not be confirmed.',true);if(r&&r.refreshRequired)load();return;}done(r.data);}catch(e){notice(e.message,true);}finally{document.querySelectorAll('button').forEach(function(b){b.disabled=false;});}}).withFailureHandler(function(){busy=false;notice('The result could not be confirmed. Atlas is refreshing before another attempt.',true);load();})[name].apply(google.script.run,args||[]);}
function label(row){return row.name||row.description||row.partId||row.customerRfqNumber||row.id;}function href(kind,id){return kind==='quotes'&&id?'?route=quote-builder&quoteId='+encodeURIComponent(id):'?route='+kind+(id?'&id='+encodeURIComponent(id):'');}function openRecord(id){location.href=href(route,id);}function load(){if(route==='quotes'&&selectedId){location.replace(href('quotes',selectedId));return;}document.getElementById('title').textContent=labels[route]||'Commercial work';google.script.run.withSuccessHandler(function(r){try{model=unpack(r);render();}catch(e){notice(e.message,true);}}).withFailureHandler(function(){notice('The workflow could not be loaded. Try again.',true);}).getCommercialWorkflowWorkspace({route:route,id:selectedId,query:document.getElementById('search').value});}
function render(){var d=model.directory||{},rows=d.items||[];document.getElementById('directory').innerHTML=(route==='customers'&&model.actions.createCustomer?'<button class="atlas-button" onclick="newCustomer()">+ New Customer</button>':'')+(rows.length?rows.map(function(x){return '<button class="record" aria-current="'+(model.selected&&x.id===model.selected.id)+'" onclick="openRecord(\''+esc(x.id)+'\')"><strong>'+esc(label(x))+'</strong><br><span>'+esc(x.status||'')+'</span> <span class="reference">'+esc(x.id)+'</span></button>';}).join(''):'<p class="atlas-empty">No matching records.</p>')+(d.truncated?'<p>Showing the first bounded results. Refine the search.</p>':'');renderDetail();}
function crumbs(){var c=model.context||{},items=[];if(c.customer)items.push(['customers',c.customer.id,c.customer.name]);if(c.rfq)items.push(['rfqs',c.rfq.id,'RFQ '+c.rfq.id]);if(c.quote)items.push(['quotes',c.quote.id,'Quote '+c.quote.id]);if(c.job)items.push(['jobs',c.job.id,'Job '+c.job.id]);document.getElementById('crumbs').innerHTML=items.map(function(x){return '<a class="atlas-button atlas-button--secondary" href="'+href(x[0],x[1])+'">'+esc(x[2])+'</a>';}).join('');}
function kv(name,value){return '<div><b>'+esc(name)+'</b><br>'+esc(value||'Not recorded')+'</div>';}function related(){var r=model.related||{},groups=[['rfqs','RFQs',r.rfqs],['quotes','Quotes',r.quotes],['jobs','Jobs',r.jobs],['invoices','Invoices',r.invoices]];return '<div class="related">'+groups.filter(function(g){return g[2]&&g[2].length;}).map(function(g){return '<div><b>'+g[1]+'</b>'+g[2].map(function(x){return '<a href="'+href(g[0],x.id)+'">'+esc(label(x))+'<br><span class="reference">'+esc(x.id)+'</span></a>';}).join('')+'</div>';}).join('')+'</div>';}
function renderDetail(){var host=document.getElementById('detail'),x=model.selected,a=model.actions||{},r=model.related||{};crumbs();if(!x){host.innerHTML=route==='quotes'?'<div class="atlas-empty"><h2>Choose a Quote</h2><p>Open a Quote to work with its draft, issued, and accepted revisions in one lifecycle workspace.</p></div>':'<div class="atlas-empty"><h2>Choose a '+esc((model.entity||'record').replace('Customer','Customer'))+'</h2><p>Search or select a record to open its business context.</p></div>';return;}var summary='<div class="summary-grid">'+kv(model.entity+' reference',x.id)+kv('Status',x.status)+kv('Customer',model.context.customer&&model.context.customer.name)+kv('Description / work',x.description||x.partId||model.context.rfq&&model.context.rfq.description)+kv('Amount',x.total===''?'Pending draft pricing':x.total)+kv('Due date',x.dueDate)+'</div>',buttons=[];if(model.entity==='Customer'){if(a.logActivity)buttons.push('<a class="atlas-button" href="?route=sales-activity&customer='+encodeURIComponent(x.id)+'">Log Activity</a>');if(a.createFollowUp)buttons.push('<a class="atlas-button atlas-button--secondary" href="?route=follow-ups&customer='+encodeURIComponent(x.id)+'">Create Follow-Up</a>');if(a.createRfq)buttons.push('<button class="atlas-button" onclick="formRfq()">Create RFQ</button>');}if(model.entity==='RFQ'&&a.writeQuote)buttons.push(r.quote?'<a class="atlas-button" href="'+href('quotes',r.quote.id)+'">Open revision workspace</a>':'<button class="atlas-button" onclick="formQuote()">Create Quote</button>');if(model.entity==='Job'&&a.createInvoice)buttons.push(r.invoice?'<a class="atlas-button" href="'+href('invoices',r.invoice.id)+'">Open Invoice</a>':'<button class="atlas-button" onclick="formInvoice()">Create draft Invoice</button>');host.innerHTML='<header><p class="atlas-eyebrow">'+esc(model.entity)+'</p><h2>'+esc(label(x))+'</h2><p class="reference">'+esc(x.id)+'</p></header>'+summary+'<div class="actions" style="margin-top:14px">'+buttons.join('')+'</div><div id="form"></div>'+(model.entity==='Customer'?'<h3>Related work</h3>'+related():'');}
function setForm(html){document.getElementById('form').innerHTML='<form class="context-form" onsubmit="return false">'+html+'</form>';document.querySelector('#form input,#form textarea').focus();}function formRfq(){setForm('<h3>Create RFQ for this Customer</h3><label>Request / description<textarea id="description" required></textarea></label><label>Customer RFQ number<input id="customer-rfq"></label><label>Due date<input id="due" type="date"></label><button class="atlas-button" onclick="createRfq()">Create RFQ</button>');}function createRfq(){call('createContextualRfq',[model.selected.id,{description:document.getElementById('description').value,customerRfqNumber:document.getElementById('customer-rfq').value,dueDate:document.getElementById('due').value}],function(x){location.href=href('rfqs',x.id);});}
function formQuote(){setForm('<h3>Create Quote from this RFQ</h3><p>Customer and RFQ context will be preserved. Customer pricing and issuance continue in the revision workspace.</p><label>Lead time<input id="lead"></label><label>Notes<textarea id="notes"></textarea></label><button class="atlas-button" onclick="createQuote()">Create Quote draft</button>');}function createQuote(){call('createQuoteFromRfq',[model.selected.id,{leadTime:document.getElementById('lead').value,notes:document.getElementById('notes').value}],function(x){location.href=href('quotes',x.id);});}
function formInvoice(){setForm('<h3>Create draft Invoice for this Job</h3><p>The Quote total is used only when already authoritative. Otherwise the draft amount remains pending.</p><label>Due date<input id="due" type="date"></label><label>Notes<textarea id="notes"></textarea></label><button class="atlas-button" onclick="createInvoice()">Create draft Invoice</button>');}function createInvoice(){call('createInvoiceFromJob',[model.selected.id,{dueDate:document.getElementById('due').value,notes:document.getElementById('notes').value}],function(x){location.href=href('invoices',x.id);});}
function newCustomer(){setForm('<h3>New Customer</h3><label>Company name<input id="company" required></label><label>Email<input id="email" type="email"></label><label>Phone<input id="phone" type="tel"></label><button class="atlas-button" onclick="createCustomer()">Create Customer</button>');}function createCustomer(){call('createMvpRecord',['Customer',{name:document.getElementById('company').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,_operationId:'CW-'+Date.now()}],function(x){location.href=href('customers',x.id);});}
var renderCommercialDetail_=renderDetail;renderDetail=function(){renderCommercialDetail_();if(model&&model.entity==='Invoice'&&model.selected&&model.actions&&model.actions.recordPayment){var actions=document.querySelector('#detail .actions');if(actions)actions.insertAdjacentHTML('beforeend','<button class="atlas-button" onclick="formPayment()">Record Payment / Cash Receipt</button>');}};
function formPayment(){setForm('<h3>Record Payment / Cash Receipt</h3><p>The Invoice and Customer come from this context. Recording a receipt does not recalculate the Invoice balance.</p><label>Received date<input id="payment-date" type="date" required></label><label>Amount received<input id="payment-amount" type="number" min="0.01" step="0.01" required></label><label>Payment method<input id="payment-method" required></label><label>Reference number<input id="payment-reference"></label><button class="atlas-button" onclick="recordPayment()">Record payment</button>');}function recordPayment(){call('recordInvoicePayment',[model.selected.id,{receivedDate:document.getElementById('payment-date').value,amount:document.getElementById('payment-amount').value,paymentMethod:document.getElementById('payment-method').value,referenceNumber:document.getElementById('payment-reference').value}],function(){notice('Payment recorded. Refreshing authoritative Invoice context.');load();});}
document.getElementById('search-button').addEventListener('click',function(){selectedId='';load();});document.getElementById('search').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();selectedId='';load();}});load();
</script></body></html>
