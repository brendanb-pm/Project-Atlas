<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><?!= includeAtlasUi_('UI/AtlasDesignSystem') ?><style>.toolbar{display:flex;gap:8px;align-items:flex-end}.toolbar label{flex:1}.tenant-list{display:grid;gap:12px}.tenant-card{padding:16px}.tenant-head,.metrics{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.metrics{margin:12px 0}.metric{min-width:120px}.metric strong{display:block;font-size:1.35rem}.tags{display:flex;gap:6px;flex-wrap:wrap}.history{margin-top:12px;border-top:1px solid var(--atlas-border);padding-top:10px}.attention{color:var(--atlas-danger,#8f1d1d);font-weight:700}@media(max-width:768px){.toolbar{align-items:stretch;flex-direction:column}.tenant-head{display:block}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.metrics{grid-template-columns:1fr}.tenant-card{padding:12px}}</style></head><body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="atlas-page"><header class="atlas-page-header"><div><p class="atlas-eyebrow">Platform administration</p><h1>Customer subscriptions</h1><p>Cross-tenant commercial status and attention. This workspace does not impersonate tenant users.</p></div></header><section class="atlas-panel atlas-surface toolbar"><label>Search tenants<input id="query" class="atlas-input" type="search" autocomplete="off" placeholder="Tenant, plan, or state"></label><button id="search" class="atlas-button" type="button">Search</button></section><div id="notice" class="atlas-notice" role="status">Loading commercial workspace…</div><section id="results" class="tenant-list" aria-live="polite"></section></main><script>function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function unwrap(r){if(!r||r.ok===false)throw new Error(r&&r.error&&r.error.message||'Commercial information is unavailable.');return r.data;}function render(model){var root=document.getElementById('results'),notice=document.getElementById('notice');notice.textContent=model.resultCount?model.resultCount+' tenant'+(model.resultCount===1?'':'s')+' shown.':'No tenants match this search.';root.innerHTML=(model.items||[]).map(function(t){var attention=t.attention.length?'<p class="attention">Attention: '+esc(t.attention.join(', ').replace(/_/g,' '))+'</p>':'<p>No commercial attention required.</p>',changes=t.recentChanges.length?t.recentChanges.map(function(x){return '<li>'+esc(x.eventType)+' · '+esc(x.occurredAt)+'</li>';}).join(''):'<li>No recent commercial changes.</li>';return '<article class="atlas-panel atlas-surface tenant-card"><div class="tenant-head"><div><h2>'+esc(t.tenantName)+'</h2><p>'+esc(t.tenantId)+' · '+esc(t.plan)+' · '+esc(t.subscriptionState.replace(/_/g,' '))+'</p></div><span class="atlas-status">'+esc(t.commercialState||'UNKNOWN')+'</span></div>'+attention+'<div class="metrics"><div class="metric"><strong>'+t.purchasedSeats+'</strong>Purchased seats</div><div class="metric"><strong>'+t.seatsInUse+'</strong>In use</div><div class="metric"><strong>'+t.seatsAvailable+'</strong>Available</div><div class="metric"><strong>'+t.planSeatCap+'</strong>Self-service cap</div></div><div class="tags">'+(t.modules.length?t.modules.map(function(m){return '<span class="atlas-status atlas-status--active">'+esc(m)+'</span>';}).join(''):'<span>No optional modules</span>')+'</div><p>Billing: '+esc(t.billingFrequency||'Not configured')+(t.nextBillingAt?' · Next '+esc(t.nextBillingAt):'')+(t.paymentMethodCategory?' · '+esc(t.paymentMethodCategory.replace(/_/g,' ')):'')+'</p><details class="history"><summary>Recent commercial changes</summary><ul>'+changes+'</ul></details></article>';}).join('');}function fail(){document.getElementById('notice').textContent='Commercial information is temporarily unavailable. Try again.';document.getElementById('results').innerHTML='';}function load(){document.getElementById('search').disabled=true;google.script.run.withSuccessHandler(function(r){try{render(unwrap(r));}catch(e){fail();}document.getElementById('search').disabled=false;}).withFailureHandler(function(){fail();document.getElementById('search').disabled=false;}).getPlatformCommercialWorkspace(document.getElementById('query').value);}document.getElementById('search').addEventListener('click',load);document.getElementById('query').addEventListener('keydown',function(e){if(e.key==='Enter')load();});load();</script></body></html>
