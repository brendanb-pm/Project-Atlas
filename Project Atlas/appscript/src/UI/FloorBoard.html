<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#10191e;--panel:#17262d;--line:#40545d;--text:#f7fafb;--muted:#b7c5cb;--danger:#ff7777;--ready:#77d49a;--wait:#f2c76e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.35 Arial,sans-serif}.board{min-height:100vh;padding:24px}.head{display:flex;justify-content:space-between;gap:24px;margin-bottom:20px}.head h1{font-size:clamp(30px,3vw,54px);margin:0}.head p,.meta{color:var(--muted);margin:5px 0}.state{text-align:right}.state button{min-height:48px;padding:0 18px;border:2px solid var(--muted);border-radius:6px;background:transparent;color:var(--text);font-weight:800}.state button:focus-visible,.work:focus-visible{outline:4px solid #61c6f0;outline-offset:3px}.lanes{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:16px;align-items:start}.lane{background:var(--panel);border:1px solid var(--line);border-top:7px solid var(--line);border-radius:9px;min-height:180px;padding:14px}.lane[data-lane=BLOCKED]{border-top-color:var(--danger)}.lane[data-lane=READY]{border-top-color:var(--ready)}.lane[data-lane=WAITING]{border-top-color:var(--wait)}.lane h2{font-size:20px;margin:0 0 12px;display:flex;justify-content:space-between}.list{display:grid;gap:10px}.work{display:block;color:inherit;text-decoration:none;background:#20323b;border:1px solid #49606b;border-radius:7px;padding:12px}.work.blocked{border:3px solid var(--danger);background:#3a2225}.work.new:after{content:'NEW';float:right;color:#10191e;background:#9ed8ee;border-radius:999px;padding:2px 7px;font-size:12px;font-weight:800}.id{font:800 18px Consolas,monospace}.title{font-size:20px;font-weight:800;margin:5px 0}.problem{color:#ffd1d1;font-weight:800;margin-top:6px}.notice{padding:14px 18px;border:2px solid var(--wait);background:#332d1e;margin-bottom:16px}.notice.error{border-color:var(--danger);background:#3a2225}@media(max-width:1500px){body{font-size:16px}.lanes{grid-template-columns:repeat(3,minmax(220px,1fr))}}@media(max-width:1050px){.board{padding:16px}.lanes{grid-template-columns:repeat(2,minmax(240px,1fr))}}@media(max-width:650px){.head{display:block}.state{text-align:left;margin-top:12px}.lanes{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style></head><body><main class="board"><header class="head"><div><h1>Floor Board</h1><p>Current work, exceptions, and recent change</p></div><div class="state"><button id="refresh" type="button">Refresh</button><p id="asof">Loading current state…</p></div></header><div id="notice" class="notice" hidden role="status"></div><section id="lanes" class="lanes" aria-label="Current production lanes"></section></main><script>
var revision='',refreshing=false,timer,boardItems=[];var laneOrder=['BLOCKED','IN_PROCESS','READY','WAITING','NEW'];var labels={BLOCKED:'Blocked / problem',IN_PROCESS:'In process',READY:'Ready',WAITING:'Waiting',NEW:'New / intake'};function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function unpack(r){if(r&&r.ok===false)throw new Error(r.error&&r.error.message||'Floor Board is unavailable.');return r&&r.data||r;}function card(x){return '<a class="work '+(x.lane==='BLOCKED'?'blocked ':'')+(x.recentlyAdded?'new':'')+'" href="'+safe(x.href)+'"><div class="id">'+safe(x.id)+'</div><div class="title">'+safe(x.customerName)+'</div><div>'+safe(x.description)+'</div><div class="meta">'+safe(x.status)+' · '+safe(x.operator||'Unassigned')+' · '+safe(x.machine||'No work center')+' · '+safe(x.ageLabel)+'</div>'+(x.problemReason?'<div class="problem">Attention: '+safe(x.problemReason)+'</div>':'')+'</a>';}
function render(m){if(m.items&&m.items.length)boardItems=m.items;document.getElementById('lanes').innerHTML=laneOrder.map(function(l){var rows=boardItems.filter(function(x){return x.lane===l;});return '<section class="lane" data-lane="'+l+'"><h2>'+labels[l]+' <span>'+rows.length+'</span></h2><div class="list">'+(rows.length?rows.map(card).join(''):'<p class="meta">No work in this lane.</p>')+'</div></section>';}).join('');revision=m.revision||revision;document.getElementById('asof').textContent='Updated '+new Date(m.asOf).toLocaleTimeString()+(m.truncated?' · bounded view':'');}
function fail(){var n=document.getElementById('notice');n.textContent=boardItems.length?'Refresh failed. Showing the last known board.':'The Floor Board could not be loaded. Retry when the connection is available.';n.className='notice error';n.hidden=false;if(!boardItems.length)document.getElementById('lanes').innerHTML='<section class="lane" role="alert"><h2>Floor Board unavailable</h2><p>No current board data was loaded.</p><button class="button" type="button" onclick="load()">Retry</button></section>';}function done(){refreshing=false;document.getElementById('refresh').disabled=false;clearTimeout(timer);timer=setTimeout(load,30000);}function load(){if(refreshing)return;refreshing=true;document.getElementById('refresh').disabled=true;if(!boardItems.length)document.getElementById('lanes').innerHTML='<section class="lane" role="status"><h2>Loading Floor Board</h2><p>Loading current work…</p></section>';google.script.run.withSuccessHandler(function(result){try{render(unpack(result));document.getElementById('notice').hidden=true;}catch(error){fail();}done();}).withFailureHandler(function(){fail();done();}).getFloorBoard(revision);}document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
