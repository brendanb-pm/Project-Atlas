<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Completing sign in - Atlas</title><?!= includeAtlasUi_('UI/AtlasDesignSystem'); ?><style>body{min-height:100vh;display:grid;place-items:center}.callback{width:min(520px,calc(100% - 32px));padding:28px;text-align:center}.tenant-picker{display:grid;gap:12px;margin-top:18px}.tenant-picker button{min-height:44px}</style></head><body><main class="callback atlas-surface"><h1>Completing sign in</h1><div id="status" class="atlas-notice atlas-loading" role="status" aria-live="assertive">Verifying your organization account…</div><div id="tenants" class="tenant-picker" aria-label="Authorized organizations" hidden></div><a id="retry" class="atlas-button" href="?route=sign-in" hidden>Return to sign in</a></main><script>var p=new URLSearchParams(location.search),payload={code:p.get('code')||'',state:p.get('state')||'',error:p.get('error')||''},status=document.getElementById('status');function fail(message){status.textContent=message;status.className='atlas-notice atlas-notice--error';status.setAttribute('role','alert');document.getElementById('retry').hidden=false}function chooseTenant(d){sessionStorage.setItem('atlasSessionToken',d.session.token);status.textContent='Choose your organization.';status.className='atlas-notice';var root=document.getElementById('tenants');root.hidden=false;(d.tenantOptions||[]).forEach(function(option){var button=document.createElement('button');button.className='atlas-button atlas-button--primary';button.textContent=option.label;button.onclick=function(){button.disabled=true;google.script.run.withSuccessHandler(function(r){if(!r||!r.ok){fail(r&&r.error&&r.error.message||'That organization is unavailable.');return}location.replace('?route='+encodeURIComponent(d.returnRoute||'home'));}).selectAtlasSessionTenant(d.session.token,option.id)};root.appendChild(button)})}if(payload.error)fail('Authentication was not completed. Try again or choose another provider.');else google.script.run.withSuccessHandler(function(r){if(!r||!r.ok){fail(r&&r.error&&r.error.message||'Authentication could not be completed.');return}var d=r.data;if(d.state==='IDENTITY_NOT_PROVISIONED'){fail('This identity is not provisioned for Atlas. Contact your Atlas administrator.');return}if(d.state==='MEMBERSHIP_INACTIVE'){fail('Your Atlas membership is inactive or unavailable. Contact your Atlas administrator.');return}if(d.state==='TENANT_SELECTION_REQUIRED'){chooseTenant(d);return}if(d.state!=='SIGNED_IN'){fail('Atlas access is currently unavailable.');return}sessionStorage.setItem('atlasSessionToken',d.session.token);status.textContent='Signed in. Opening Atlas…';status.className='atlas-notice atlas-notice--success';location.replace('?route='+encodeURIComponent(d.returnRoute||'home'));}).withFailureHandler(function(){fail('The identity provider is temporarily unavailable.');}).completeAtlasSignIn(payload);</script></body></html>
