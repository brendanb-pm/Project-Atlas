<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Completing sign in - Atlas</title><?!= includeAtlasUi_('UI/AtlasDesignSystem'); ?><style>body{min-height:100vh;display:grid;place-items:center}.callback{width:min(520px,calc(100% - 32px));padding:28px;text-align:center}.tenant-picker{display:grid;gap:12px;margin-top:18px}.tenant-picker button{min-height:44px}</style></head><body><main class="callback atlas-surface"><h1>Completing sign in</h1><div id="status" class="atlas-notice atlas-loading" role="status" aria-live="assertive">Verifying your organization account…</div><div id="tenants" class="tenant-picker" aria-label="Authorized organizations" hidden></div></main><script>
var query=new URLSearchParams(location.search),flowId=sessionStorage.getItem('atlasAuthFlowId')||'',expectedState=sessionStorage.getItem('atlasAuthState')||'',deadline=Number(sessionStorage.getItem('atlasAuthDeadline')||0),returnRoute=sessionStorage.getItem('atlasAuthReturnRoute')||'home',pendingToken=sessionStorage.getItem('atlasPendingSessionToken')||'',payload={code:query.get('code')||'',state:query.get('state')||'',error:query.get('error')||'',flowId:flowId},status=document.getElementById('status'),terminal=false,watchdog=null;
function clearTransaction(){['atlasAuthFlowId','atlasAuthState','atlasAuthDeadline','atlasAuthReturnRoute'].forEach(function(key){sessionStorage.removeItem(key);});}
function safeReturn(){return /^[a-z0-9-]+$/.test(returnRoute)?returnRoute:'home';}
function finishFailure(reason){if(terminal)return;terminal=true;clearTimeout(watchdog);var destination='?route=sign-in&auth='+encodeURIComponent(reason)+'&return='+encodeURIComponent(safeReturn()),complete=function(){clearTransaction();location.replace(destination);};if(flowId)google.script.run.withSuccessHandler(complete).withFailureHandler(complete).abortAtlasSignIn(flowId,expectedState);else complete();}
function activateTenant(data){terminal=true;clearTimeout(watchdog);clearTransaction();sessionStorage.setItem('atlasPendingSessionToken',data.session.token);status.textContent='Choose your organization.';status.className='atlas-notice';var root=document.getElementById('tenants');root.hidden=false;(data.tenantOptions||[]).forEach(function(option){var button=document.createElement('button');button.className='atlas-button atlas-button--primary';button.textContent=option.label;button.onclick=function(){button.disabled=true;google.script.run.withSuccessHandler(function(response){if(!response||!response.ok){google.script.run.withSuccessHandler(function(){sessionStorage.removeItem('atlasPendingSessionToken');location.replace('?route=sign-in&auth=failed');}).logoutAtlasSession(data.session.token);return}sessionStorage.removeItem('atlasPendingSessionToken');sessionStorage.setItem('atlasSessionToken',data.session.token);location.replace('?route='+encodeURIComponent(safeReturn()));}).withFailureHandler(function(){google.script.run.withSuccessHandler(function(){sessionStorage.removeItem('atlasPendingSessionToken');location.replace('?route=sign-in&auth=failed');}).logoutAtlasSession(data.session.token);}).selectAtlasSessionTenant(data.session.token,option.id)};root.appendChild(button)});}
function completeAuthentication(){if(!flowId||!expectedState||payload.state!==expectedState){finishFailure('interrupted');return}google.script.run.withSuccessHandler(function(response){if(terminal)return;if(!response||!response.ok){finishFailure(response&&response.error&&response.error.code==='PROVIDER_UNAVAILABLE'?'failed':'interrupted');return}var data=response.data;if(data.state==='IDENTITY_NOT_PROVISIONED'){finishFailure('not_provisioned');return}if(data.state==='MEMBERSHIP_INACTIVE'){finishFailure('membership');return}if(data.state==='COMMERCIAL_ACCESS_RESTRICTED'){finishFailure('commercial');return}if(data.state==='TENANT_SELECTION_REQUIRED'){activateTenant(data);return}if(data.state!=='SIGNED_IN'){finishFailure('failed');return}terminal=true;clearTimeout(watchdog);clearTransaction();sessionStorage.setItem('atlasSessionToken',data.session.token);status.textContent='Signed in. Opening Atlas…';status.className='atlas-notice atlas-notice--success';location.replace('?route='+encodeURIComponent(data.returnRoute||'home'));}).withFailureHandler(function(){finishFailure('failed');}).completeAtlasSignIn(payload);}
if(pendingToken){google.script.run.withSuccessHandler(function(){sessionStorage.removeItem('atlasPendingSessionToken');finishFailure('interrupted');}).withFailureHandler(function(){sessionStorage.removeItem('atlasPendingSessionToken');finishFailure('interrupted');}).logoutAtlasSession(pendingToken);}else if(payload.error){finishFailure(payload.error==='access_denied'?'cancelled':'failed');}else if(!deadline||Date.now()>=deadline){finishFailure('expired');}else{watchdog=setTimeout(function(){finishFailure('expired');},Math.max(1,deadline-Date.now()));completeAuthentication();}
</script></body></html>
