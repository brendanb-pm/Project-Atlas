<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<?!= includeAtlasUi_('UI/AtlasDesignSystem') ?>
<style>.vendor-layout{display:grid;grid-template-columns:minmax(260px,.7fr) minmax(0,1.4fr);gap:16px}.vendor-list{display:grid;gap:8px}.vendor-row{min-height:56px;text-align:left;padding:10px;background:#fff;border:1px solid var(--atlas-border);border-radius:6px}.vendor-row[aria-current=true]{border:3px solid var(--atlas-accent)}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.facts div{padding:10px;background:var(--atlas-surface-raised)}@media(max-width:800px){.vendor-layout{grid-template-columns:1fr}}@media(max-width:480px){.facts{grid-template-columns:1fr}}</style></head>
<body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="atlas-page"><header class="atlas-page-header"><div><h1>Vendors</h1><p>Materials, tooling, outside services, locations, contacts, and estimate references.</p></div><button id="newVendor" class="atlas-button atlas-button--primary" type="button">Add vendor</button></header><div id="notice" class="atlas-notice" role="status" hidden></div><section class="vendor-layout"><aside class="atlas-panel atlas-surface"><label class="atlas-field"><span>Search vendors</span><input id="search" type="search" autocomplete="off" placeholder="Name or business reference"></label><div id="list" class="vendor-list" aria-live="polite"><p class="atlas-loading">Loading vendors…</p></div></aside><section id="detail" class="atlas-panel atlas-surface"><h2>Choose a vendor</h2><p>Search or select a supplier or service provider.</p></section></section></main>
<script>
var selected=(new URLSearchParams(location.search)).get('id')||'',timer,loadSequence=0;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fail(r){var notice=document.getElementById('notice');if(AtlasUi.sessionExpired(r,notice))return;AtlasUi.announce(notice,r&&r.error&&r.error.message||'Vendor information is unavailable. Check your connection, then retry.','error');}
function search(){google.script.run.withSuccessHandler(function(r){if(!r||r.ok===false)return fail(r);var rows=r.data||[];document.getElementById('list').innerHTML=rows.length?rows.map(function(v){return '<button class="vendor-row" aria-current="'+(selected===v.id)+'" data-id="'+esc(v.id)+'"><b>'+esc(v.label)+'</b><br><span>'+esc(v.secondary)+'</span></button>';}).join(''):'<p class="atlas-empty">No vendors match this search.</p>';Array.from(document.querySelectorAll('.vendor-row')).forEach(function(b){b.onclick=function(){openVendor(b.dataset.id);};});}).withFailureHandler(fail).searchVendors(document.getElementById('search').value,'',50);}
function openVendor(id,restoring){selected=id;if(!restoring)history.pushState({},'', '?route=vendors&id='+encodeURIComponent(id));var sequence=++loadSequence,detail=document.getElementById('detail');detail.setAttribute('aria-busy','true');detail.innerHTML='<p class="atlas-loading" role="status">Loading Vendor…</p>';google.script.run.withSuccessHandler(function(r){if(sequence!==loadSequence)return;detail.removeAttribute('aria-busy');if(!r||r.ok===false){detail.innerHTML='<div class="atlas-error"><h2>Vendor unavailable</h2><p>The requested Vendor is unavailable or you no longer have access.</p><button class="atlas-button" onclick="restoreVendorRoute()">Retry</button></div>';return fail(r);}var m=r.data,v=m.vendor;detail.innerHTML='<h2 tabindex="-1">'+esc(v.name)+'</h2><div class="facts"><div><b>Status</b><br>'+esc(v.status)+'</div><div><b>Supplies</b><br>'+esc(v.supplyType)+'</div><div><b>Payment terms</b><br>'+esc(v.paymentTerms||'Not recorded')+'</div><div><b>Typical lead time</b><br>'+esc(v.typicalLeadTime||'Not recorded')+'</div></div><h3>Capabilities</h3><p>'+esc(m.capabilities.map(function(x){return x.capability;}).join(', ')||'None recorded')+'</p><h3>Contacts and locations</h3><p>'+m.contacts.length+' contacts · '+m.locations.length+' locations</p><h3>Recent estimates</h3><p>'+m.recentEstimates.length+' bounded estimate references</p>';detail.querySelector('h2').focus();search();}).withFailureHandler(function(){if(sequence!==loadSequence)return;detail.removeAttribute('aria-busy');detail.innerHTML='<div class="atlas-error"><h2>Vendor could not be loaded</h2><p>Check your connection, then retry.</p><button class="atlas-button" onclick="restoreVendorRoute()">Retry</button></div>';fail();}).getVendorWorkspace(id);}
function restoreVendorRoute(){selected=(new URLSearchParams(location.search)).get('id')||'';if(selected)return openVendor(selected,true);loadSequence++;document.getElementById('detail').removeAttribute('aria-busy');document.getElementById('detail').innerHTML='<h2>Choose a vendor</h2><p>Search or select a supplier or service provider.</p>';search();}
document.getElementById('search').addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(search,250);});
document.getElementById('newVendor').onclick=function(){document.getElementById('detail').innerHTML='<form id="vendorForm"><h2>Add vendor</h2><label class="atlas-field"><span>Vendor name</span><input name="name" required></label><label class="atlas-field"><span>Supplies</span><select name="supplyType"><option>BOTH</option><option>GOODS</option><option>SERVICES</option></select></label><label class="atlas-field"><span>Website</span><input name="website" type="url"></label><label class="atlas-field"><span>Notes</span><textarea name="notes"></textarea></label><button class="atlas-button atlas-button--primary" type="submit">Save vendor</button></form>';document.getElementById('vendorForm').onsubmit=function(event){event.preventDefault();var form=event.currentTarget,button=form.querySelector('button');AtlasUi.setBusy(button,true,'Saving…');google.script.run.withSuccessHandler(function(r){AtlasUi.setBusy(button,false);if(!r||r.ok===false)return fail(r);AtlasUi.announce(document.getElementById('notice'),'Vendor saved.','success');openVendor(r.data.id);}).withFailureHandler(function(r){AtlasUi.setBusy(button,false);fail(r);}).createVendor({name:form.name.value,supplyType:form.supplyType.value,website:form.website.value,notes:form.notes.value,capabilities:[]});};};
selected?openVendor(selected,true):search();
</script></body></html>
