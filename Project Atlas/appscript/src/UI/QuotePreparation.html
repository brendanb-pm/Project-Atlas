<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px Arial;background:#eef2f3;color:#17242a;margin:0}.wrap{max-width:950px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #cbd6da;border-radius:8px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}input,textarea{width:100%;padding:9px;font:inherit}button{min-height:44px;padding:0 15px;font-weight:bold}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Prepare Quote</h1><p>RFQ approved · human pricing required · no Job will be created.</p><section class="card"><h2>Quantity option</h2><div class="grid"><label>Quantity<input value="2" type="number"></label><label>Unit price<input value="1050" type="number"></label><label>NRE / setup / programming<input value="500" type="number"></label></div><p>Qty 2 example total: $2,600. Create Qty 5 as a separate quote option.</p></section><section class="card grid"><label>Payment terms<input value="Net 30"></label><label>Validity<input value="30 days"></label><label>Delivery<input value="within 3 weeks of acceptance unless otherwise agreed upon"></label></section><section class="card"><label>Assumptions<textarea></textarea></label><label>Exclusions<textarea></textarea></label><p>Drawing revisions and customer-supplied components remain visible on the customer-facing preview.</p></section><button>Save Draft</button> <button>Generate Preview</button> <button>Mark Ready to Send</button></main></body></html>
