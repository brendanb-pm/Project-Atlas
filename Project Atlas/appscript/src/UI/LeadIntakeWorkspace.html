<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:#eef3f4;color:#14252a;font:16px/1.45 system-ui,sans-serif}.page{max-width:1180px;margin:auto;padding:22px}.layout{display:grid;grid-template-columns:minmax(300px,.72fr) minmax(0,1.28fr);gap:18px}.panel{background:#fff;border:1px solid #c8d4d7;border-radius:8px;padding:18px}.eyebrow{text-transform:uppercase;font-size:.77rem;letter-spacing:.06em;font-weight:900}.field{display:grid;gap:5px;min-width:0;font-weight:750;margin-bottom:12px}.field input,.field select,.field textarea{box-sizing:border-box;width:100%;min-width:0;min-height:46px;padding:10px;border:1px solid #91a3a8;border-radius:6px;font:inherit}.field textarea{min-height:78px}.actions,.filters{display:flex;gap:9px;flex-wrap:wrap}.actions{align-items:flex-start}.button{min-height:48px;padding:10px 15px;border:1px solid #879a9f;border-radius:6px;background:#fff;font-weight:850}.primary{background:#bd5d00;color:#fff;border-color:#bd5d00}.notice{padding:11px;border-left:4px solid #13805c;background:#e8f7f1}.error{border-color:#b42318;background:#feeceb}.lead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px;padding:14px 0;border-bottom:1px solid #d8e1e3}.lead:last-child{border:0}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#dceaff;font-size:.78rem;font-weight:900}.callback{background:#fff0c7}.meta,.empty{color:#52666c}.skeleton{height:18px;background:#e2e9eb;margin:11px 0;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.45}}@media(max-width:820px){.layout{grid-template-columns:1fr}.page{padding:14px}}@media(max-width:560px){.button,.filters select{width:100%}.lead{grid-template-columns:1fr}.page{padding:9px}}
</style></head><body><main class="page"><header><p class="eyebrow">Unified sales intake</p><h1>Lead &amp; callback queue</h1><p>One queue for website, email import, phone, dealer referral, manual, and social leads.</p></header><div id="notice" role="status" aria-live="polite" hidden></div><div class="layout"><section class="panel"><h2>Add lead</h2><form id="lead-form"><label class="field">Source<select id="source"><option>WEBSITE</option><option>EMAIL_IMPORT</option><option>PHONE</option><option>DEALER_REFERRAL</option><option>MANUAL</option><option>SOCIAL</option></select></label><label class="field">Company<input id="company" maxlength="200"></label><label class="field">Contact name<input id="contact-name" maxlength="200"></label><label class="field">Email<input id="email" type="email" maxlength="320"></label><label class="field">Phone<input id="phone" maxlength="80"></label><label class="field">What did they request?<textarea id="summary" maxlength="1000" required></textarea></label><button class="button primary" type="submit">Add to queue</button></form></section><section class="panel"><div class="filters"><select id="status" aria-label="Lead status"><option value="">All active states</option><option>NEW</option><option>QUALIFIED</option><option>CALLBACK_REQUIRED</option><option>CONTACTED</option><option>QUOTED</option></select><select id="source-filter" aria-label="Lead source"><option value="">All sources</option><option>WEBSITE</option><option>EMAIL_IMPORT</option><option>PHONE</option><option>DEALER_REFERRAL</option><option>MANUAL</option><option>SOCIAL</option></select><button id="refresh" class="button" type="button">Refresh</button></div><h2>Callback-first queue</h2><div id="queue" aria-live="polite"></div></section></div></main><script>
(function(){'use strict';var sequence=0,pendingKey=null;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function announce(v,error){var n=document.getElementById('notice');n.hidden=!v;n.className='notice'+(error?' error':'');n.textContent=v||'';}function loading(){announce('Loading bounded lead queue.',false);document.getElementById('queue').innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';}function render(data){var rows=data.items||[];document.getElementById('queue').innerHTML=rows.length?rows.map(function(x){return'<article class="lead"><div><span class="badge '+(x.status==='CALLBACK_REQUIRED'?'callback':'')+'">'+esc(x.status)+'</span> <span class="badge">'+esc(x.source)+'</span><h3>'+esc(x.companyName||x.contactName||'Unnamed lead')+'</h3><p>'+esc(x.summary)+'</p><p class="meta">Owner: '+esc(x.ownerName||'Unassigned')+' · Received '+esc(x.createdAt)+'</p></div><div class="actions"><button class="button" type="button" data-action="activity" data-id="'+esc(x.id)+'">Add activity</button><button class="button primary" type="button" data-action="callback" data-id="'+esc(x.id)+'">Set callback</button><button class="button" type="button" data-action="convert" data-id="'+esc(x.id)+'">Convert</button></div></article>';}).join(''):'<p class="empty">No leads match this bounded queue.</p>';announce('Lead queue is current.',false);}function failure(){announce('Lead queue is unavailable. Retry before creating or changing a lead.',true);document.getElementById('queue').innerHTML='<p class="empty">Current lead state could not be confirmed.</p><button class="button" id="retry" type="button">Retry</button>';document.getElementById('retry').onclick=load;}function accept(n,r){if(n!==sequence)return;if(!r||r.ok===false){failure();return;}render(r.data);}function load(){var n=++sequence;loading();google.script.run.withSuccessHandler(function(r){accept(n,r);}).withFailureHandler(function(){if(n===sequence)failure();}).getLeadIntakeWorkspace(document.getElementById('status').value,document.getElementById('source-filter').value,50);}document.getElementById('refresh').onclick=load;document.getElementById('status').onchange=load;document.getElementById('source-filter').onchange=load;document.getElementById('lead-form').onsubmit=function(e){e.preventDefault();var button=e.submitter;pendingKey=pendingKey||('LEAD-UI-'+Date.now()+'-'+Math.random().toString(36).slice(2));button.disabled=true;announce('Adding lead…',false);google.script.run.withSuccessHandler(function(r){button.disabled=false;if(!r||r.ok===false){failure();return;}pendingKey=null;document.getElementById('lead-form').reset();if(r.data&&r.data.created===false){announce('Matching intake was already recorded.',false);return;}announce('Lead added to queue.',false);load();}).withFailureHandler(function(){button.disabled=false;failure();}).ingestLead({idempotencyKey:pendingKey,source:document.getElementById('source').value,companyName:document.getElementById('company').value,contactName:document.getElementById('contact-name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,summary:document.getElementById('summary').value});};window.AtlasLeadIntakeWorkspace={render:render,failure:failure,accept:accept};load();})();
</script></body></html>
