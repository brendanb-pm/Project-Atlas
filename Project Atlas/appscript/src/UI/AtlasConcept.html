<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#17232c;--paper:#eef2f3;--panel:#fff;--line:#cbd5da;--accent:#167a72;--muted:#63737c;--danger:#af2634}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px Arial,sans-serif}.top{height:62px;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 20px;gap:18px}.brand{font-weight:800}.brand small{display:block;color:#bac7cc;font-size:10px;letter-spacing:.1em}.tenant{margin-left:auto;display:flex;gap:8px;align-items:center}.tenant select,.tenant button{min-height:38px;border-radius:5px;border:0;padding:0 10px;font:inherit}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 62px)}nav{padding:16px 10px;background:#26343d}nav button{width:100%;text-align:left;color:#e7eff2;background:transparent;border:0;border-radius:5px;padding:11px 12px;font:inherit;min-height:44px;cursor:pointer}nav button:hover,nav button.active{background:#3a4b55;border-left:4px solid var(--accent);padding-left:8px}.main{padding:22px;min-width:0}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.subnav button,.action{border:0;border-radius:5px;background:#dde6e8;color:var(--ink);font-weight:700;min-height:42px;padding:0 13px;cursor:pointer}.action.primary{background:var(--accent);color:#fff}.heading{display:flex;justify-content:space-between;align-items:start}.heading h1{margin:0;font-size:27px}.heading p{margin:5px 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin-top:18px}.metric{background:var(--panel);padding:17px;border-radius:8px;border:1px solid var(--line)}.metric b{font-size:28px;display:block}.metric span{color:var(--muted);font-weight:700}.kanban{display:flex;gap:12px;overflow:auto;padding-bottom:14px}.column{min-width:205px;max-width:260px;flex:1;background:#e3eaec;border-radius:8px;padding:10px}.column h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}.column.drop{outline:3px solid var(--accent)}.work-card{background:#fff;border-radius:7px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0002;cursor:grab}.work-card strong{font-family:monospace;font-size:17px}.work-card p{margin:6px 0;font-size:13px}.badge{font-size:11px;border-radius:99px;padding:4px 7px;background:#e6eff1;font-weight:800}.badge.rush,.badge.blocked{background:#ffe0e2;color:#951e29}.floor{background:#111b20;color:#fff;padding:20px;border-radius:8px}.floor .kanban{min-height:460px}.floor .column{background:#26343d;min-width:245px}.floor .column h2{font-size:18px}.floor .work-card{font-size:17px}.overlay{position:fixed;inset:0;background:#071015df;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;z-index:4}.overlay div{border:4px solid var(--accent);padding:40px;max-width:700px}.overlay h1{font-size:42px;margin:0}.overlay strong{font:800 52px monospace}.wizard{max-width:850px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:20px}.steps{display:flex;gap:5px;flex-wrap:wrap}.steps span{padding:7px 10px;background:#e6edef;border-radius:99px;font-size:12px;font-weight:700}.steps .on{background:var(--accent);color:#fff}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.form label{font-weight:700;display:grid;gap:5px}.form input,.form select,.form textarea{min-height:43px;border:1px solid #aab9c0;border-radius:5px;padding:8px;font:inherit}.wide{grid-column:1/-1}.notice{position:fixed;right:18px;bottom:18px;color:#fff;background:#183f4d;padding:14px;border-radius:6px;font-weight:700}.notice.error{background:var(--danger)}[hidden]{display:none}@media(max-width:700px){.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:7px}nav button{min-width:max-content}.main{padding:14px}.form{grid-template-columns:1fr}.top{padding:0 12px}.floor{margin:-14px}.overlay h1{font-size:26px}.overlay strong{font-size:34px}}
</style></head><body><header class="top"><div class="brand" id="brand">Atlas<small>PRODUCT CONCEPT</small></div><div class="tenant"><label>Demo <select id="tenantSelect"><option value="VMOS">VMOS</option><option value="IPM">IPM Operations</option></select></label><button onclick="showAlert()">New work alert</button></div></header><div class="shell"><nav id="nav"></nav><main class="main"><div class="subnav"><button onclick="view='command';render()">Command Center</button><button onclick="view='kanban';render()">Native Kanban</button><button onclick="view='floor';render()">90&quot; Floor Board</button><button onclick="view='onboard';render()">First-run setup</button></div><div id="app"></div></main></div><div id="toast" class="notice" hidden></div><div id="alert" class="overlay" hidden><div><h1>NEW WORK RECEIVED</h1><strong>WO-26-1048</strong><p>Fixture Plate · Mill + inspect</p><p>Received just now</p><button class="action primary" onclick="hideAlert()">Dismiss preview</button></div></div><script>
var fallback={VMOS:{organizationName:'Vitality Modification Company',deploymentName:'VMOS',primaryColor:'#151719',secondaryColor:'#f5f5f3',accentColor:'#b51f2b',appearance:'dark',enabledModules:['CRM','RFQ_QUOTES','MANUFACTURING','FIREARMS','COATINGS','PURCHASING','INVOICING','PROCESS_LEARNING'],workflow:['RECEIVED','QUEUED','IN_PROCESS','COATING','FINAL_QC','READY','COMPLETE'],terminologyOverrides:{jobs:'Work Orders'}},IPM:{organizationName:'International Precision Machine',deploymentName:'IPM Operations',primaryColor:'#17334a',secondaryColor:'#f4f7f8',accentColor:'#167a72',appearance:'light',enabledModules:['CRM','RFQ_QUOTES','MANUFACTURING','PURCHASING','INVOICING','PROCESS_LEARNING'],workflow:['RECEIVED','QUEUED','IN_PROCESS','FINAL_QC','READY','COMPLETE'],terminologyOverrides:{jobs:'Jobs'}}};var key='VMOS',data,view='command',fireStep=0;function boot(){if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(function(r){data=r.data;render()}).getAtlasConceptBootstrap(key)}else{data=makeFallback(key);render()}}function makeFallback(k){var t=fallback[k],nav=['Command Center','Companies','Customers','RFQs','Quotes',t.terminologyOverrides.jobs,'Operations','Workload','Parts','Machines','Programs','Fixtures','Tools','Purchasing','Invoices','Documents','Process Trials'];if(t.enabledModules.indexOf('FIREARMS')>-1)nav.push('Firearms Intake','Firearms Work');if(t.enabledModules.indexOf('COATINGS')>-1)nav.push('Coating Work','Coating Queue');return{tenant:t,navigation:nav,kanban:{columns:t.workflow,cards:[{id:'WO-26-1042',customer:'Northstar',item:'Fixture Plate',service:'Mill + inspect',due:'Today',operator:'Ricardo',priority:'RUSH',status:'IN_PROCESS'},{id:'WO-26-1043',customer:'Delta',item:'Pump Housing',service:'Deburr',due:'Tomorrow',operator:'Mia',priority:'NEW',status:'QUEUED'},{id:'WO-26-1044',customer:'Apex',item:'Mount',service:'Coating',due:'Aug 12',operator:'Josh',priority:'BLOCKED',status:'BLOCKED'}]}}}document.getElementById('tenantSelect').onchange=function(){key=this.value;view='command';boot()};function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}function render(){var t=data.tenant;document.documentElement.style.setProperty('--accent',t.accentColor);document.documentElement.style.setProperty('--ink',t.primaryColor);document.documentElement.style.setProperty('--paper',t.secondaryColor);document.getElementById('brand').innerHTML=esc(t.deploymentName)+'<small>'+esc(t.organizationName)+'</small>';document.getElementById('nav').innerHTML=data.navigation.map(function(n){return'<button class="'+(n===view?'active':'')+'" onclick="selectNav('+JSON.stringify(n)+')">'+esc(n)+'</button>'}).join('');var app=document.getElementById('app');app.innerHTML=view==='kanban'?kanban(false):view==='floor'?floor():view==='onboard'?onboard():view==='Firearms Intake'?firearms():command()}function selectNav(n){view=n;render()}function command(){var mods=data.tenant.enabledModules,items=[['New RFQs','4'],['Quotes needing action','2'],['Jobs due soon','3'],['Blocked jobs','1'],['Work in process','7'],['Ready for pickup / shipment','2']];if(mods.indexOf('INVOICING')>-1)items.push(['Unpaid invoices','3']);if(mods.indexOf('PURCHASING')>-1)items.push(['Purchase approvals','2']);return'<div class="heading"><div><h1>Command Center</h1><p>Act on the work that needs attention.</p></div></div><div class="cards">'+items.map(function(x){return'<div class="metric"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join('')+'</div>'}function card(c){return'<article class="work-card" draggable="true" ondragstart="drag='+JSON.stringify(c).replace(/"/g,'&quot;')+'"><strong>'+esc(c.id)+'</strong><p>'+esc(c.customer)+' · '+esc(c.item)+'</p><p>'+esc(c.service)+'</p><span class="badge '+c.priority.toLowerCase()+'">'+esc(c.priority)+'</span> <span class="badge">Due '+esc(c.due)+'</span></article>'}var drag=null;function kanban(floorMode){var k=data.kanban,cols=k.columns.concat(['BLOCKED','WAITING_CUSTOMER','WAITING_PARTS']);return'<div class="heading"><div><h1>'+ (floorMode?'Atlas Floor Board':'Native Atlas Kanban')+'</h1><p>'+ (floorMode?'Large-display concept · canonical status remains Atlas-owned.':'Drag a card to request a workflow transition.')+'</p></div></div><section class="kanban">'+cols.map(function(s){var cs=k.cards.filter(function(c){return c.status===s});return'<div class="column" ondragover="event.preventDefault();this.classList.add(\'drop\')" ondragleave="this.classList.remove(\'drop\')" ondrop="dropCard('+JSON.stringify(s)+',this)"><h2>'+esc(s.replace(/_/g,' '))+'</h2>'+cs.map(card).join('')+'</div>'}).join('')+'</section>'}function floor(){return'<section class="floor">'+kanban(true)+'</section>'}function dropCard(target,el){el.classList.remove('drop');if(!drag)return;var order=data.kanban.columns,from=drag.status,allowed=order.indexOf(target)===order.indexOf(from)+1||['BLOCKED','WAITING_CUSTOMER','WAITING_PARTS'].indexOf(target)>-1;if(!allowed){toast('Transition rejected: '+from.replace(/_/g,' ')+' cannot move directly to '+target.replace(/_/g,' '),true);return}drag.status=target;toast('Transition requested. Atlas validated '+target.replace(/_/g,' ')+'.');render()}function firearms(){var steps=['Customer','Item','Requested Work','Optic / Parts','Condition','Photos','Authorization','Review'];var labels=['Customer name','Item type','Requested work','Optic / parts','Condition notes','Photo placeholders','Authorization','Review'];return'<div class="heading"><div><h1>Firearms Intake</h1><p>Dedicated module workspace · touch-first beta prototype.</p></div></div><section class="wizard"><div class="steps">'+steps.map(function(s,i){return'<span class="'+(i===fireStep?'on':'')+'">'+(i+1)+' '+s+'</span>'}).join('')+'</div><div class="form"><label>'+labels[fireStep]+'<input placeholder="Enter or select" '+(fireStep===6?'type="checkbox"':'')+'></label><label>Notes<input placeholder="Optional detail"></label><label class="wide">Operator guidance<textarea>Customer and item details stay in the Firearms module; the final work order is a canonical Atlas job.</textarea></label></div><button class="action" onclick="fireStep=Math.max(0,fireStep-1);render()">Back</button> <button class="action primary" onclick="nextFire()">'+(fireStep===7?'Create Work Order':'Continue')+'</button></section>'}function nextFire(){if(fireStep<7){fireStep++;render()}else toast('Prototype work order created as RECEIVED. No records were written.')}function onboard(){return'<div class="heading"><div><h1>Welcome to Atlas</h1><p>Small-shop setup concept—no administrator language.</p></div></div><section class="wizard"><div class="steps"><span class="on">1 Organization</span><span>2 Branding</span><span>3 Modules</span><span>4 Workflow</span><span>5 Users</span><span>6 Integrations</span><span>7 Import / Start Empty</span><span>8 Ready</span></div><div class="form"><label>Organization name<input placeholder="Your shop"></label><label>What should we call this workspace?<input placeholder="Operations"></label><label class="wide">Start simple<select><option>Start empty</option><option>Import customers and open work</option></select></label></div><button class="action primary" onclick="toast('Prototype only: setup would guide the next plain-language step.')">Continue</button></section>'}function toast(msg,error){var e=document.getElementById('toast');e.textContent=msg;e.className='notice'+(error?' error':'');e.hidden=false;setTimeout(function(){e.hidden=true},3500)}function showAlert(){document.getElementById('alert').hidden=false;setTimeout(hideAlert,10000)}function hideAlert(){document.getElementById('alert').hidden=true}boot();
</script></body></html>
