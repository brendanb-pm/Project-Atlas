<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:var(--atlas-page-bg,#eef3f4);color:var(--atlas-text,#14252a);font:16px/1.45 system-ui,sans-serif}.atlas-page{max-width:1120px;margin:auto;padding:24px}.layout{display:grid;grid-template-columns:minmax(280px,.75fr) minmax(0,1.25fr);gap:18px}.panel{background:#fff;border:1px solid #cad5d8;border-radius:8px;padding:18px}.eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}.quick{display:grid;gap:13px}.field{display:grid;gap:5px;min-width:0;font-weight:700}.field input,.field select,.field textarea{box-sizing:border-box;width:100%;min-width:0;min-height:46px;padding:10px;border:1px solid #9daeb3;border-radius:6px;font:inherit}.field textarea{min-height:82px}.next{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.button{min-height:48px;padding:10px 16px;border:1px solid #8fa0a5;border-radius:6px;background:#fff;font-weight:800}.primary{background:#bd5d00;color:#fff;border-color:#bd5d00}.notice{padding:11px;border-left:4px solid #15805d;background:#e8f7f1}.error{border-color:#b42318;background:#feeceb}.activity{padding:13px 0;border-bottom:1px solid #d9e1e3}.activity:last-child{border-bottom:0}.meta,.empty{color:#52666c}.status{display:inline-block;padding:4px 9px;border-radius:999px;background:#dceaff;font-size:.8rem;font-weight:800}.skeleton{height:18px;background:#e6ecee;margin:10px 0;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.45}}@media(max-width:800px){.layout{grid-template-columns:1fr}.atlas-page{padding:16px}}@media(max-width:560px){.next{grid-template-columns:1fr}.button{width:100%}.atlas-page{padding:10px}}
</style></head><body><main class="atlas-page"><header><p class="eyebrow">Customer / Contact CRM</p><h1>Activity &amp; follow-up</h1><p>Record the conversation, then add a next action only when one is needed.</p></header><div id="notice" role="status" aria-live="polite" hidden></div><div class="layout"><section class="panel"><h2>Quick activity</h2><form id="activity-form" class="quick"><label class="field">Customer or dealer<select id="customer" required></select></label><label class="field">Contact (optional)<select id="contact"><option value="">No Contact</option></select></label><label class="field">Activity type<select id="type" required><option>CALL</option><option>EMAIL</option><option>TEXT_MESSAGE</option><option>MEETING</option><option>NOTE</option><option>DEALER_VISIT</option><option>FOLLOW_UP</option><option>QUOTE_ACTIVITY</option><option>OTHER</option></select></label><label class="field">Short note<textarea id="summary" maxlength="500" required></textarea></label><div class="next"><label class="field">Next action (optional)<input id="next-action" maxlength="500"></label><label class="field">Due date / time<input id="due" type="datetime-local"></label></div><div class="actions"><button class="button primary" type="submit">Save activity</button><button class="button" id="cancel" type="button">Clear</button></div></form></section><section class="panel"><div class="actions"><div><p class="eyebrow">Recent timeline</p><h2 id="timeline-title">Choose a Customer</h2></div><button class="button" id="more" type="button" hidden>Load older</button></div><div id="timeline" aria-live="polite"><p class="empty">Select a Customer to see recent commercial activity.</p></div></section></div></main><script>
(function(){'use strict';var sequence=0,cursor=null,contactsByCustomer={};function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function announce(text,error){var n=document.getElementById('notice');n.hidden=!text;n.className='notice'+(error?' error':'');n.textContent=text||'';}function loading(){document.getElementById('timeline').innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';announce('Loading bounded recent activity.',false);}function renderContacts(customerId){document.getElementById('contact').innerHTML='<option value="">No Contact</option>'+((contactsByCustomer[customerId]||[]).map(function(c){return'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>';}).join(''));}function renderCustomers(data){var select=document.getElementById('customer');contactsByCustomer=data.contactsByCustomer||{};select.innerHTML='<option value="">Choose Customer</option>'+(data.customers||[]).map(function(c){return'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>';}).join('');}function renderTimeline(data,append){var target=document.getElementById('timeline'),rows=data.items||[],html=rows.map(function(a){return'<article class="activity"><span class="status">'+esc(a.activityType)+'</span><h3>'+esc(a.summary)+'</h3><p class="meta">'+esc(a.occurredAt)+' · '+esc(a.ownerName||'Unassigned')+(a.contactName?' · '+esc(a.contactName):'')+'</p>'+(a.nextAction?'<p><b>Next:</b> '+esc(a.nextAction)+' · '+esc(a.nextActionDueAt)+'</p>':'')+'</article>';}).join('');target.innerHTML=append?target.innerHTML+html:(html||'<p class="empty">No activity recorded for this Customer.</p>');cursor=data.nextCursor||null;document.getElementById('more').hidden=!cursor;announce('Recent activity is current.',false);}function failure(){announce('Activity is unavailable. Retry before saving or loading more.',true);document.getElementById('timeline').innerHTML='<p class="empty">The current timeline could not be confirmed.</p><button class="button" id="retry" type="button">Retry</button>';document.getElementById('retry').onclick=function(){load(false);};}function accept(n,result,append){if(n!==sequence)return;if(!result||result.ok===false){failure();return;}if(result.data.customers)renderCustomers(result.data);if(result.data.items)renderTimeline(result.data,append);}function load(append){var id=document.getElementById('customer').value;if(!id)return;var n=++sequence;if(!append)loading();google.script.run.withSuccessHandler(function(r){accept(n,r,append);}).withFailureHandler(function(){if(n===sequence)failure();}).getCrmActivityWorkspace(id,append?cursor:null,25);}document.getElementById('customer').onchange=function(){cursor=null;renderContacts(this.value);document.getElementById('timeline-title').textContent=this.options[this.selectedIndex].text;load(false);};document.getElementById('more').onclick=function(){load(true);};document.getElementById('cancel').onclick=function(){document.getElementById('activity-form').reset();};document.getElementById('activity-form').onsubmit=function(e){e.preventDefault();var next=document.getElementById('next-action').value,due=document.getElementById('due').value;if(Boolean(next)!==Boolean(due)){announce('Next action and due date must be supplied together.',true);return;}var button=e.submitter;button.disabled=true;announce('Saving activity…',false);google.script.run.withSuccessHandler(function(r){button.disabled=false;if(!r||r.ok===false){failure();return;}announce('Activity saved.',false);document.getElementById('summary').value='';document.getElementById('next-action').value='';document.getElementById('due').value='';cursor=null;load(false);}).withFailureHandler(function(){button.disabled=false;failure();}).createCrmActivity({customerId:document.getElementById('customer').value,contactId:document.getElementById('contact').value,activityType:document.getElementById('type').value,summary:document.getElementById('summary').value,nextAction:next,nextActionDueAt:due});};window.AtlasCrmActivityWorkspace={renderCustomers:renderCustomers,renderContacts:renderContacts,renderTimeline:renderTimeline,failure:failure,accept:accept};google.script.run.withSuccessHandler(function(r){accept(++sequence,r,false);}).withFailureHandler(failure).getCrmActivityWorkspace('',null,25);})();
</script></body></html>
