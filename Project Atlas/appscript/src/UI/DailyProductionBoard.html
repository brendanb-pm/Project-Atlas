<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<?!= includeAtlasUi_('UI/AtlasDesignSystem') ?>
<style>.board-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.board-meta{color:var(--atlas-text-muted)}.buckets{display:grid;gap:18px}.bucket{border-radius:var(--atlas-radius);overflow:hidden}.bucket-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#263840;color:#fff}.bucket--overdue .bucket-head{background:#7e2020}.bucket--today .bucket-head{background:#8a4b0b}.bucket-head h2{margin:0}.count{font-weight:800}.work-list{display:grid;gap:10px;padding:12px;background:var(--atlas-surface-raised)}.work-card{display:grid;grid-template-columns:minmax(170px,1.2fr) minmax(130px,.9fr) minmax(130px,.9fr) minmax(180px,1.2fr) auto;gap:12px;align-items:center;padding:14px;background:#fff;border:1px solid var(--atlas-border);border-left:6px solid var(--atlas-border-strong);border-radius:6px}.work-card[data-readiness=BLOCKED]{border-left-color:var(--atlas-danger)}.work-card[data-readiness=AT_RISK]{border-left-color:var(--atlas-warning)}.work-card[data-readiness=READY]{border-left-color:var(--atlas-success)}.work-card h3{margin:0;font-size:1rem}.eyebrow{font-size:.75rem;font-weight:800;text-transform:uppercase;color:var(--atlas-text-secondary)}.due{font-weight:800}.blocker{margin:5px 0 0;color:var(--atlas-danger);font-weight:800}.readiness{display:inline-flex;padding:4px 9px;border-radius:999px;font-weight:800;border:1px solid currentColor}.readiness--blocked{color:var(--atlas-danger)}.readiness--at-risk{color:var(--atlas-warning)}.readiness--ready{color:var(--atlas-success)}.state-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.82rem}.card-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.edit-panel{grid-column:1/-1;border-top:1px solid var(--atlas-border);padding-top:12px}.edit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:24px;text-align:center;color:var(--atlas-text-muted);background:#fff}.urgent-label{font-weight:900}.skip-link{position:absolute;left:-999px}.skip-link:focus{left:8px;top:8px;z-index:100;background:#fff;padding:10px}@media(max-width:1100px){.work-card{grid-template-columns:repeat(2,minmax(0,1fr))}.card-actions{justify-content:flex-start}.edit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.atlas-page{padding:12px}.board-head{display:block}.work-card{grid-template-columns:1fr;padding:12px}.work-card>div{min-width:0}.state-pair{grid-template-columns:1fr 1fr}.card-actions,.edit-actions{display:grid;grid-template-columns:1fr 1fr}.card-actions .atlas-button,.edit-actions .atlas-button{width:100%;min-height:44px}.edit-grid{grid-template-columns:1fr}.bucket-head{padding:10px 12px}}</style></head>
<body><?!= includeAtlasUi_('UI/NavigationFrame') ?><a class="skip-link" href="#productionBuckets">Skip to committed work</a><main class="atlas-page"><header class="board-head"><div><h1>Daily Production</h1><p>Committed Work Orders that require attention now.</p><p class="board-meta" id="meta">Loading tenant production time…</p></div><button id="refresh" class="atlas-button" type="button">Refresh board</button></header><div id="notice" class="atlas-notice" role="status" hidden></div><section id="productionBuckets" class="buckets" aria-live="polite"><div class="atlas-loading">Loading committed Work Orders…</div></section></main>
<script>var boardModel=null,busy=false,bucketOrder=['OVERDUE','DUE_TODAY','DUE_TOMORROW','THIS_WEEK'],labels={OVERDUE:'Overdue',DUE_TODAY:'Due today',DUE_TOMORROW:'Due tomorrow',THIS_WEEK:'This week'};function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function command(){return 'DP-'+Date.now()+'-'+Math.random().toString(16).slice(2);}function announce(message,tone){AtlasUi.announce(document.getElementById('notice'),message,tone);}
function boardUnavailable(message){announce(message,'error');document.getElementById('productionBuckets').innerHTML='<div class="atlas-error" role="alert"><h2>Board unavailable</h2><p>Daily Production could not be loaded. No Work Order was changed.</p><button class="atlas-button atlas-button--primary" type="button" onclick="load()">Retry</button></div>';}
function load(){if(busy)return;busy=true;AtlasUi.setBusy(document.getElementById('refresh'),true,'Refreshing…');google.script.run.withSuccessHandler(function(result){busy=false;AtlasUi.setBusy(document.getElementById('refresh'),false);if(!result||result.ok===false){showFailure(result);return;}boardModel=result.data;render();}).withFailureHandler(function(){busy=false;AtlasUi.setBusy(document.getElementById('refresh'),false);boardUnavailable('Daily Production is temporarily unavailable.');}).getDailyProductionBoard();}
function showFailure(result){var error=result&&result.error||{};if(AtlasUi.sessionExpired(result,document.getElementById('notice')))return;boardUnavailable(error.message||'The request could not be completed.');}
function render(){document.getElementById('meta').textContent='As of '+new Date(boardModel.generatedAt).toLocaleString()+' · Business timezone '+boardModel.timeZone+(boardModel.truncated?' · Additional committed work exists in the full production view.':'');var root=document.getElementById('productionBuckets');root.innerHTML=bucketOrder.map(function(bucket){var rows=boardModel.buckets[bucket]||[],urgent=bucket==='OVERDUE'?'<span class="urgent-label">PAST COMMITMENT</span>':'';return '<section class="bucket bucket--'+bucket.toLowerCase().replace('due_','')+'" aria-labelledby="heading-'+bucket+'"><header class="bucket-head"><div><h2 id="heading-'+bucket+'">'+labels[bucket]+'</h2>'+urgent+'</div><span class="count">'+rows.length+' Work Order'+(rows.length===1?'':'s')+'</span></header><div class="work-list">'+(rows.length?rows.map(card).join(''):'<div class="empty">No committed work in this bucket.</div>')+'</div></section>';}).join('');}
function card(job){var blocker=job.blocker?'<p class="blocker">BLOCKER: '+esc(job.blocker)+'</p>':'<p>No active blocker</p>';return '<article class="work-card" data-readiness="'+esc(job.readiness)+'" id="card-'+esc(job.id)+'"><div><span class="eyebrow">Work Order</span><h3>'+esc(job.id)+'</h3><p>'+esc(job.customerName)+' · '+esc(job.description)+'</p></div><div><span class="eyebrow">Promised</span><div class="due">'+esc(formatDue(job.dueDate))+'</div><p>Owner: <b>'+esc(job.ownerName)+'</b></p></div><div><span class="eyebrow">Production</span><p><b>'+esc(job.currentOperation)+'</b><br>'+esc(job.status)+'</p>'+blocker+'</div><div><span class="eyebrow">Readiness</span><p><span class="readiness readiness--'+job.readiness.toLowerCase().replace('_','-')+'">'+esc(job.readiness.replace('_',' '))+'</span></p><div class="state-pair"><span>Materials<br><b>'+esc(job.materials)+'</b></span><span>Tooling<br><b>'+esc(job.tooling)+'</b></span></div></div><div class="card-actions"><a class="atlas-button" href="'+esc(job.href)+'">Open Work Order</a><button class="atlas-button" type="button" onclick="editJob(\''+esc(job.id)+'\')">Update</button></div><div class="edit-panel" id="edit-'+esc(job.id)+'" hidden></div></article>';}
function formatDue(value){var d=new Date(value);return isNaN(d)?String(value):d.toLocaleString([],d.getHours()||d.getMinutes()?{dateStyle:'medium',timeStyle:'short'}:{dateStyle:'medium'});}
function findJob(id){var found=null;bucketOrder.some(function(bucket){return (boardModel.buckets[bucket]||[]).some(function(job){if(job.id===id){found=job;return true;}return false;});});return found;}
function ownerOptions(selected){return '<option value="">Unassigned</option>'+boardModel.owners.map(function(owner){return '<option value="'+esc(owner.id)+'" '+(owner.id===selected?'selected':'')+'>'+esc(owner.label)+'</option>';}).join('');}
function operationOptions(job){return job.operationOptions.map(function(item){return '<option value="'+esc(item.id)+'" '+(item.label===job.currentOperation?'selected':'')+'>'+esc(item.label)+'</option>';}).join('');}
function editJob(id){var job=findJob(id),panel=document.getElementById('edit-'+id);if(!job||!panel)return;panel.hidden=false;var operation=job.operationState==='AVAILABLE'?'<label class="atlas-field"><span>Current operation</span><select name="operationStatus" required>'+operationOptions(job)+'</select></label>':'<div class="atlas-notice atlas-notice--warning"><b>Current operation unavailable</b><br>This Work Order has no active Shop Floor workflow. Configure its canonical workflow before changing the operation.</div>';panel.innerHTML='<form onsubmit="saveJob(event,\''+esc(id)+'\')"><div class="edit-grid"><label class="atlas-field"><span>Owner</span><select name="ownerUserId">'+ownerOptions(job.ownerUserId)+'</select></label>'+operation+'<label class="atlas-field"><span>Materials</span><select name="materialReadiness"><option>UNKNOWN</option><option>READY</option><option>MISSING</option></select></label><label class="atlas-field"><span>Tooling</span><select name="toolingReadiness"><option>UNKNOWN</option><option>READY</option><option>MISSING</option></select></label><label class="atlas-field"><span>Blocker</span><input name="blockerReason" value="'+esc(job.blocker)+'" placeholder="Leave blank to remove blocker"></label></div><div class="edit-actions"><button class="atlas-button atlas-button--primary" type="submit">Save update</button><button class="atlas-button" type="button" onclick="completeJob(\''+esc(id)+'\')">Complete Work Order</button><button class="atlas-button" type="button" onclick="this.closest(\'.edit-panel\').hidden=true">Cancel</button></div></form>';var form=panel.querySelector('form');form.materialReadiness.value=job.materials;form.toolingReadiness.value=job.tooling;}
function saveJob(event,id,override){event.preventDefault();if(busy)return;var job=findJob(id),form=event.currentTarget,changes=override||{ownerUserId:form.ownerUserId.value,materialReadiness:form.materialReadiness.value,toolingReadiness:form.toolingReadiness.value,blockerReason:form.blockerReason.value},button=form.querySelector('[type=submit]');if(!override&&form.operationStatus){changes.operationStatus=form.operationStatus.value;changes.workflowId=job.workflowId;}busy=true;AtlasUi.setBusy(button,true,'Saving…');google.script.run.withSuccessHandler(function(result){busy=false;AtlasUi.setBusy(button,false);if(!result||result.ok===false){showFailure(result);return;}announce('Work Order updated and confirmed.','success');load();}).withFailureHandler(function(){busy=false;AtlasUi.setBusy(button,false);announce('The result could not be confirmed. Refresh before trying another update.','error');load();}).updateDailyProductionJob(id,changes,job.version,command());}
function completeJob(id){var panel=document.getElementById('edit-'+id),form=panel.querySelector('form');saveJob({preventDefault:function(){},currentTarget:form},id,{status:'COMPLETE'});}document.getElementById('refresh').onclick=load;load();</script></body></html>
