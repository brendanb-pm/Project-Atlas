<script>
var atlasNavigationState={profile:{productDisplayName:'Atlas',organizationName:'',deploymentDisplayName:'',enabledModules:[]},model:null};
function atlasCurrentRoute(){if(window.atlasServerRoute)return window.atlasServerRoute;var p=new URLSearchParams(location.search),route=p.get('route');if(route)return route;return p.has('sales')?'sales-activity':p.has('ideas')?'ideas':p.has('dashboard')?'operations-dashboard':p.has('shop')?'shop-floor':p.has('calendar')?'follow-ups':p.has('traveler')||p.has('qr')?'traveler':'home';}
function atlasNavigationProfile(){return atlasNavigationState.profile;}
function atlasApplyProfile(profile){atlasNavigationState.profile=profile||atlasNavigationState.profile;document.querySelectorAll('[data-atlas-product]').forEach(function(node){node.textContent=atlasNavigationState.profile.productDisplayName||'Atlas';});document.dispatchEvent(new CustomEvent('atlasnavigationready',{detail:atlasNavigationState}));}
function atlasRenderNavigation(model){atlasNavigationState.model=model;atlasApplyProfile(model.profile);var root=document.getElementById('atlas-nav-groups'),locationNode=document.getElementById('atlas-current-location'),current=null;(model.groups||[]).some(function(group){return (group.items||[]).some(function(item){if(item.id===model.currentRoute){current=item;return true;}return false;});});locationNode.textContent=current?current.label:'Workspace';document.querySelector('[data-atlas-tenant]').textContent=model.session&&model.session.tenantLabel||'Current tenant';document.querySelector('[data-atlas-user]').textContent=model.session&&model.session.userLabel||'Signed-in Atlas user';root.textContent='';(model.groups||[]).forEach(function(group){var section=document.createElement('section');section.className='atlas-shell-group';var title=document.createElement('b');title.className='atlas-shell-group-title';title.textContent=group.label;section.appendChild(title);(group.items||[]).forEach(function(item){var link=document.createElement('a');link.className='atlas-shell-link';link.href=item.href;link.title=item.label;link.setAttribute('aria-label',item.label);if(item.id===model.currentRoute)link.setAttribute('aria-current','page');link.innerHTML='<span class="atlas-shell-icon" aria-hidden="true">'+String(item.icon||'AT').replace(/[<>&]/g,'')+'</span><span class="atlas-shell-link-label"></span>';link.querySelector('.atlas-shell-link-label').textContent=item.label;section.appendChild(link);});root.appendChild(section);});if(model.accessState==='LIMITED_ACCESS'){var note=document.createElement('p');note.className='atlas-shell-access';note.setAttribute('role','status');note.textContent='Your Atlas access is not configured. Ask an administrator to review your active membership.';root.appendChild(note);}}
function atlasSetNavigationOpen(open){document.body.classList.toggle('atlas-shell-open',open);document.getElementById('atlas-shell-menu').setAttribute('aria-expanded',String(open));if(open)setTimeout(function(){var first=document.querySelector('.atlas-shell-nav a');if(first)first.focus();},0);}
document.getElementById('atlas-shell-menu').addEventListener('click',function(){atlasSetNavigationOpen(!document.body.classList.contains('atlas-shell-open'));});document.getElementById('atlas-shell-scrim').addEventListener('click',function(){atlasSetNavigationOpen(false);});document.addEventListener('keydown',function(event){if(event.key==='Escape'&&document.body.classList.contains('atlas-shell-open'))atlasSetNavigationOpen(false);});document.getElementById('atlas-shell-collapse').addEventListener('click',function(){var collapsed=!document.body.classList.contains('atlas-shell-collapsed');document.body.classList.toggle('atlas-shell-collapsed',collapsed);this.setAttribute('aria-expanded',String(!collapsed));this.setAttribute('aria-label',collapsed?'Expand navigation':'Collapse navigation');this.textContent=collapsed?'›':'‹';try{sessionStorage.setItem('atlasNavCollapsed',collapsed?'1':'0');}catch(ignored){}});try{if(sessionStorage.getItem('atlasNavCollapsed')==='1'){document.body.classList.add('atlas-shell-collapsed');document.getElementById('atlas-shell-collapse').setAttribute('aria-expanded','false');document.getElementById('atlas-shell-collapse').setAttribute('aria-label','Expand navigation');document.getElementById('atlas-shell-collapse').textContent='›';}}catch(ignored){}
setTimeout(function(){google.script.run.withSuccessHandler(function(response){if(response&&response.ok)atlasRenderNavigation(response.data);}).withFailureHandler(function(){atlasApplyProfile(atlasNavigationState.profile);}).getAtlasNavigation(atlasCurrentRoute());},0);window.addEventListener('popstate',function(){window.location.reload();});
</script>
