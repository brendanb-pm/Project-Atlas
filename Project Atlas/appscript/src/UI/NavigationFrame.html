<style>
.atlas-frame{background:#17262d;color:#fff;font:15px/1.35 Arial,sans-serif;padding:8px 16px;position:relative;z-index:30}.atlas-frame-row{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px;min-height:48px}.atlas-frame-brand{color:#fff;text-decoration:none;font-weight:800;overflow-wrap:anywhere}.atlas-frame-context{color:#c6d1d5;font-size:12px}.atlas-frame details{margin-left:auto}.atlas-frame summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;padding:0 13px;border:1px solid #66777e;border-radius:5px;font-weight:700}.atlas-frame summary::-webkit-details-marker{display:none}.atlas-frame summary:focus-visible,.atlas-frame a:focus-visible{outline:3px solid #75b6d0;outline-offset:2px}.atlas-frame-menu{position:absolute;right:16px;top:58px;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 74px);overflow:auto;background:#fff;color:#17262d;border:1px solid #b9c6cb;border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:12px}.atlas-frame-group{margin:7px 0 14px}.atlas-frame-group b{display:block;color:#61717a;font-size:11px;letter-spacing:.09em;margin:0 7px 5px}.atlas-frame-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.atlas-frame-links a{display:block;min-height:44px;padding:11px;border-radius:4px;color:#21343d;text-decoration:none;font-weight:700;overflow-wrap:anywhere}.atlas-frame-links a:hover{background:#edf2f4}.atlas-frame-links a[aria-current=page]{background:#dce9ee;border-left:4px solid #b86113;padding-left:7px}@media(max-width:600px){.atlas-frame{padding:7px 10px}.atlas-frame-context{display:none}.atlas-frame-menu{right:10px;width:calc(100vw - 20px)}.atlas-frame-links{grid-template-columns:1fr}}@media print{.atlas-frame{display:none!important}}
</style>
<header class="atlas-frame" aria-label="Atlas application navigation">
  <div class="atlas-frame-row"><a class="atlas-frame-brand" href="?route=home"><span data-atlas-product>Atlas</span></a><span class="atlas-frame-context" data-atlas-organization></span><details id="atlas-nav-menu"><summary aria-label="Open application navigation">Menu</summary><nav class="atlas-frame-menu" id="atlas-nav-groups" aria-label="Business workspaces"><div class="atlas-frame-group"><div class="atlas-frame-links"><a href="?route=home">Command Center</a></div></div></nav></details></div>
</header>
<script>
var atlasNavigationState={profile:{productDisplayName:'Atlas',organizationName:'',deploymentDisplayName:'',enabledModules:[],terminology:{customer:'Customer',job:'Job',workOrder:'Work Order',followUp:'Follow-Up'}},model:null};
function atlasCurrentRoute(){var p=new URLSearchParams(window.location.search),route=p.get('route');if(route)return route;return p.has('sales')?'sales-activity':p.has('ideas')?'ideas':p.has('dashboard')?'operations-dashboard':p.has('shop')?'shop-floor':p.has('calendar')?'follow-ups':p.has('traveler')||p.has('qr')?'traveler':'home';}
function atlasNavigationProfile(){return atlasNavigationState.profile;}
function atlasApplyProfile(profile){atlasNavigationState.profile=profile||atlasNavigationState.profile;document.querySelectorAll('[data-atlas-product]').forEach(function(node){node.textContent=atlasNavigationState.profile.productDisplayName||'Atlas';});document.querySelectorAll('[data-atlas-organization]').forEach(function(node){node.textContent=atlasNavigationState.profile.organizationName||atlasNavigationState.profile.deploymentDisplayName||'';});document.dispatchEvent(new CustomEvent('atlasnavigationready',{detail:atlasNavigationState}));}
function atlasRenderNavigation(model){atlasNavigationState.model=model;atlasApplyProfile(model.profile);var root=document.getElementById('atlas-nav-groups');if(!root)return;root.textContent='';(model.groups||[]).forEach(function(group){var section=document.createElement('section');section.className='atlas-frame-group';var title=document.createElement('b');title.textContent=group.label;var links=document.createElement('div');links.className='atlas-frame-links';(group.items||[]).forEach(function(item){var link=document.createElement('a');link.href=item.href;link.textContent=item.label;if(item.id===model.currentRoute)link.setAttribute('aria-current','page');links.appendChild(link);});section.appendChild(title);section.appendChild(links);root.appendChild(section);});}
google.script.run.withSuccessHandler(function(response){if(response&&response.ok)atlasRenderNavigation(response.data);}).withFailureHandler(function(){atlasApplyProfile(atlasNavigationState.profile);}).getAtlasNavigation(atlasCurrentRoute());
</script>
