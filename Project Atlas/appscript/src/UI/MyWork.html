<!doctype html><html lang="en"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><?!= includeAtlasUi_('UI/AtlasDesignSystem') ?>
<style>.work-page{max-width:1160px;margin:auto}.work-head{display:flex;align-items:end;justify-content:space-between;gap:18px}.work-head h1{margin:.2rem 0}.work-filters{display:flex;gap:8px;overflow:auto;padding:6px 0 14px}.work-filter{min-height:44px;white-space:nowrap;border:1px solid var(--atlas-border);border-radius:999px;padding:8px 15px;background:#fff;font-weight:800;cursor:pointer}.work-filter[aria-pressed=true]{background:#253a44;color:#fff}.work-group{margin:12px 0 24px}.work-group h2{margin-bottom:9px}.work-list{display:grid;gap:9px}.work-item{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;align-items:center;padding:15px;border:1px solid var(--atlas-border);border-left:5px solid #71838c;border-radius:7px;background:#fff}.work-item--OVERDUE{border-left-color:#b2342c}.work-item--BLOCKED{border-left-color:#9b4e19}.work-item--DUE_TODAY,.work-item--WAITING_ON_ME{border-left-color:#ad7413}.work-urgency{font-size:.76rem;font-weight:900;text-transform:uppercase}.work-item h3{margin:0 0 4px;font-size:1rem}.work-item p{margin:3px 0}.work-context{color:var(--atlas-text-muted)}.work-action{min-height:44px;display:inline-flex;align-items:center}.work-state{padding:24px;border:1px solid var(--atlas-border);border-radius:8px;background:#fff}.work-warning{margin:10px 0}.work-overflow{border-left:4px solid #ad7413}.work-loading{min-height:280px;display:grid;place-items:center}@media(max-width:768px){.work-head{align-items:start;flex-direction:column}.work-item{grid-template-columns:1fr}.work-action{justify-content:center;width:100%}.work-urgency{order:-1}}@media(max-width:420px){.atlas-page{padding:12px}.work-item{padding:14px}.work-filters{margin-right:-12px}.work-head p{margin-bottom:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head>
<body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="atlas-page work-page"><header class="work-head"><div><p class="atlas-eyebrow">Personal execution</p><h1>My Work</h1><p>Assigned work and actions that require you.</p></div><a class="atlas-button atlas-button--secondary" href="?route=home">Mission Control</a></header><div id="notice" class="atlas-notice" role="status" aria-live="polite" hidden></div><div id="filters" class="work-filters" aria-label="Filter My Work"></div><div id="queue" class="work-loading" aria-busy="true"><p>Loading your work...</p></div></main>
<script>var workParams=new URLSearchParams(location.search),activeFilter=workParams.get('workFilter')||'All',model=null,generation=0;
function e(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function load(){var mine=++generation,queue=document.getElementById('queue');queue.className='work-loading';queue.setAttribute('aria-busy','true');queue.innerHTML='<p>Loading your work...</p>';google.script.run.withSuccessHandler(function(result){if(mine!==generation)return;if(!result||result.ok===false){if(AtlasUi.sessionExpired(result,document.getElementById('notice')))return failure('Your Atlas session has expired. Sign in again to continue.',true);return failure(result&&result.error&&result.error.message||'My Work could not be loaded.');}model=result.data;render();}).withFailureHandler(function(){if(mine!==generation)return;failure('My Work could not be loaded. Check your connection and retry.');}).getMyWork();}
function failure(message,expired){var queue=document.getElementById('queue');queue.className='work-state';queue.setAttribute('aria-busy','false');queue.innerHTML='<section role="alert"><h2>'+(expired?'Session expired':'My Work unavailable')+'</h2><p>'+e(message)+'</p><div class="atlas-actions">'+(expired?'<a class="atlas-button atlas-button--primary" href="?route=sign-in&returnRoute='+encodeURIComponent(location.search)+'">Sign in again</a>':'<button class="atlas-button atlas-button--primary" type="button" onclick="load()">Retry</button>')+'<a class="atlas-button" href="?route=home">Mission Control</a></div></section>';}
function setFilter(value){activeFilter=value;var url=new URL(location.href);if(value==='All')url.searchParams.delete('workFilter');else url.searchParams.set('workFilter',value);history.replaceState({},'',url.pathname+url.search);render();}
function matches(item){return activeFilter==='All'||activeFilter==='Due'&&['OVERDUE','DUE_TODAY','DUE_TOMORROW','THIS_WEEK'].indexOf(item.urgency)!==-1||activeFilter==='Blocked'&&item.urgency==='BLOCKED'||item.filter===activeFilter;}
function render(){var queue=document.getElementById('queue'),filters=model.availableFilters||['All'];if(filters.indexOf(activeFilter)===-1)activeFilter='All';document.getElementById('filters').innerHTML=filters.map(function(filter){return '<button class="work-filter" type="button" aria-pressed="'+(filter===activeFilter)+'" onclick="setFilter(\''+e(filter)+'\')">'+e(filter)+'</button>';}).join('');queue.setAttribute('aria-busy','false');queue.className='';if(model.state==='PERMISSION_LIMITED'){queue.innerHTML=state('No personal work sources are available for your current access.','Open an available workspace from the navigation.');return;}if(model.state==='TOTAL_FAILURE'){failure('Your work sources are temporarily unavailable. Retry to refresh authoritative state.');return;}var visible=(model.items||[]).filter(matches),partial=model.state==='PARTIAL_FAILURE'?'<div class="atlas-notice atlas-notice--warning work-warning" role="status"><b>Some work is unavailable.</b> Available work remains current and usable.</div>':'',warnings=(model.unavailable||[]).map(function(item){return '<div class="atlas-notice atlas-notice--warning work-warning" role="status"><b>'+e(item.source)+' unavailable.</b> '+e(item.message)+'</div>';}).join(''),groups=(model.groups||[]).map(function(group){var items=group.items.filter(matches);return items.length?'<section class="work-group" aria-labelledby="group-'+e(group.id)+'"><h2 id="group-'+e(group.id)+'">'+e(group.label)+'</h2><div class="work-list">'+items.map(workItem).join('')+'</div></section>':'';}).join(''),overflow=model.overflow&&model.overflow.hasMore?'<div class="atlas-notice work-overflow"><b>More work exists.</b> Open the relevant authoritative workspace to review items beyond this bounded queue.</div>':'';queue.innerHTML=partial+warnings+overflow+(visible.length?groups:state(activeFilter==='All'?"You're caught up.":'No work matches this filter.','Use another filter or open Mission Control.'));}
function state(title,message){return '<section class="work-state"><h2>'+e(title)+'</h2><p>'+e(message)+'</p><a class="atlas-button" href="?route=home">Mission Control</a></section>';}
function workItem(item){var due=item.dueAt?'Due '+new Date(item.dueAt).toLocaleString():'No due date recorded';return '<article class="work-item work-item--'+e(item.urgency)+'"><div class="work-urgency">'+e(item.urgency.replace(/_/g,' '))+'</div><div><h3>'+e(item.label)+'</h3><p>'+e(item.reason)+'</p><p class="work-context">'+e(item.context)+' / '+e(due)+' / '+e(item.status)+'</p></div><a class="atlas-button atlas-button--primary work-action" href="'+e(item.href)+'">'+e(item.actionLabel)+'</a></article>';}
window.addEventListener('popstate',function(){var next=new URLSearchParams(location.search).get('workFilter')||'All';activeFilter=next;render();});load();</script></body></html>
