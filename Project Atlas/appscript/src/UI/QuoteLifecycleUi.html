<script>
(function(){
function cents(v){var t=String(v||'0').trim(),p;if(!/^\d+(\.\d{1,2})?$/.test(t))throw new Error('Use an amount with at most two decimal places.');p=t.split('.');return p[0]+(p[1]||'').padEnd(2,'0');}
function announce(message,tone){AtlasUi.announce(document.getElementById('notice'),message,tone||'info');}
function refresh(){if(!state.quote)return;google.script.run.withSuccessHandler(function(result){if(!result||result.ok===false)return announce(result&&result.error&&result.error.message||'Unable to refresh the Quote revision.','error');state.revision=result.data&&result.data.revision||null;render();}).withFailureHandler(function(){announce('Unable to refresh the Quote revision.','error');}).getQuoteRevisionWorkspace(state.quote.id);}
function render(){var host=document.getElementById('quoteLifecycleActions'),r=state.revision;if(!host)return;host.querySelector('[data-status]').textContent=r?'Revision '+r.revisionNumber+' · '+r.status:'No customer revision saved.';host.querySelector('[data-issue]').disabled=!r||r.status!=='DRAFT';host.querySelector('[data-accept]').disabled=!r||r.status!=='ISSUED';host.querySelector('[data-print]').disabled=!r||['ISSUED','ACCEPTED','SUPERSEDED','EXPIRED','VOIDED'].indexOf(r.status)===-1;}
function model(){var q=document.getElementById('quantity').value,u=cents(document.getElementById('unitPrice').value),n=cents(document.getElementById('nre').value),lines=[{description:document.getElementById('description').value||'Quoted work',quantity:q,unitPriceMinor:u,lineType:'RECURRING'}];if(Number(n)>0)lines.push({description:'One-time / NRE',quantity:'1',unitPriceMinor:n,lineType:'ONE_TIME'});return {id:state.revision&&state.revision.id,quoteId:state.quote&&state.quote.id,description:document.getElementById('description').value,currency:document.getElementById('currency').value,lines:lines};}
function save(){var value;try{value=model();}catch(error){return announce(error.message,'error');}if(!value.quoteId)return announce('Open a Quote before saving customer pricing.','error');google.script.run.withSuccessHandler(function(result){if(!result||result.ok===false)return announce(result&&result.error&&result.error.message||'Unable to save. Your entries are preserved.','error');state.revision=result.data.revision;render();announce('Customer Quote draft saved.','success');}).withFailureHandler(function(){announce('Atlas could not confirm the save. Refresh before retrying.','warning');}).saveQuoteRevisionDraft(value);}
function mutate(method){if(!state.revision)return announce('Save the customer revision first.','error');google.script.run.withSuccessHandler(function(result){if(!result||result.ok===false){refresh();return announce(result&&result.error&&result.error.message||'Atlas could not confirm the change. Refresh before retrying.','warning');}refresh();announce(method==='issueQuoteRevision'?'Immutable customer revision issued.':'Customer acceptance recorded against this revision.','success');}).withFailureHandler(function(){refresh();announce('Atlas could not confirm the change. Refresh before retrying.','warning');})[method](state.revision.id,state.revision.version);}
function printOutput(){if(!state.revision)return announce('Issue a revision before printing.','error');google.script.run.withSuccessHandler(function(result){if(!result||result.ok===false)return announce(result&&result.error&&result.error.message||'Customer output is unavailable.','error');var x=result.data,w=window.open('','_blank'),rows=x.lines.map(function(l){return '<tr><td>'+esc(l.description)+'</td><td>'+esc(l.quantity)+'</td><td>$'+(Number(l.unitPriceMinor)/100).toFixed(2)+'</td><td>$'+(Number(l.extendedPriceMinor)/100).toFixed(2)+'</td></tr>';}).join('');w.document.write('<!doctype html><html><head><title>'+esc(x.quoteNumber)+'</title><style>body{font:16px Arial;max-width:850px;margin:40px auto;color:#17212b}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ccd3da;text-align:left}.total{text-align:right;font-size:1.2rem}@media print{button{display:none}}</style></head><body><h1>Quote '+esc(x.quoteNumber)+'</h1><p>Revision '+esc(x.revision)+' · '+esc(x.status)+'</p><h2>'+esc(x.customer)+'</h2><p>'+esc(x.description)+'</p><table><thead><tr><th>Description</th><th>Quantity</th><th>Unit price</th><th>Extended</th></tr></thead><tbody>'+rows+'</tbody></table><p class="total"><b>Total: $'+(Number(x.totalMinor)/100).toFixed(2)+'</b></p><p>'+esc(x.paymentTerms||'')+'</p><p>'+esc(x.customerNotes||'')+'</p><button onclick="print()">Print</button></body></html>');w.document.close();}).withFailureHandler(function(){announce('Customer output could not be rendered.','error');}).getCustomerQuoteOutput(state.revision.id);}
window.addEventListener('load',function(){var section=document.getElementById('lifecycle');section.innerHTML='<h2>Lifecycle and customer output</h2><p data-status>No customer revision saved.</p><p>Draft customer pricing → immutable issued revision → customer acceptance → Job / Work Order.</p><p class="atlas-notice atlas-notice--warning">Internal costing and sources are private. Verify customer preview before issue.</p><div id="quoteLifecycleActions" class="atlas-actions"><span data-status></span><button class="atlas-button atlas-button--primary" data-issue type="button">Issue this revision</button><button class="atlas-button" data-accept type="button">Record acceptance</button><button class="atlas-button" data-print type="button">Print customer Quote</button></div>';document.getElementById('save').onclick=save;section.querySelector('[data-issue]').onclick=function(){mutate('issueQuoteRevision');};section.querySelector('[data-accept]').onclick=function(){mutate('acceptQuoteRevision');};section.querySelector('[data-print]').onclick=printOutput;setTimeout(refresh,0);});
})();
</script>
