<script>
(function(){
var busy=false,loadedCosting=null,lifecycleHistory=[];
function cents(v){var t=String(v||'0').trim(),p;if(!/^\d+(\.\d{1,2})?$/.test(t))throw new Error('Use an amount with at most two decimal places.');p=t.split('.');return p[0]+(p[1]||'').padEnd(2,'0');}
function announce(message,tone){AtlasUi.announce(document.getElementById('notice'),message,tone||'info');}
function setBusy(value){busy=value;Array.from(document.querySelectorAll('#quoteLifecycleActions button,#save')).forEach(function(button){button.disabled=value;});if(!value)render();}
function refresh(){if(!state.quote)return;google.script.run.withSuccessHandler(function(result){if(!result||result.ok===false){setBusy(false);return announce(result&&result.error&&result.error.message||'Unable to refresh the Quote revision.','error');}var data=result.data||{},r=data.revision;lifecycleHistory=data.revisions||[];state.revision=r||null;state.acceptedRevision=data.acceptedRevision||null;state.revisionLines=data.lines||[];if(r){var recurring=state.revisionLines.filter(function(x){return x.lineType!=='ONE_TIME';})[0],oneTime=state.revisionLines.filter(function(x){return x.lineType==='ONE_TIME';})[0];document.getElementById('description').value=r.description||recurring&&recurring.description||'';document.getElementById('quantity').value=recurring&&recurring.quantity||'';document.getElementById('unitPrice').value=recurring?(Number(recurring.unitPriceMinor)/100).toFixed(2):'';document.getElementById('nre').value=oneTime?(Number(oneTime.unitPriceMinor)/100).toFixed(2):'0.00';document.getElementById('quoteTerms').value=r.paymentTerms||'';document.getElementById('quoteNotes').value=r.customerNotes||'';document.getElementById('quoteValidThrough').value=r.validThrough?String(r.validThrough).slice(0,10):'';calculate();}setBusy(false);render();}).withFailureHandler(function(){setBusy(false);announce('Unable to refresh the Quote revision. Your entries remain available; try Refresh before another lifecycle action.','error');}).getQuoteRevisionWorkspace(state.quote.id);}
function lifecycleLabel(r){if(!r)return 'No customer revision saved.';var status=String(r.status||'').toUpperCase(),label={DRAFT:'Draft',ISSUED:'Issued',ACCEPTED:'Accepted',SUPERSEDED:'Superseded',EXPIRED:'Expired',VOIDED:'Voided'}[status]||status;return label+' — Rev '+r.revisionNumber;}
function render(){var host=document.getElementById('quoteLifecycleActions'),r=state.revision,accepted=state.acceptedRevision;if(!host)return;host.querySelector('[data-status]').textContent=lifecycleLabel(r)+(accepted&&(!r||accepted.id!==r.id)?' · Accepted offer: Rev '+accepted.revisionNumber:'');host.querySelector('[data-issue]').disabled=busy||!r||r.status!=='DRAFT'||!state.permissions.issue;host.querySelector('[data-accept]').disabled=busy||!r||r.status!=='ISSUED'||!state.permissions.approve;host.querySelector('[data-new]').disabled=busy||!r||r.status==='DRAFT';host.querySelector('[data-print]').disabled=busy||!r||['ISSUED','ACCEPTED','SUPERSEDED','EXPIRED','VOIDED'].indexOf(r.status)===-1;host.querySelector('[data-job]').hidden=!accepted||!state.permissions.createJob;host.querySelector('[data-job]').disabled=busy;host.querySelector('[data-history]').innerHTML=lifecycleHistory.length?lifecycleHistory.map(function(item){return '<li>'+esc(lifecycleLabel(item))+'</li>';}).join(''):'<li>No revisions yet.</li>';document.getElementById('save').disabled=busy||!!(r&&r.status!=='DRAFT');}
function model(){var q=document.getElementById('quantity').value,u=cents(document.getElementById('unitPrice').value),n=cents(document.getElementById('nre').value),existing=state.revision&&state.revision.status==='DRAFT'?(state.revisionLines||[]):[],recurring=existing.filter(function(x){return x.lineType!=='ONE_TIME';})[0],oneTime=existing.filter(function(x){return x.lineType==='ONE_TIME';})[0],lines=[{id:recurring&&recurring.id||'',description:document.getElementById('description').value||'Quoted work',quantity:q,unitPriceMinor:u,lineType:'RECURRING'}];if(Number(n)>0)lines.push({id:oneTime&&oneTime.id||'',description:'One-time / NRE',quantity:'1',unitPriceMinor:n,lineType:'ONE_TIME'});return {id:state.revision&&state.revision.status==='DRAFT'?state.revision.id:'',quoteId:state.quote&&state.quote.id,description:document.getElementById('description').value,currency:document.getElementById('currency').value,paymentTerms:document.getElementById('quoteTerms').value,customerNotes:document.getElementById('quoteNotes').value,validThrough:document.getElementById('quoteValidThrough').value,lines:lines};}
function costModel(revision){var qty=document.getElementById('quantity').value,rows=Array.from(document.querySelectorAll('.cost-row')).map(function(row){var basis=row.querySelector('[data-k=basis]').value,amount=cents(row.querySelector('[data-k=amount]').value||'0'),operand=row.querySelector('[data-k=operand]').value||qty,vendor=row.querySelector('[data-k=vendor]'),vendorId=vendor.dataset.vendorId||'',vendorText=vendor.value.trim(),item={id:row.dataset.costLineId||'',description:row.querySelector('[data-k=description]').value,category:row.querySelector('[data-k=category]').value,basis:basis,purpose:'INTERNAL_COST_DETAIL',timing:basis==='ONE_TIME'?'ONE_TIME':'RECURRING',currency:document.getElementById('currency').value,vendorId:vendorId};if(vendorText&&!vendorId)throw new Error('Select the Vendor from the search results, or clear the Vendor field.');if(basis==='PER_PART')item.costEachMinor=amount;else if(basis==='BATCH_TOTAL'||basis==='ONE_TIME'){item.sourceAmountMinor=amount;item.allocationQuantity=operand;}else if(basis==='HOURLY_PER_PART'){item.rateMinor=amount;item.hoursPerPart=operand;}else{item.rateMinor=amount;item.quantity=operand;}return item;}),recurring=cents((Number(document.getElementById('quantity').value||0)*Number(document.getElementById('unitPrice').value||0)).toFixed(2)),oneTime=cents(document.getElementById('nre').value||'0'),decision=loadedCosting&&loadedCosting.pricing&&loadedCosting.pricing[0],customerLine=(state.revisionLines||[]).filter(function(x){return x.lineType!=='ONE_TIME';})[0];return {id:loadedCosting&&loadedCosting.estimate&&loadedCosting.estimate.id,version:loadedCosting&&loadedCosting.estimate&&loadedCosting.estimate.version,quoteId:state.quote.id,quoteRevisionId:revision.id,quoteQuantity:qty,currency:document.getElementById('currency').value,customerRecurringMinor:recurring,customerOneTimeMinor:oneTime,lines:rows,pricing:[{id:decision&&decision.id||'',quoteLineItemId:customerLine&&customerLine.id,method:'MANUAL_PRICE',sellUnitPriceMinor:cents(document.getElementById('unitPrice').value),sellExtendedPriceMinor:recurring,currency:document.getElementById('currency').value,rationale:'Operator-approved customer pricing'}]};}
function saveCosting(revision){if(!state.permissions.costWrite)return setBusy(false),announce('Customer Quote draft saved.','success');var costing;try{costing=costModel(revision);}catch(error){setBusy(false);return announce('Customer draft saved; internal costing still needs attention: '+error.message,'warning');}google.script.run.withSuccessHandler(function(result){setBusy(false);if(!result||result.ok===false)return announce('Customer draft saved. Internal costing was not confirmed; entries remain available for retry.','warning');loadedCosting={estimate:result.data.estimate,lines:result.data.rollup.lines,pricing:result.data.pricing};populateCosting(loadedCosting);announce('Customer pricing and internal costing saved.','success');}).withFailureHandler(function(){setBusy(false);announce('Customer draft saved. Atlas could not confirm internal costing; refresh before retrying.','warning');}).saveQuoteCostEstimate(costing);}
function save(){if(busy)return;var value;try{value=model();}catch(error){return announce(error.message,'error');}if(!value.quoteId)return announce('Open a Quote before saving customer pricing.','error');setBusy(true);google.script.run.withSuccessHandler(function(result){if(!result||result.ok===false){setBusy(false);return announce(result&&result.error&&result.error.message||'Unable to save. Your entries are preserved.','error');}state.revision=result.data.revision;state.revisionLines=result.data.lines||[];render();saveCosting(state.revision);}).withFailureHandler(function(){setBusy(false);announce('Atlas could not confirm the save. Refresh before retrying.','warning');}).saveQuoteRevisionDraft(value);}
function mutate(method){if(busy||!state.revision)return announce('Save the customer revision first.','error');setBusy(true);google.script.run.withSuccessHandler(function(result){setBusy(false);if(!result||result.ok===false){refresh();return announce(result&&result.error&&result.error.message||'Atlas could not confirm the change. Refresh before retrying.','warning');}refresh();announce(method==='issueQuoteRevision'?'Immutable customer revision issued.':'Customer acceptance recorded against this revision.','success');}).withFailureHandler(function(){setBusy(false);refresh();announce('Atlas could not confirm the change. Atlas refreshed the authoritative state before another attempt.','warning');})[method](state.revision.id,state.revision.version);}
function newRevision(){if(busy||!state.revision||state.revision.status==='DRAFT')return;state.revision=null;state.revisionLines=[];loadedCosting=null;render();announce('New revision prepared from the prior customer offer. Save it to create a new immutable revision identity.','info');}
function createJob(){var accepted=state.acceptedRevision;if(busy||!accepted)return announce('Accept the exact issued revision before creating a Work Order.','error');setBusy(true);var input={partId:state.rfq&&state.rfq.customerRfqNumber||'',quantity:document.getElementById('quantity').value||'',revision:'Quote Rev '+accepted.revisionNumber};google.script.run.withSuccessHandler(function(result){setBusy(false);if(!result||result.ok===false){refresh();return announce(result&&result.error&&result.error.message||'Atlas could not confirm Work Order creation. The Quote was refreshed before retry.','warning');}location.href='?route=job&jobId='+encodeURIComponent(result.data.id);}).withFailureHandler(function(){setBusy(false);refresh();announce('Atlas could not confirm Work Order creation. Atlas refreshed the accepted revision before another attempt.','warning');}).convertQuoteToJob(state.quote.id,input);}
function printOutput(){if(busy||!state.revision)return announce('Issue a revision before printing.','error');var popup=window.open('','_blank');if(!popup)return announce('Your browser blocked the print window. Allow pop-ups for Atlas, then try again.','error');popup.document.write('<p>Preparing customer Quote…</p>');setBusy(true);google.script.run.withSuccessHandler(function(result){setBusy(false);if(!result||result.ok===false){popup.close();return announce(result&&result.error&&result.error.message||'Customer output is unavailable.','error');}var x=result.data,rows=x.lines.map(function(l){return '<tr><td>'+esc(l.description)+'</td><td>'+esc(l.quantity)+'</td><td>$'+(Number(l.unitPriceMinor)/100).toFixed(2)+'</td><td>$'+(Number(l.extendedPriceMinor)/100).toFixed(2)+'</td></tr>';}).join('');popup.document.open();popup.document.write('<!doctype html><html><head><title>'+esc(x.quoteNumber)+'</title><style>body{font:16px Arial;max-width:850px;margin:40px auto;color:#17212b}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ccd3da;text-align:left}.total{text-align:right;font-size:1.2rem}@media print{button{display:none}}</style></head><body><h1>Quote '+esc(x.quoteNumber)+'</h1><p>Revision '+esc(x.revision)+' · '+esc(x.status)+'</p><p>Issued: '+esc(x.issueDate||'')+(x.validThrough?' · Valid through: '+esc(x.validThrough):'')+'</p><h2>'+esc(x.customer)+'</h2><p>'+esc(x.description)+'</p><table><thead><tr><th>Description</th><th>Quantity</th><th>Unit price</th><th>Extended</th></tr></thead><tbody>'+rows+'</tbody></table><p class="total"><b>Total: $'+(Number(x.totalMinor)/100).toFixed(2)+'</b></p><p>'+esc(x.paymentTerms||'')+'</p><p>'+esc(x.customerNotes||'')+'</p><button onclick="print()">Print</button></body></html>');popup.document.close();}).withFailureHandler(function(){setBusy(false);popup.close();announce('Customer output could not be rendered. Your Quote remains unchanged.','error');}).getCustomerQuoteOutput(state.revision.id);}
function populateCosting(costing){loadedCosting=costing||null;document.getElementById('costRows').innerHTML='';state.lines=[];(costing&&costing.lines||[]).forEach(function(line){var amount=line.basis==='PER_PART'?Number(line.costEachMinor)/100:Number(line.rateMinor||line.sourceAmountMinor||0)/100,operand=line.hoursPerPart||line.quantity||line.allocationQuantity||'';addLine({id:line.id,description:line.description,category:line.category,basis:line.basis,amount:amount,operand:operand,vendorId:line.vendorId||'',vendorLabel:line.vendorName||'',vendorReferenceState:line.vendorReferenceState||''});});}
window.AtlasQuoteLifecycle={loadWorkspace:function(workspace){populateCosting(workspace.costing);setTimeout(refresh,0);}};
window.addEventListener('load',function(){var section=document.getElementById('lifecycle');section.innerHTML='<h2>Lifecycle and customer output</h2><div class="form-grid"><label class="atlas-field"><span>Valid through</span><input id="quoteValidThrough" type="date"></label><label class="atlas-field"><span>Customer terms</span><input id="quoteTerms"></label><label class="atlas-field"><span>Customer notes</span><input id="quoteNotes"></label></div><p>Draft customer pricing → immutable issued revision → customer acceptance → Job / Work Order.</p><p class="atlas-notice atlas-notice--warning">Internal costing and sources are private. Verify customer preview before issue.</p><div id="quoteLifecycleActions"><p><strong data-status>No customer revision saved.</strong></p><div class="atlas-actions"><button class="atlas-button atlas-button--primary" data-issue type="button">Issue this revision</button><button class="atlas-button" data-accept type="button">Accept this issued revision</button><button class="atlas-button" data-new type="button">Create successor revision</button><button class="atlas-button" data-print type="button">Print customer Quote</button><button class="atlas-button atlas-button--primary" data-job type="button" hidden>Create Job / Work Order</button></div><h3>Revision history</h3><ul data-history><li>No revisions yet.</li></ul></div>';document.getElementById('save').onclick=save;section.querySelector('[data-issue]').onclick=function(){mutate('issueQuoteRevision');};section.querySelector('[data-accept]').onclick=function(){mutate('acceptQuoteRevision');};section.querySelector('[data-new]').onclick=newRevision;section.querySelector('[data-print]').onclick=printOutput;section.querySelector('[data-job]').onclick=createJob;render();});
})();
</script>
