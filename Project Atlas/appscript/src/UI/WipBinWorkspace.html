<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><?!= includeAtlasUi_('UI/AtlasDesignSystem') ?><style>
.flow,.actions,.scan{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.flow{font-weight:900;font-size:.8rem;letter-spacing:.05em}.scan .atlas-field{flex:1;min-width:230px}.grid{display:grid;grid-template-columns:minmax(250px,.65fr) minmax(0,1.35fr);gap:18px}.bin-card{padding:15px;border:1px solid var(--atlas-border);border-radius:7px}.bin-label{font-size:clamp(1.8rem,4vw,3rem);font-weight:900}.status{display:inline-flex;padding:6px 11px;border-radius:999px;font-weight:900}.status::before{content:'●';margin-right:7px}.available,.empty{background:#dcfce7;color:#14532d}.assigned{background:#dbeafe;color:#1e3a8a}.hold,.quarantined,.stale{background:#fef3c7;color:#713f12}.retired,.conflict,.unavailable{background:#fee2e2;color:#7f1d1d}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.fact{padding:12px;background:var(--atlas-surface-muted,#f3f6f7);border-left:4px solid var(--atlas-border);overflow-wrap:anywhere}.fact b{display:block}.next{margin-top:14px;padding:14px;border:2px solid var(--atlas-border);border-radius:7px}.atlas-button{min-height:48px}.loading{height:18px;margin:10px;background:#e5e7eb;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.4}}@media(max-width:900px){.grid{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.atlas-page{padding:12px}.facts{grid-template-columns:1fr}.actions .atlas-button,.scan .atlas-button{width:100%}}
</style></head><body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="atlas-page"><header class="atlas-page-header"><div><p class="atlas-eyebrow">Shop floor / Physical WIP</p><h1>WIP bin tracking</h1><p>Scan the physical bin to confirm its current Job, operation, queue, and next safe action.</p></div></header><p class="flow">SCAN BIN → CURRENT JOB / LOCATION → MOVE / ASSIGN / RELEASE / OPEN JOB</p><section class="atlas-panel atlas-surface scan"><label class="atlas-field" for="bin-query"><span>Scan QR / Data Matrix or find bin</span><input id="bin-query" class="atlas-input" type="search" autocomplete="off" placeholder="Scan bin or enter label"></label><button id="find" class="atlas-button atlas-button--primary" type="button">Scan / find</button><button id="retry" class="atlas-button" type="button" hidden>Retry</button><div id="notice" class="atlas-notice" role="status" aria-live="polite" hidden style="flex-basis:100%"></div></section><section class="grid"><aside class="atlas-panel atlas-surface"><h2>Bins</h2><div id="results" aria-live="polite"></div></aside><section id="detail" class="atlas-panel atlas-surface" aria-live="polite" aria-busy="true"></section></section></main><script>
(function(){'use strict';var sequence=0;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function notice(v,t){var n=document.getElementById('notice');n.hidden=!v;n.className='atlas-notice'+(t?' atlas-notice--'+t:'');n.textContent=v||'';}function loading(){notice('Loading current bin assignment and location.','');document.getElementById('detail').setAttribute('aria-busy','true');document.getElementById('detail').innerHTML='<p>Loading current physical state…</p><div class="loading"></div><div class="loading"></div>';document.getElementById('results').innerHTML='<p>Searching bounded bin records…</p>';}function failure(){notice('WIP bin state is unavailable. Retry before moving or releasing the bin.','error');document.getElementById('retry').hidden=false;document.getElementById('results').innerHTML='<p>No confirmed bins.</p>';document.getElementById('detail').setAttribute('aria-busy','false');document.getElementById('detail').innerHTML='<div class="bin-card"><h2>Bin unavailable</h2><p>The current Job and physical location could not be confirmed.</p></div>';}function render(m){document.getElementById('retry').hidden=true;document.getElementById('detail').setAttribute('aria-busy','false');document.getElementById('results').innerHTML=(m.results||[]).length?m.results.map(function(x){return'<button class="bin-card" type="button" data-id="'+esc(x.id)+'"><b>'+esc(x.label)+'</b><br>'+esc(x.status)+' · '+esc(x.location)+'</button>';}).join(''):'<div class="bin-card"><h3>No bins found</h3><p>Check the identifier or create a reusable bin.</p></div>';if(!m.bin){notice('No bin selected.','');document.getElementById('detail').innerHTML='<div class="bin-card"><h2>Scan or choose a bin</h2></div>';return;}var b=m.bin,j=b.job||{},o=b.operation||{},blocked={HOLD:true,STALE:true,RETIRED:true,CONFLICT:true}[b.readiness]===true,assignDisabled=blocked||!!j.id,moveDisabled=blocked||b.status==='RETIRED',releaseDisabled=blocked||!j.id;notice('Bin '+b.readiness+'. '+b.nextAction+'.',blocked?'warning':'success');document.getElementById('detail').innerHTML='<div class="actions"><span class="status '+esc(b.readiness.toLowerCase())+'">'+esc(b.readiness)+'</span><span class="status '+esc(b.status.toLowerCase())+'">'+esc(b.status)+'</span></div><p class="bin-label">'+esc(b.label)+'</p><p>'+esc(b.id)+'</p><div class="facts"><div class="fact">Current Job<b>'+esc(j.id||'No active Job')+'</b></div><div class="fact">Work class<b>'+esc(j.classification||'EMPTY')+'</b></div><div class="fact">Location / queue<b>'+esc(b.location)+'</b></div><div class="fact">Current operation<b>'+esc(o.code||'—')+' · '+esc(o.status||'—')+'</b></div><div class="fact">Owner / assignee<b>'+esc(o.assignee||j.owner||'Unassigned')+'</b></div><div class="fact">Job status<b>'+esc(j.status||'—')+'</b></div></div><section class="next"><h2>Next action: '+esc(b.nextAction)+'</h2><p>'+esc(b.guidance||'Confirm the physical state before continuing.')+'</p><div class="actions"><button class="atlas-button atlas-button--primary" type="button" '+(!j.id&&assignDisabled?'disabled':'')+'>'+esc(j.id?'Open Job':'Assign Job')+'</button><button class="atlas-button" type="button" '+(moveDisabled?'disabled':'')+'>Move bin</button><button class="atlas-button" type="button" '+(releaseDisabled?'disabled':'')+'>Release bin</button><button class="atlas-button" type="button">History</button></div></section>';Array.prototype.forEach.call(document.querySelectorAll('[data-id]'),function(btn){btn.onclick=function(){load(btn.getAttribute('data-id'));};});}function accept(n,r){if(n!==sequence)return;if(!r||r.ok===false){failure();return;}render(r.data);}function load(q){var n=++sequence;loading();google.script.run.withSuccessHandler(function(r){accept(n,r);}).withFailureHandler(function(){if(n===sequence)failure();}).getWipBinWorkspace(String(q||''),25);}document.getElementById('find').onclick=function(){load(document.getElementById('bin-query').value);};document.getElementById('retry').onclick=function(){load(document.getElementById('bin-query').value);};document.getElementById('bin-query').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();load(e.currentTarget.value);}};window.AtlasWipBinWorkspace={render:render,loading:loading,failure:failure,accept:accept};load('');})();
</script></body></html>
