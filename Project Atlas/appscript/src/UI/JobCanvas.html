<!doctype html><html lang="en"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<?!= includeAtlasUi_('UI/AtlasDesignSystem') ?>
<style>.job-page{max-width:1500px;margin:auto}.job-crumbs,.job-actions,.job-facts,.job-tabs,.job-cards{display:flex;gap:10px;flex-wrap:wrap}.job-crumbs{margin-bottom:14px}.job-header{padding:22px;border-left:6px solid var(--atlas-accent,#c56a18)}.job-header-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}.job-header h1{margin:.15rem 0}.job-reference{color:var(--atlas-text-muted)}.job-facts{margin-top:18px}.job-fact{min-width:145px}.job-fact b{display:block;font-size:.78rem;text-transform:uppercase;color:var(--atlas-text-muted)}.job-attention{margin-top:16px;padding:12px;border-left:4px solid var(--atlas-danger);background:#fff4f2}.job-tabs{position:sticky;top:62px;z-index:8;margin:16px 0;padding:7px;background:var(--atlas-surface-raised);border:1px solid var(--atlas-border);border-radius:7px}.job-tab{min-height:44px;border:0;border-radius:5px;background:transparent;padding:9px 13px;font-weight:800;cursor:pointer}.job-tab[aria-selected=true]{background:#253a44;color:#fff}.job-panel{min-height:260px}.job-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.job-card{padding:16px;border:1px solid var(--atlas-border);border-radius:7px;background:#fff}.job-card h3{margin-top:0}.job-list{display:grid;gap:10px}.job-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:13px;border:1px solid var(--atlas-border);border-radius:6px}.job-row p{margin:.25rem 0}.job-status{display:inline-flex;border:1px solid currentColor;border-radius:999px;padding:3px 8px;font-size:.78rem;font-weight:900}.job-empty,.job-section-error{padding:22px;border:1px dashed var(--atlas-border);border-radius:7px}.job-section-error{border-style:solid;border-left:4px solid var(--atlas-danger)}.job-loading{min-height:280px;display:grid;place-items:center}.job-actions .atlas-button{min-height:44px}.job-secondary{font-size:.83rem;color:var(--atlas-text-muted)}@media(max-width:1050px){.job-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:768px){.job-header-top{grid-template-columns:1fr}.job-tabs{position:static;display:grid;grid-template-columns:repeat(3,1fr)}.job-tab{padding:8px 5px}.job-grid{grid-template-columns:1fr}}@media(max-width:520px){.atlas-page{padding:12px}.job-header{padding:16px}.job-actions{display:grid}.job-actions .atlas-button{width:100%}.job-tabs{grid-template-columns:repeat(2,1fr)}.job-row{grid-template-columns:1fr}.job-fact{width:calc(50% - 10px);min-width:0}}</style></head>
<body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="atlas-page job-page" id="job-main"><nav class="job-crumbs" aria-label="Breadcrumb"><a class="atlas-button atlas-button--secondary" href="?route=jobs">Work Orders</a><span aria-hidden="true">/</span><span id="crumb-current">Job Canvas</span></nav><div id="notice" class="atlas-notice" role="status" aria-live="polite" hidden></div><div id="canvas" class="job-loading" aria-busy="true"><p>Loading Work Order context…</p></div></main>
<script>
var params=new URLSearchParams(location.search),jobId=params.get('jobId')||params.get('id')||'',model=null,generation=0,activeSection='overview';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function unpack(result){if(!result||result.ok===false){var e=new Error(result&&result.error&&result.error.message||'The Work Order could not be loaded.');e.code=result&&result.error&&result.error.code||'';throw e;}return result.data;}function announce(message,tone){AtlasUi.announce(document.getElementById('notice'),message,tone);}function link(label,href,primary){return href?'<a class="atlas-button '+(primary?'atlas-button--primary':'atlas-button--secondary')+'" href="'+esc(href)+'">'+esc(label)+'</a>':'';}function status(value){return '<span class="job-status">'+esc(value||'Unknown')+'</span>';}function empty(message,href,label){return '<div class="job-empty"><p>'+esc(message)+'</p>'+(href?link(label||'Open workspace',href,false):'')+'</div>';}function failure(name){var found=(model.sectionFailures||[]).filter(function(x){return x.section===name;})[0];return found?'<div class="job-section-error" role="alert"><h3>'+esc(name)+' unavailable</h3><p>'+esc(found.message)+'</p><button class="atlas-button" type="button" onclick="load()">Retry Canvas</button></div>':'';}
function load(){var mine=++generation,host=document.getElementById('canvas');host.setAttribute('aria-busy','true');host.className='job-loading';host.innerHTML='<p>Loading Work Order context…</p>';if(!jobId){rootFailure('Choose a Work Order from the Work Orders list.');return;}google.script.run.withSuccessHandler(function(result){if(mine!==generation)return;try{model=unpack(result);render();}catch(error){rootFailure(error.message,error.code);}}).withFailureHandler(function(){if(mine!==generation)return;rootFailure('Atlas could not load this Work Order. Check your connection and retry.');}).getJobCanvas(jobId);}
function rootFailure(message,code){var host=document.getElementById('canvas');host.setAttribute('aria-busy','false');host.className='';var expired=code==='SESSION_EXPIRED'||code==='AUTHORIZATION_REQUIRED';host.innerHTML='<section class="atlas-error" role="alert"><h1>'+(expired?'Session expired':'Work Order unavailable')+'</h1><p>'+esc(expired?'Your Atlas session has expired. Sign in again to continue.':message)+'</p><div class="job-actions">'+(expired?link('Sign in again','?route=sign-in&returnRoute='+encodeURIComponent(location.search),true):'<button class="atlas-button atlas-button--primary" type="button" onclick="load()">Retry</button>')+link('Return to Work Orders','?route=jobs',false)+'</div></section>';}
function render(){document.getElementById('crumb-current').textContent=model.job.number;var h=model.header,j=model.job,c=model.customer,host=document.getElementById('canvas');host.setAttribute('aria-busy','false');host.className='';host.innerHTML='<header class="job-header atlas-surface"><div class="job-header-top"><div><p class="atlas-eyebrow">Work Order</p><h1>'+esc(j.number)+' — '+esc(j.description)+'</h1><p><a href="'+esc(model.links.customer)+'">'+esc(c.label)+'</a> <span class="job-reference">· '+esc(j.id)+'</span></p></div><div class="job-actions">'+link(model.primaryAction.label,model.primaryAction.href,true)+link('All Work Orders',model.links.jobs,false)+'</div></div><div class="job-facts"><div class="job-fact"><b>Status</b>'+status(j.status)+'</div><div class="job-fact"><b>Owner</b>'+esc(h.owner.label)+'</div><div class="job-fact"><b>Current operation</b>'+esc(h.currentOperation)+'</div><div class="job-fact"><b>Promised</b>'+esc(j.dueDate||'Not scheduled')+'</div><div class="job-fact"><b>Readiness</b>'+status(h.readiness)+'</div></div>'+(h.blocker?'<div class="job-attention"><b>BLOCKER</b><br>'+esc(h.blocker)+'</div>':'')+'</header>'+tabs()+failuresSummary()+'<section class="job-panel" id="job-panel" tabindex="-1"></section>';show(activeSection,false);}
function tabs(){var defs=sectionDefs();return '<div class="job-tabs" role="tablist" aria-label="Work Order sections">'+defs.map(function(x){return '<button class="job-tab" id="tab-'+x[0]+'" role="tab" aria-controls="job-panel" aria-selected="'+(activeSection===x[0])+'" type="button" onclick="show(\''+x[0]+'\',true)">'+esc(x[1])+'</button>';}).join('')+'</div>';}
function sectionDefs(){var out=[['overview','Overview']];if(model.sections.commercial)out.push(['commercial','Commercial']);out.push(['production','Production']);if(model.sections.purchasing)out.push(['purchasing','Purchasing']);if(model.sections.documents)out.push(['documents','Documents']);if(model.sections.billing)out.push(['billing','Billing']);if(model.sections.firearms)out.push(['firearms','Firearms']);out.push(['history','History']);return out;}
function failuresSummary(){return model.sectionFailures&&model.sectionFailures.length?'<div class="atlas-notice atlas-notice--warning" role="status"><b>Some related context is unavailable.</b> The Work Order remains usable; affected sections offer retry guidance.</div>':'';}
function show(name,focus){activeSection=name;document.querySelectorAll('.job-tab').forEach(function(tab){tab.setAttribute('aria-selected',String(tab.id==='tab-'+name));});var panel=document.getElementById('job-panel');panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby','tab-'+name);panel.innerHTML=section(name);if(focus)panel.focus();}
function kv(title,value){return '<article class="job-card"><h3>'+esc(title)+'</h3><p>'+esc(value||'Not recorded')+'</p></article>';}
function section(name){var s=model.sections;if(name==='overview')return '<div class="job-grid">'+kv('Customer',model.customer.label)+kv('Current operation',model.header.currentOperation)+kv('Materials',model.header.materialReadiness)+kv('Tooling',model.header.toolingReadiness)+kv('Owner',model.header.owner.label)+kv('Purchase order',model.job.poNumber||'Not recorded')+'</div>'+(model.header.blocker?kv('Active blocker',model.header.blocker):'');if(name==='commercial')return failure('Commercial')||commercial(s.commercial);if(name==='production')return failure('Production')||production(s.production);if(name==='purchasing')return failure('Purchasing')||purchasing(s.purchasing);if(name==='documents')return failure('Documents')||documents(s.documents);if(name==='billing')return failure('Billing')||billing(s.billing);if(name==='firearms')return failure('Firearms')||firearms(s.firearms);return failure('History')||history(s.history);}
function commercial(x){return '<div class="job-grid">'+recordCard('Customer',x.customer,x.customer&&'?route=customers&id='+encodeURIComponent(x.customer.id))+recordCard('RFQ',x.rfq,x.rfq&&'?route=rfqs&id='+encodeURIComponent(x.rfq.id))+recordCard('Quote',x.quote,x.quote&&x.quote.href)+recordCard('Accepted offer',x.acceptedRevision,'')+'</div>';}
function recordCard(type,x,href){if(!x)return kv(type,'Not linked');return '<article class="job-card"><p class="atlas-eyebrow">'+esc(type)+'</p><h3>'+esc(x.label)+'</h3>'+status(x.status||x.referenceState||'Linked')+(href?'<p>'+link('Open '+type,href,false)+'</p>':'')+'</article>';}
function production(x){return '<div class="job-grid">'+kv('Current operation',x.currentOperation)+kv('Overall readiness',x.readiness)+kv('Materials',x.materialReadiness)+kv('Tooling',x.toolingReadiness)+kv('Owner / operator',x.owner.label)+kv('Workflow',x.workflowId||'Canonical workflow unavailable')+'</div><div class="job-actions">'+link('Open Daily Production',x.links.dailyProduction,true)+link('Open Shop Floor',x.links.shopFloor,false)+'</div>';}
function purchasing(x){var create=x.createHref?'<div class="job-actions">'+link('Create Purchase Request',x.createHref,true)+'</div>':'';if(!x.items.length)return empty(x.emptyMessage,x.createHref,'Create Purchase Request');return create+list(x.items,function(row){return '<b>'+esc(row.label)+'</b><p>'+esc(row.vendorLabel)+' · '+esc(row.status)+' · '+esc(row.receiptState)+'</p>';});}
function documents(x){if(!x.items.length)return empty('No visible documents are linked to this Job or its Quote.');return list(x.items,function(row){return '<b>'+esc(row.label)+'</b><p>'+esc([row.type,row.purpose,row.visibility,row.referenceState].filter(Boolean).join(' · '))+'</p>';});}
function billing(x){if(!x.items.length)return empty('No Invoice is linked to this Work Order.','?route=invoices','Open Invoices');return list(x.items,function(row){return '<b>'+esc(row.label)+'</b><p>'+esc(row.status)+' · '+esc(row.receiptCount)+' recorded receipt(s) totaling '+esc(row.recordedReceiptTotal)+'</p><p class="job-secondary">Receipt total is shown; Atlas does not imply recalculated Invoice balance.</p>';});}
function firearms(x){if(!x.items.length)return empty('No serialized firearm is linked to this Work Order.');return list(x.items,function(row){return '<b>'+esc(row.label)+'</b><p>Serial '+esc(row.serial)+' · '+esc(row.custody)+' · '+esc(row.status)+'</p>';});}
function history(x){if(!x.items.length)return empty('No production history is recorded for this Work Order.');return list(x.items,function(row){return '<b>'+esc(row.type)+'</b><p>'+esc(row.summary)+'</p><p class="job-secondary">'+esc(row.occurredAt)+' · '+esc(row.actor)+'</p>';});}
function list(items,body){return '<div class="job-list">'+items.map(function(row){return '<article class="job-row"><div>'+body(row)+'</div>'+(row.href?link('Open',row.href,false):'')+'</article>';}).join('')+'</div>';}
load();
</script></body></html>
