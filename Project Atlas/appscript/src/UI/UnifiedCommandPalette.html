<style>
.atlas-command-trigger{position:fixed;z-index:42;top:9px;right:74px;min-height:44px;border:1px solid #66777e;border-radius:6px;background:#24343d;color:#fff;padding:0 12px;font-weight:700;cursor:pointer}.atlas-command-trigger kbd{margin-left:8px;padding:2px 5px;border:1px solid #71818a;border-radius:3px;font:11px Arial,sans-serif}.atlas-command-trigger:focus-visible,.atlas-command-close:focus-visible,.atlas-command-result:focus-visible{outline:3px solid #75b6d0;outline-offset:2px}.atlas-command-backdrop{position:fixed;inset:0;z-index:80;background:rgba(12,23,29,.62);display:grid;place-items:start center;padding:8vh 16px}.atlas-command-backdrop[hidden]{display:none}.atlas-command-dialog{width:min(680px,100%);max-height:78vh;overflow:auto;background:#fff;color:#17262d;border-radius:9px;box-shadow:0 18px 60px rgba(0,0,0,.32)}.atlas-command-head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid #d5dfe3}.atlas-command-input{flex:1;min-width:0;min-height:48px;border:1px solid #9eafb7;border-radius:5px;padding:0 13px;font:16px Arial,sans-serif}.atlas-command-close{min-width:44px;min-height:44px;border:0;background:#edf2f4;border-radius:5px;font-weight:800}.atlas-command-status{margin:0;padding:12px 15px;color:#52646e}.atlas-command-results{display:grid;padding:0 8px 10px}.atlas-command-result{display:grid;gap:2px;width:100%;min-height:58px;padding:10px;border:0;border-bottom:1px solid #e0e6e8;background:#fff;text-align:left;cursor:pointer}.atlas-command-result[aria-selected=true]{background:#e2edf1;outline:2px solid #32718d}.atlas-command-type{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#9b570f}.atlas-command-label{font-weight:800}.atlas-command-secondary{color:#5c6d76;font-size:13px}.atlas-command-error{color:#8d2525}.atlas-command-spinner:before{content:'';display:inline-block;width:14px;height:14px;margin-right:7px;border:2px solid #c5d0d5;border-top-color:#b86113;border-radius:50%;vertical-align:-2px;animation:atlas-command-spin .7s linear infinite}@keyframes atlas-command-spin{to{transform:rotate(360deg)}}@media(max-width:800px){.atlas-command-trigger{right:14px}.atlas-command-trigger kbd{display:none}.atlas-command-backdrop{padding:0}.atlas-command-dialog{width:100%;height:100%;max-height:none;border-radius:0}.atlas-command-head{padding-top:16px}}@media(prefers-reduced-motion:reduce){.atlas-command-spinner:before{animation:none}}
</style>
<button class="atlas-command-trigger" id="atlas-command-trigger" type="button" aria-haspopup="dialog" aria-controls="atlas-command-dialog">Search Atlas <kbd>Ctrl K</kbd></button>
<div class="atlas-command-backdrop" id="atlas-command-backdrop" hidden>
  <section class="atlas-command-dialog" id="atlas-command-dialog" role="dialog" aria-modal="true" aria-labelledby="atlas-command-title">
    <div class="atlas-command-head"><label id="atlas-command-title" for="atlas-command-input" class="atlas-visually-hidden">Search Atlas</label><input class="atlas-command-input" id="atlas-command-input" type="search" autocomplete="off" placeholder="Search customers, quotes, jobs, vendors…"><button class="atlas-command-close" id="atlas-command-close" type="button" aria-label="Close search">×</button></div>
    <p class="atlas-command-status" id="atlas-command-status" role="status" aria-live="polite">Type at least two characters. Business IDs also work.</p>
    <div class="atlas-command-results" id="atlas-command-results" role="listbox" aria-label="Atlas search results"></div>
  </section>
</div>
<script>
(function(){var trigger=document.getElementById('atlas-command-trigger'),backdrop=document.getElementById('atlas-command-backdrop'),input=document.getElementById('atlas-command-input'),close=document.getElementById('atlas-command-close'),status=document.getElementById('atlas-command-status'),results=document.getElementById('atlas-command-results'),generation=0,timer=null,selected=-1,returnFocus=null;
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function setBusy(active,message){input.setAttribute('aria-busy',String(active));status.className='atlas-command-status'+(active?' atlas-command-spinner':'');status.textContent=message||'';}
function open(){returnFocus=document.activeElement;backdrop.hidden=false;trigger.setAttribute('aria-expanded','true');input.focus();}
function dismiss(){generation++;clearTimeout(timer);setBusy(false,'Type at least two characters. Business IDs also work.');backdrop.hidden=true;trigger.setAttribute('aria-expanded','false');results.textContent='';input.value='';selected=-1;if(returnFocus&&returnFocus.focus)returnFocus.focus();}
function render(items){selected=-1;results.innerHTML=(items||[]).map(function(item,index){return '<button class="atlas-command-result" type="button" role="option" aria-selected="false" data-index="'+index+'" data-href="'+escapeHtml(item.href)+'"><span class="atlas-command-type">'+escapeHtml(item.type)+'</span><span class="atlas-command-label">'+escapeHtml(item.label)+'</span><span class="atlas-command-secondary">'+escapeHtml([item.secondary,item.status].filter(Boolean).join(' · '))+'</span></button>';}).join('');Array.prototype.forEach.call(results.querySelectorAll('.atlas-command-result'),function(button){button.addEventListener('click',function(){location.assign(button.dataset.href);});});}
function move(delta){var options=results.querySelectorAll('.atlas-command-result');if(!options.length)return;selected=(selected+delta+options.length)%options.length;Array.prototype.forEach.call(options,function(option,index){option.setAttribute('aria-selected',String(index===selected));});options[selected].focus();}
function search(){var query=input.value.trim(),request=++generation;clearTimeout(timer);results.textContent='';if(query.length<2){setBusy(false,'Type at least two characters. Business IDs also work.');return;}setBusy(true,'Searching authorized Atlas records…');google.script.run.withSuccessHandler(function(response){if(request!==generation)return;setBusy(false,'');if(!response||response.ok!==true){status.className='atlas-command-status atlas-command-error';status.textContent=response&&response.error&&response.error.code==='AUTHORIZATION_ERROR'?'Your Atlas session or access changed. Sign in again or reopen this workspace.':'Search is temporarily unavailable. Check your connection and try again.';return;}var model=response.data||{},items=model.items||[];render(items);status.textContent=items.length?items.length+' result'+(items.length===1?'':'s')+'. Use arrow keys, then Enter.':'No matching authorized records. Try a name, business reference, or serial number.';}).withFailureHandler(function(){if(request!==generation)return;setBusy(false,'');status.className='atlas-command-status atlas-command-error';status.textContent='Search is temporarily unavailable. Check your connection and try again.';}).searchAtlasCommand(query,15);}
trigger.addEventListener('click',open);close.addEventListener('click',dismiss);backdrop.addEventListener('click',function(event){if(event.target===backdrop)dismiss();});input.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(search,250);});input.addEventListener('keydown',function(event){if(event.key==='ArrowDown'){event.preventDefault();move(1);}else if(event.key==='ArrowUp'){event.preventDefault();move(-1);}else if(event.key==='Enter'&&selected>=0){event.preventDefault();var options=results.querySelectorAll('.atlas-command-result');location.assign(options[selected].dataset.href);}});results.addEventListener('keydown',function(event){if(event.key==='ArrowDown'){event.preventDefault();move(1);}else if(event.key==='ArrowUp'){event.preventDefault();move(-1);}else if(event.key==='Enter'&&document.activeElement&&document.activeElement.dataset.href){location.assign(document.activeElement.dataset.href);}});document.addEventListener('keydown',function(event){if((event.ctrlKey||event.metaKey)&&String(event.key).toLowerCase()==='k'){event.preventDefault();backdrop.hidden?open():dismiss();}else if(event.key==='Escape'&&!backdrop.hidden){event.preventDefault();dismiss();}});
})();
</script>
