<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root{--ink:#15242b;--surface:#fff;--page:#edf1f2;--muted:#62727a;--line:#cad5d9;--accent:#d5761b;--accent-dark:#a95108;--good:#177747;--danger:#af2b2b;--warning:#a86900;--focus:#1676a0}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:17px/1.35 Arial,sans-serif}.shop{max-width:760px;margin:0 auto;padding:16px 16px 48px}.brand{font-size:12px;font-weight:700;letter-spacing:.12em;color:#53666f;margin:4px 0 18px}.brand b{color:var(--ink)}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0;box-shadow:0 2px 8px rgba(15,35,44,.06)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;color:#5a6c75;margin:0 0 5px}.job-id{font:700 28px/1 Consolas,monospace;margin:0 0 11px}.title{font-size:23px;font-weight:700;margin:0}.customer{color:#51636c;margin:4px 0 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:17px}.fact{border-left:4px solid #cbd6d9;padding:3px 0 3px 10px}.fact b{display:block;font-size:12px;color:#60717a;letter-spacing:.04em;text-transform:uppercase}.fact span{display:block;font-weight:700;margin-top:2px;overflow-wrap:anywhere}.status{border-left-color:var(--accent)}.status span{font-size:20px;color:#944904}.next{border-left-color:var(--focus)}.blocked{border-left-color:var(--danger)}.blocked span{color:var(--danger)}.actions h2,.timeline h2{font-size:18px;margin:0 0 12px}.primary-action{width:100%;min-height:68px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:20px;font-weight:700;cursor:pointer}.primary-action:hover{background:var(--accent-dark)}button{font:inherit}.secondary-actions,.transition-actions{display:grid;gap:10px;margin-top:10px}.secondary-actions{grid-template-columns:1fr 1fr}.touch-button{min-height:58px;padding:10px;border:2px solid #8d9ca2;border-radius:8px;background:#fff;color:#26363d;font-weight:700;cursor:pointer}.touch-button.problem{border-color:var(--danger);color:var(--danger)}.touch-button.blocked{border-color:var(--warning);color:#845700}.transition-actions{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.transition{min-height:52px}.touch-button:hover{background:#edf3f4}.primary-action:focus-visible,.touch-button:focus-visible,.reason:focus-visible,.close:focus-visible,textarea:focus-visible{outline:4px solid var(--focus);outline-offset:2px}button[disabled]{opacity:.55;cursor:wait}.hint{color:var(--muted);font-size:14px;margin:7px 0 0}.problem-panel{border:2px solid #e1b2ae;background:#fff9f8}.problem-panel[hidden],.loading[hidden],.empty[hidden]{display:none}.problem-panel h2{margin:0 0 6px;font-size:20px}.reason-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:15px 0}.reason{min-height:49px;padding:8px;border:1px solid #a9b7bc;border-radius:7px;background:#fff;font-weight:700;cursor:pointer}.reason.selected{background:#4a1818;border-color:#4a1818;color:#fff}.problem-panel label{display:block;font-weight:700;font-size:14px;margin-top:12px}.problem-panel textarea{width:100%;min-height:78px;padding:10px;font:inherit;border:1px solid #a8b6ba;border-radius:7px;margin-top:5px;resize:vertical}.panel-actions{display:flex;gap:10px;margin-top:14px}.panel-actions button{min-height:54px;flex:1}.report{background:var(--danger);border:0;color:white;border-radius:7px;font-weight:700}.cancel{background:#fff;border:1px solid #8e9da3;border-radius:7px;font-weight:700}.event{position:relative;padding:0 0 18px 22px;border-left:3px solid #c9d5d9;margin-left:8px}.event:last-child{border-left-color:transparent;padding-bottom:0}.event:before{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:var(--accent);left:-7px;top:4px}.event-time{font-size:13px;color:#5e7079}.event b{display:block;margin:2px 0}.event p{margin:3px 0 0;color:#41545d;white-space:pre-wrap;overflow-wrap:anywhere}.loading,.empty{padding:48px 15px;text-align:center;color:var(--muted)}.spinner{display:inline-block;width:22px;height:22px;border:4px solid #c3d0d4;border-top-color:var(--accent);border-radius:50%;vertical-align:-5px;margin-right:8px;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.message{position:fixed;left:16px;right:16px;bottom:16px;max-width:728px;margin:auto;padding:13px 15px;border-radius:8px;color:#fff;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.22);z-index:5}.message.success{background:var(--good)}.message.error{background:var(--danger)}.message.info{background:#255e75}.message[hidden]{display:none}@media(max-width:420px){.shop{padding:12px}.facts{grid-template-columns:1fr}.secondary-actions{grid-template-columns:1fr}.reason-grid{grid-template-columns:1fr}.job-id{font-size:24px}}
  </style>
</head>
<body>
  <main class="shop" aria-live="polite">
    <p class="brand"><b>VMOS</b> / SHOP FLOOR</p>
    <section id="loading" class="card loading"><span class="spinner"></span>Loading job…</section>
    <section id="empty" class="card empty" hidden><h1>Scan a job QR code</h1><p>Use the QR code on the traveler or bin to open the current shop work.</p></section>
    <section id="job-view" hidden></section>
  </main>
  <div id="message" class="message" role="status" hidden></div>

  <script>
    /* Client-only shop-floor view. All data and commands travel through the
       Apps Script service endpoints; this template never accesses Sheets. */
    var shopState={job:null,events:[],busy:{},selectedReason:null};
    var problemReasons=['TOOL_FAILURE','MACHINE_ALARM','QUALITY','MATERIAL','PROGRAM','FIXTURE','WAITING_CUSTOMER','OTHER'];

    function escapeHtml(value){return String(value===undefined||value===null?'':value).replace(/[&<>"']/g,function(character){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];});}
    function display(value,fallback){return value===undefined||value===null||value===''?(fallback||'—'):String(value).replace(/_/g,' ');}
    function humanDate(value){if(!value)return '—';var date=new Date(value);return isNaN(date.getTime())?String(value):date.toLocaleString();}
    function money(value){if(value===undefined||value===null||value==='')return 'Not available';var amount=Number(value);return isNaN(amount)?String(value):amount.toLocaleString(undefined,{style:'currency',currency:'USD'});}
    function commandId(){if(window.crypto&&window.crypto.randomUUID)return window.crypto.randomUUID();return 'shop-'+Date.now()+'-'+Math.random().toString(36).slice(2);}
    function payload(result){if(result&&result.ok===false)throw new Error((result.error&&result.error.message)||'The request could not be completed.');return result&&Object.prototype.hasOwnProperty.call(result,'data')?result.data:result;}
    function showMessage(kind,text){var element=document.getElementById('message');element.className='message '+kind;element.textContent=text;element.hidden=false;clearTimeout(showMessage.timer);showMessage.timer=setTimeout(function(){element.hidden=true;},5000);}
    function setBusy(key,isBusy){shopState.busy[key]=isBusy;render();}
    function isBusy(key){return !!shopState.busy[key];}
    function isPending(key){return isBusy(key);}
    function currentStatus(job){return job.status||job.currentStatus||'UNKNOWN';}
    function allowedTransitions(job){var values=job.allowedTransitions||(job.workflow&&job.workflow.allowedTransitions)||job.transitions||[];return Array.isArray(values)?values:[];}
    function eventList(data){if(Array.isArray(data))return data;return data&&data.events||[];}
    function jobFrom(data){return data&&data.job?data.job:data;}
    function problemReasonLabel(reason){return {TOOL_FAILURE:'TOOL FAILURE',MACHINE_ALARM:'MACHINE ALARM',QUALITY:'QUALITY ISSUE',MATERIAL:'MATERIAL ISSUE',PROGRAM:'PROGRAM ISSUE',FIXTURE:'FIXTURE ISSUE',WAITING_CUSTOMER:'WAITING ON CUSTOMER',OTHER:'OTHER'}[reason]||display(reason);}

    function render(){
      var view=document.getElementById('job-view'),loading=document.getElementById('loading'),empty=document.getElementById('empty');
      loading.hidden=!!shopState.job;empty.hidden=!!shopState.job;if(!shopState.job){view.hidden=true;return;}
      loading.hidden=true;view.hidden=false;var job=shopState.job,blocked=Boolean(job.blocked)||String(currentStatus(job)).toUpperCase()==='BLOCKED';
      var transitions=allowedTransitions(job);var running=transitions.filter(function(status){return String(status).toUpperCase()==='RUNNING';})[0];var primary=running||transitions[0];
      view.innerHTML='<section class="card"><p class="eyebrow">CURRENT JOB</p><h1 class="job-id">'+escapeHtml(display(job.id||job.jobId))+'</h1><p class="title">'+escapeHtml(display(job.partDescription||job.partName||job.partId||job.description,'Work description unavailable'))+'</p><p class="customer">'+escapeHtml(display(job.customerName||job.customerId,'Customer unavailable'))+'</p><div class="facts"><div class="fact status"><b>Status</b><span>'+escapeHtml(display(currentStatus(job)))+'</span></div><div class="fact next"><b>Next action</b><span>'+escapeHtml(display(job.nextAction||job.nextRequiredAction,'Check workflow'))+'</span></div><div class="fact"><b>Due</b><span>'+escapeHtml(display(job.dueDate&&humanDate(job.dueDate)))+'</span></div><div class="fact"><b>Operator</b><span>'+escapeHtml(display(job.operator||job.responsibleOperator))+'</span></div>'+((job.openOrderValue!==undefined||job.openValue!==undefined)?'<div class="fact"><b>Open order value</b><span>'+escapeHtml(money(job.openOrderValue!==undefined?job.openOrderValue:job.openValue))+'</span></div>':'')+(blocked?'<div class="fact blocked"><b>Work state</b><span>BLOCKED</span></div>':'')+'</div></section>'+actionCard(job,primary,transitions,blocked)+problemPanel(blocked)+timelineCard();
    }
    function actionCard(job,primary,transitions,blocked){
      var jobId=escapeHtml(job.id||job.jobId),running=transitions.filter(function(status){return String(status).toUpperCase()==='RUNNING';})[0],completion=transitions.filter(function(status){return status!==primary&&status!==running;})[0],transitionButtons=transitions.filter(function(status){return status!==running&&status!==completion&&status!==primary;}).map(function(status){return '<button class="touch-button transition" onclick="sendTransition(\''+jobId+'\',\''+escapeHtml(status)+'\')" '+(isBusy('transition')?'disabled':'')+'>'+escapeHtml(display(status))+'</button>';}).join('');
      return '<section class="card actions"><h2>Production actions</h2>'+(running?'<button class="primary-action" onclick="sendTransition(\''+jobId+'\',\''+escapeHtml(running)+'\')" '+(isBusy('transition')?'disabled':'')+'>START WORK</button>':(primary?'<button class="primary-action" onclick="sendTransition(\''+jobId+'\',\''+escapeHtml(primary)+'\')" '+(isBusy('transition')?'disabled':'')+'>'+escapeHtml(display(primary))+'</button>':'<p class="hint">No permitted status transition is available for this job.</p>'))+'<div class="secondary-actions"><button class="touch-button" onclick="'+(completion?'sendTransition(\''+jobId+'\',\''+escapeHtml(completion)+'\')':'void(0)')+'" '+(!completion||isBusy('transition')?'disabled':'')+'>COMPLETE STEP</button>'+(blocked?'<button class="touch-button blocked" onclick="openResolveBlock()" '+(isBusy('resolve')?'disabled':'')+'>RESOLVE BLOCK</button>':'<button class="touch-button blocked" onclick="openProblem()">BLOCKED</button>')+'<button class="touch-button problem" onclick="openProblem()">STOP / PROBLEM</button></div>'+(transitionButtons?'<div class="transition-actions">'+transitionButtons+'</div>':'')+'<p class="hint">Actions are recorded in the job history.</p></section>';
    }
    function problemPanel(blocked){return '<section id="problem-panel" class="card problem-panel" hidden><button class="close touch-button" style="float:right;min-height:40px" onclick="closeProblem()">Close</button><h2>'+ (blocked?'Report another problem':'Stop / report a problem') +'</h2><p class="hint">This records the exception and may place the job in BLOCKED status.</p><div class="reason-grid">'+problemReasons.map(function(reason){return '<button class="reason '+(shopState.selectedReason===reason?'selected':'')+'" onclick="selectReason(\''+reason+'\')">'+escapeHtml(problemReasonLabel(reason))+'</button>';}).join('')+'</div><label for="problem-note">What happened? <span class="hint">Optional</span></label><textarea id="problem-note" placeholder="Short note or what needs to happen next"></textarea><div class="panel-actions"><button class="cancel" onclick="closeProblem()">Cancel</button><button class="report" onclick="submitProblem()" '+(!shopState.selectedReason||isBusy('problem')?'disabled':'')+'>'+ (isBusy('problem')?'Reporting…':'Report problem') +'</button></div></section>';}
    function timelineCard(){var events=shopState.events||[];return '<section class="card timeline"><h2>JOB HISTORY</h2>'+(events.length?events.map(function(event){return '<article class="event"><span class="event-time">'+escapeHtml(humanDate(event.occurredAt||event.timestamp||event.createdAt||event.eventAt))+' · '+escapeHtml(display(event.actor||event.user||event.operator||event.createdBy,'VMOS'))+'</span><b>'+escapeHtml(display(event.eventType||event.type||event.title,'Job update'))+'</b><p>'+escapeHtml(event.notes||event.note||event.description||((event.previousStatus||event.newStatus)?display(event.previousStatus)+' → '+display(event.newStatus):''))+'</p></article>';}).join(''):'<p class="hint">No recorded production events yet.</p>')+'</section>';}

    function openProblem(){var panel=document.getElementById('problem-panel');if(panel){panel.hidden=false;panel.scrollIntoView({block:'nearest'});}}
    function closeProblem(){shopState.selectedReason=null;render();}
    function selectReason(reason){shopState.selectedReason=reason;var panel=document.getElementById('problem-panel');if(panel)panel.hidden=false;render();var reopened=document.getElementById('problem-panel');if(reopened)reopened.hidden=false;}
    function refreshJob(jobId,notice){
      google.script.run.withSuccessHandler(function(result){try{shopState.job=jobFrom(payload(result));loadEvents(jobId,notice);}catch(error){showMessage('error',error.message);}}).withFailureHandler(function(error){showMessage('error','Could not refresh the job: '+(error&&error.message||error));}).getShopFloorJob(jobId);
    }
    function loadEvents(jobId,notice){
      google.script.run.withSuccessHandler(function(result){try{shopState.events=eventList(payload(result));render();if(notice)showMessage('success',notice);}catch(error){render();showMessage('error',error.message);}}).withFailureHandler(function(error){render();showMessage('error','The job changed, but history could not be loaded: '+(error&&error.message||error));}).listJobEvents(jobId);
    }
    function sendTransition(jobId,targetStatus){if(isBusy('transition'))return;setBusy('transition',true);google.script.run.withSuccessHandler(function(result){setBusy('transition',false);try{var data=payload(result);shopState.job=jobFrom(data)||shopState.job;loadEvents(jobId,'Status updated to '+display(targetStatus)+'.');}catch(error){showMessage('error',error.message);}}).withFailureHandler(function(error){setBusy('transition',false);showMessage('error','Status was not updated: '+(error&&error.message||error));}).transitionShopFloorJob(jobId,targetStatus,commandId(),'');}
    function submitProblem(){if(!shopState.job||!shopState.selectedReason||isBusy('problem'))return;var note=document.getElementById('problem-note');var data={reason:shopState.selectedReason,notes:note?note.value:''};setBusy('problem',true);google.script.run.withSuccessHandler(function(result){setBusy('problem',false);try{shopState.job=jobFrom(payload(result))||shopState.job;shopState.selectedReason=null;loadEvents(shopState.job.id||shopState.job.jobId,'Problem reported.');}catch(error){showMessage('error',error.message);}}).withFailureHandler(function(error){setBusy('problem',false);showMessage('error','Problem was not reported: '+(error&&error.message||error));}).reportJobProblem(shopState.job.id||shopState.job.jobId,data,commandId());}
    function openResolveBlock(){var choices=(shopState.job.workflowStates||[]).join(', ');var target=window.prompt('Next production status ('+choices+'):', '');if(target===null||!target||!shopState.job||isBusy('resolve'))return;var note=window.prompt('Resolution note (optional):','');if(note===null)return;setBusy('resolve',true);var data={notes:note,nextStatus:target};google.script.run.withSuccessHandler(function(result){setBusy('resolve',false);try{shopState.job=jobFrom(payload(result))||shopState.job;loadEvents(shopState.job.id||shopState.job.jobId,'Block resolved.');}catch(error){showMessage('error',error.message);}}).withFailureHandler(function(error){setBusy('resolve',false);showMessage('error','Block was not resolved: '+(error&&error.message||error));}).resolveJobBlock(shopState.job.id||shopState.job.jobId,data,commandId());}
    function resolveQr(token){google.script.run.withSuccessHandler(function(result){try{var data=payload(result);shopState.job=jobFrom(data);if(!shopState.job)throw new Error('No job was found for this QR code.');loadEvents(shopState.job.id||shopState.job.jobId);}catch(error){document.getElementById('loading').hidden=true;document.getElementById('empty').hidden=false;showMessage('error',error.message);}}).withFailureHandler(function(error){document.getElementById('loading').hidden=true;document.getElementById('empty').hidden=false;showMessage('error','Could not resolve the QR code: '+(error&&error.message||error));}).resolveShopJobByQr(token);}
    function start(){var fallback=new URLSearchParams(window.location.search).get('qr');if(google.script.url&&google.script.url.getLocation){google.script.url.getLocation(function(location){var token=location&&location.parameter&&location.parameter.qr||fallback;if(token)resolveQr(token);else{document.getElementById('loading').hidden=true;document.getElementById('empty').hidden=false;}});}else if(fallback){resolveQr(fallback);}else{document.getElementById('loading').hidden=true;document.getElementById('empty').hidden=false;}}
    start();
  </script>
</body>
</html>
