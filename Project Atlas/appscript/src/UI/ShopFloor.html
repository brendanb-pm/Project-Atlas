<!DOCTYPE html>
<html><head><base target="_top"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--shop-ink:#17262d;--shop-page:#eef2f3;--shop-panel:#fff;--shop-muted:#5b6d76;--shop-line:#cbd6da;--shop-accent:#c96812;--shop-danger:#a62a2a;--shop-warn:#8b5d00;--shop-good:#176b43;--shop-focus:#1676a0}*{box-sizing:border-box}body{margin:0;background:var(--shop-page);color:var(--shop-ink);font:17px/1.4 Arial,sans-serif}.shop{max-width:1180px;margin:auto;padding:18px 22px 52px}.shop-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:5px 0 16px}.eyebrow{margin:0 0 4px;color:#596c75;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.shop-head h1{font-size:29px;margin:0}.shop-head p{margin:4px 0 0;color:var(--shop-muted)}.operator{min-width:250px;border:1px solid var(--shop-line);border-radius:8px;background:#fff;padding:11px 14px}.operator b,.fact b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--shop-muted)}.operator strong{display:block;margin-top:2px}.operator--missing{border-left:5px solid var(--shop-warn)}.operator-note{font-size:12px;color:var(--shop-muted)}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:18px;align-items:start}.stack{display:grid;gap:16px}.card{background:var(--shop-panel);border:1px solid var(--shop-line);border-radius:10px;box-shadow:0 2px 8px rgba(17,34,43,.06);overflow:hidden}.card-body{padding:18px}.job-id{font:800 30px/1.1 Consolas,monospace;margin:0}.work-title{font-size:23px;margin:9px 0 2px}.customer{margin:0;color:var(--shop-muted)}.status-line{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:17px}.status-badge{border-radius:999px;padding:5px 10px;background:#e4edf1;font-weight:800}.status-badge--blocked{background:#f7dddd;color:#831d1d}.status-text{font-weight:800;font-size:19px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.fact{min-width:0;border-left:4px solid #becbd0;padding:3px 0 3px 10px}.fact span{display:block;font-weight:700;margin-top:3px;overflow-wrap:anywhere}.block-banner{border:2px solid #d7958f;background:#fff7f6;border-radius:10px;padding:16px}.block-banner h2{margin:0;color:#831d1d;font-size:21px}.block-banner p{margin:6px 0 0}.block-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.block-details div{background:#fff;border:1px solid #e6c5c1;border-radius:6px;padding:9px}.block-details b{display:block;font-size:11px;text-transform:uppercase;color:#765653}.panel-head{padding:15px 18px;border-bottom:1px solid var(--shop-line)}.panel-head h2{font-size:20px;margin:0}.panel-head p{margin:3px 0 0;color:var(--shop-muted);font-size:14px}.actions-body{padding:16px}.primary-action,.touch-action{width:100%;border-radius:8px;font:800 17px Arial;cursor:pointer}.primary-action{min-height:68px;border:0;background:var(--shop-accent);color:#fff;font-size:21px}.touch-action{min-height:56px;border:2px solid #83969e;background:#fff;color:var(--shop-ink);padding:9px 12px}.touch-action--problem{border-color:var(--shop-danger);color:var(--shop-danger)}.touch-action--resolve{border-color:var(--shop-good);color:var(--shop-good)}.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.primary-action:focus-visible,.touch-action:focus-visible,.choice:focus-visible,textarea:focus-visible,select:focus-visible{outline:4px solid var(--shop-focus);outline-offset:2px}button[disabled]{opacity:.55;cursor:wait}.progress{margin:10px 0 0;color:var(--shop-muted);font-weight:700}.form-panel{border-top:1px solid var(--shop-line);padding:17px;background:#fafcfc}.form-panel h3{margin:0;font-size:19px}.form-panel p{margin:4px 0 12px;color:var(--shop-muted)}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{min-height:50px;border:1px solid #99aab0;background:#fff;border-radius:7px;padding:7px;font-weight:800;cursor:pointer}.choice.selected{background:#40302d;color:#fff;border-color:#40302d}.field-label{display:block;font-weight:800;margin:13px 0 5px}.form-panel textarea,.form-panel select{width:100%;min-height:48px;border:1px solid #97a9b0;border-radius:7px;padding:10px;font:inherit;background:#fff}.form-panel textarea{min-height:92px;resize:vertical}.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.timeline-list{padding:4px 18px 18px}.event{position:relative;padding:13px 0 13px 20px;border-left:3px solid #c5d2d7;margin-left:6px}.event:last-child{border-left-color:transparent}.event:before{content:'';position:absolute;left:-7px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--shop-accent)}.event time{display:block;color:var(--shop-muted);font-size:12px}.event strong{display:block;margin:2px 0}.event p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.timeline-more{margin:0 18px 18px;color:var(--shop-muted);font-size:13px}.state-card{padding:48px 20px;text-align:center}.state-card h1{margin-top:0}.spinner{display:inline-block;width:23px;height:23px;border:4px solid #c3d0d4;border-top-color:var(--shop-accent);border-radius:50%;vertical-align:-6px;margin-right:8px;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.message{position:fixed;left:16px;right:16px;bottom:16px;max-width:760px;margin:auto;padding:14px 16px;border-radius:8px;color:#fff;font-weight:800;box-shadow:0 5px 20px rgba(0,0,0,.24);z-index:40}.message.success{background:var(--shop-good)}.message.error{background:var(--shop-danger)}.message.info{background:#245f78}.message[hidden]{display:none}@media(max-width:900px){.shop{padding:16px}.layout{grid-template-columns:1fr}.timeline{order:2}.shop-head{align-items:stretch}.operator{min-width:230px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.shop{padding:12px}.shop-head{display:grid}.operator{min-width:0}.job-id{font-size:25px}.work-title{font-size:20px}.facts,.block-details,.action-grid,.choice-grid,.form-actions{grid-template-columns:1fr}.primary-action{min-height:64px}.touch-action{min-height:56px}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
@media(max-width:600px){.facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
</style><?!= includeAtlasUi_('UI/AtlasDesignSystem') ?></head>
<body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="shop" id="shop" aria-live="polite"><section class="card state-card" id="loading"><span class="spinner"></span>Loading current work…</section><section class="card state-card" id="empty" hidden><h1>Scan a Job QR code</h1><p>The QR on the traveler opens current Atlas work. Scanning does not start or change the Job.</p></section><section id="workspace" hidden></section></main><div id="message" class="message" role="status" aria-live="assertive" hidden></div>
<script>
var shopState={model:null,token:'',busy:'',problemOpen:false,resolveOpen:false,problemDraft:{reason:'',notes:''},resolveDraft:{nextStatus:'',notes:''}};
var problemReasons=['TOOL_FAILURE','MACHINE_ALARM','QUALITY','MATERIAL','PROGRAM','FIXTURE','WAITING_CUSTOMER','OTHER'];
function esc(value){return String(value===undefined||value===null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function text(value,fallback){return value===undefined||value===null||value===''?(fallback||'Not provided'):String(value);}
function statusLabel(value){var key=String(value||'').toUpperCase(),known={PLANNED:'Planned',QUEUED:'Ready',PROGRAMMING:'Programming',SETUP:'Setup',RUNNING:'In Process',INSPECTION:'Inspection',SECONDARY_OP:'Secondary Operation',BLOCKED:'Blocked',COMPLETE:'Complete',PROBLEM_REPORTED:'Problem Reported'};return known[key]||key.toLowerCase().replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});}
function eventLabel(value){return {STATUS_CHANGED:'Status changed',STOP_PROBLEM:'Problem reported',BLOCK_RESOLVED:'Block resolved',WORKFLOW_ASSIGNED:'Workflow assigned',QR_ASSIGNED:'Traveler QR assigned',QR_ROTATED:'Traveler QR replaced',QR_REVOKED:'Traveler QR retired'}[value]||statusLabel(value||'Job update');}
function reasonLabel(value){return {TOOL_FAILURE:'Tool failure',MACHINE_ALARM:'Machine alarm',QUALITY:'Quality issue',MATERIAL:'Material issue',PROGRAM:'Program issue',FIXTURE:'Fixture issue',WAITING_CUSTOMER:'Waiting on customer',OTHER:'Other'}[value]||statusLabel(value);}
function dateTime(value){var date=new Date(value);return value&&!isNaN(date.getTime())?date.toLocaleString():text(value,'Time unavailable');}
function commandId(){return window.crypto&&window.crypto.randomUUID?window.crypto.randomUUID():'shop-'+Date.now()+'-'+Math.random().toString(36).slice(2);}
function unpack(result){if(result&&result.ok===false)throw {message:result.error&&result.error.message||'The request could not be completed.',refreshRequired:result.refreshRequired===true};return result&&Object.prototype.hasOwnProperty.call(result,'data')?result.data:result;}
function notify(kind,message){var node=document.getElementById('message');node.className='message '+kind;node.textContent=message;node.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(function(){node.hidden=true;},6000);}
function setBusy(value){shopState.busy=value||'';render();}
function primaryLabel(status){var key=String(status||'').toUpperCase();return key==='RUNNING'?'Start work':key==='COMPLETE'?'Complete operation':key==='STOPPED'||key==='PAUSED'?'Stop work':'Move to '+statusLabel(key);}
function render(){var host=document.getElementById('workspace'),loading=document.getElementById('loading'),empty=document.getElementById('empty');if(!shopState.model){host.hidden=true;return;}loading.hidden=true;empty.hidden=true;host.hidden=false;var model=shopState.model,job=model.job,actions=model.actions||{},blocked=Boolean(model.block),operator=model.operator||{},assignment=model.assignment||{};host.innerHTML='<header class="shop-head"><div><p class="eyebrow">Shop Floor / Current Work</p><h1>Job '+esc(job.id)+'</h1><p>Use the next valid action. Atlas records the authenticated operator separately from Job assignment.</p></div><div class="operator '+(operator.authoritative&&operator.available?'':'operator--missing')+'"><b>Current operator</b><strong>'+esc(operator.authoritative&&operator.available?operator.label:'Identity confirmation unavailable')+'</strong><span class="operator-note">'+(operator.authoritative&&operator.available?'Authenticated Atlas operator':'Do not perform consequential work until operator identity is validated.')+'</span></div></header><div class="layout"><div class="stack">'+jobCard(job,assignment)+(blocked?blockCard(model.block):'')+actionCard(actions,job)+problemPanel()+resolvePanel(actions)+'</div>'+timelineCard(model.recentEvents||[],model.hasMoreEvents)+'</div>';}
function jobCard(job,assignment){return '<section class="card"><div class="card-body"><p class="eyebrow">Job / Work Order</p><h2 class="job-id">'+esc(job.id)+'</h2><h3 class="work-title">'+esc(text(job.partDescription||job.partName||job.partId,'Work description unavailable'))+'</h3><p class="customer">'+esc(text(job.customerName,'Customer unavailable'))+'</p><div class="status-line"><span class="status-badge '+(String(job.status).toUpperCase()==='BLOCKED'?'status-badge--blocked':'')+'">'+esc(statusLabel(job.status))+'</span><span class="status-text">Next: '+esc(job.nextAction||'Review current work')+'</span></div><div class="facts"><div class="fact"><b>Workflow</b><span>'+esc(text(job.workflowLabel,'Standard workflow'))+'</span></div><div class="fact"><b>Machine</b><span>'+esc(text(job.machine))+'</span></div><div class="fact"><b>Program</b><span>'+esc(text(job.program))+'</span></div><div class="fact"><b>Due</b><span>'+esc(job.dueDate?dateTime(job.dueDate):'Not scheduled')+'</span></div><div class="fact"><b>Assigned operator</b><span>'+esc(text(assignment.label,'Team work'))+(assignment.isCurrentOperator?' (you)':'')+'</span></div><div class="fact"><b>Quantity</b><span>'+esc(text(job.quantity))+'</span></div></div></div></section>';}
function blockCard(block){return '<section class="block-banner" role="status" aria-labelledby="blocked-title"><h2 id="blocked-title">Work is blocked</h2><p>'+esc(block.notes||'This Job cannot proceed normally until the problem is resolved.')+'</p><div class="block-details"><div><b>Problem</b>'+esc(reasonLabel(block.reason||'OTHER'))+'</div><div><b>Needed next</b>'+esc(text(block.nextAction,'Review and resolve the block'))+'</div>'+(block.responsibleParty?'<div><b>Responsible</b>'+esc(block.responsibleParty)+'</div>':'')+'</div></section>';}
function actionCard(actions,job){if(!actions.canOperate)return '<section class="card"><div class="panel-head"><h2>Next action</h2><p>You can view this Job, but shop-floor operation permission is required to change it.</p></div></section>';var primary=actions.primaryStatus?'<button class="primary-action" onclick="sendTransition(\''+esc(actions.primaryStatus)+'\')" '+(shopState.busy?'disabled':'')+'>'+esc(primaryLabel(actions.primaryStatus))+'</button>':'<p class="progress">No workflow transition is currently available.</p>';return '<section class="card"><div class="panel-head"><h2>Next action</h2><p>Only actions valid for the current authoritative state are shown.</p></div><div class="actions-body">'+primary+'<div class="action-grid">'+(actions.canReportProblem?'<button class="touch-action touch-action--problem" onclick="toggleProblem()" '+(shopState.busy?'disabled':'')+'>Report problem</button>':'')+(actions.canResolveBlock?'<button class="touch-action touch-action--resolve" onclick="toggleResolve()" '+(shopState.busy?'disabled':'')+'>Resolve block</button>':'')+'</div>'+(shopState.busy?'<p class="progress" role="status">Saving and confirming current Job state…</p>':'')+'</div></section>';}
function problemPanel(){if(!shopState.problemOpen)return '';return '<section class="card form-panel" aria-labelledby="problem-title"><h3 id="problem-title">Report a problem</h3><p>Choose the closest reason. A short note is optional and will be preserved if confirmation fails.</p><div class="choice-grid">'+problemReasons.map(function(reason){return '<button class="choice '+(shopState.problemDraft.reason===reason?'selected':'')+'" onclick="chooseProblem(\''+reason+'\')" aria-pressed="'+(shopState.problemDraft.reason===reason)+'">'+esc(reasonLabel(reason))+'</button>';}).join('')+'</div><label class="field-label" for="problem-notes">What happened or what is needed next?</label><textarea id="problem-notes" oninput="shopState.problemDraft.notes=this.value" placeholder="Short operator note">'+esc(shopState.problemDraft.notes)+'</textarea><div class="form-actions"><button class="touch-action" onclick="toggleProblem()">Cancel</button><button class="touch-action touch-action--problem" onclick="submitProblem()" '+(!shopState.problemDraft.reason||shopState.busy?'disabled':'')+'>'+(shopState.busy==='problem'?'Reporting…':'Report problem')+'</button></div></section>';}
function resolvePanel(actions){if(!shopState.resolveOpen)return '';return '<section class="card form-panel" aria-labelledby="resolve-title"><h3 id="resolve-title">Resolve block</h3><p>Confirm the valid production state Atlas should return to.</p><label class="field-label" for="resume-status">Resume at</label><select id="resume-status" onchange="shopState.resolveDraft.nextStatus=this.value"><option value="">Select production state</option>'+(actions.resolutionStatuses||[]).map(function(status){return '<option value="'+esc(status)+'" '+(shopState.resolveDraft.nextStatus===status?'selected':'')+'>'+esc(statusLabel(status))+'</option>';}).join('')+'</select><label class="field-label" for="resolution-notes">Resolution note</label><textarea id="resolution-notes" oninput="shopState.resolveDraft.notes=this.value" placeholder="What changed or was corrected?">'+esc(shopState.resolveDraft.notes)+'</textarea><div class="form-actions"><button class="touch-action" onclick="toggleResolve()">Cancel</button><button class="touch-action touch-action--resolve" onclick="submitResolution()" '+(!shopState.resolveDraft.nextStatus||shopState.busy?'disabled':'')+'>'+(shopState.busy==='resolve'?'Confirming…':'Resume work')+'</button></div></section>';}
function timelineCard(events,hasMore){return '<section class="card timeline"><div class="panel-head"><h2>Recent Job history</h2><p>Status, problem, and resolution events. Atlas remains authoritative over the printed traveler.</p></div><div class="timeline-list">'+(events.length?events.map(function(event){var detail=event.notes||event.problemType&&reasonLabel(event.problemType)||(event.previousStatus||event.newStatus?statusLabel(event.previousStatus)+' → '+statusLabel(event.newStatus):'');return '<article class="event"><time>'+esc(dateTime(event.occurredAt))+' · '+esc(text(event.actor,'Atlas system'))+'</time><strong>'+esc(eventLabel(event.eventType))+'</strong>'+(detail?'<p>'+esc(detail)+'</p>':'')+'</article>';}).join(''):'<p>No production events have been recorded.</p>')+'</div>'+(hasMore?'<p class="timeline-more">Showing the 12 most recent events. Additional history remains available in Atlas.</p>':'')+'</section>';}
function toggleProblem(){shopState.problemOpen=!shopState.problemOpen;shopState.resolveOpen=false;render();}
function chooseProblem(reason){shopState.problemDraft.reason=reason;render();}
function toggleResolve(){shopState.resolveOpen=!shopState.resolveOpen;shopState.problemOpen=false;render();}
function refreshWorkspace(notice){if(!shopState.token)return;google.script.run.withSuccessHandler(function(result){try{shopState.model=unpack(result);render();if(notice)notify('success',notice);}catch(error){render();notify('error',error.message);}}).withFailureHandler(function(){render();notify('error','Current Job state could not be confirmed. Refresh before taking another action.');}).getShopFloorWorkspace(shopState.token);}
function afterMutation(result,notice,onConfirmed){try{unpack(result);if(onConfirmed)onConfirmed();setBusy('');shopState.problemOpen=false;shopState.resolveOpen=false;refreshWorkspace(notice);}catch(error){setBusy('');notify('error',error.message+(error.refreshRequired?' Refresh current Job state before retrying.':''));}}
function sendTransition(status){if(shopState.busy||!shopState.model)return;setBusy('transition');google.script.run.withSuccessHandler(function(result){afterMutation(result,'Job status updated.');}).withFailureHandler(function(){setBusy('');notify('error','The result could not be confirmed. Refresh current Job state before retrying.');}).transitionShopFloorJob(shopState.model.job.id,status,commandId(),'',shopState.token);}
function submitProblem(){if(shopState.busy||!shopState.problemDraft.reason)return;var data={reason:shopState.problemDraft.reason,notes:shopState.problemDraft.notes};setBusy('problem');google.script.run.withSuccessHandler(function(result){afterMutation(result,'Problem reported and current Job state confirmed.',function(){shopState.problemDraft={reason:'',notes:''};});}).withFailureHandler(function(){setBusy('');notify('error','The problem result could not be confirmed. Your note is preserved; refresh before retrying.');}).reportJobProblem(shopState.model.job.id,data,commandId(),shopState.token);}
function submitResolution(){if(shopState.busy||!shopState.resolveDraft.nextStatus)return;var data={nextStatus:shopState.resolveDraft.nextStatus,notes:shopState.resolveDraft.notes};setBusy('resolve');google.script.run.withSuccessHandler(function(result){afterMutation(result,'Block resolution confirmed.',function(){shopState.resolveDraft={nextStatus:'',notes:''};});}).withFailureHandler(function(){setBusy('');notify('error','The resolution result could not be confirmed. Your note is preserved; refresh before retrying.');}).resolveJobBlock(shopState.model.job.id,data,commandId(),shopState.token);}
function resolveQr(token){shopState.token=token;google.script.run.withSuccessHandler(function(result){try{shopState.model=unpack(result);render();}catch(error){document.getElementById('loading').hidden=true;document.getElementById('empty').hidden=false;notify('error',error.message);}}).withFailureHandler(function(){document.getElementById('loading').hidden=true;document.getElementById('empty').hidden=false;notify('error','This QR code is invalid, unavailable, or cannot be opened right now.');}).getShopFloorWorkspace(token);}
function start(){var fallback=new URLSearchParams(window.location.search).get('qr');if(google.script.url&&google.script.url.getLocation){google.script.url.getLocation(function(location){var token=location&&location.parameter&&location.parameter.qr||fallback;if(token)resolveQr(token);else{document.getElementById('loading').hidden=true;document.getElementById('empty').hidden=false;}});}else if(fallback)resolveQr(fallback);else{document.getElementById('loading').hidden=true;document.getElementById('empty').hidden=false;}}
start();
</script></body></html>
