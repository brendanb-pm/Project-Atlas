<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<?!= includeAtlasUi_('UI/AtlasDesignSystem') ?>
<style>.layout{display:grid;grid-template-columns:minmax(260px,.7fr) minmax(0,1.4fr);gap:16px}.list{display:grid;gap:8px}.request{width:100%;text-align:left;min-height:58px;padding:10px;border:1px solid var(--atlas-border);background:#fff;border-radius:6px}.request[aria-current=true]{border:3px solid var(--atlas-accent)}.actions{display:flex;gap:8px;flex-wrap:wrap}.form label{display:grid;gap:5px;margin:10px 0;font-weight:700}.form input,.form select,.form textarea{min-height:44px;padding:8px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.facts div{padding:10px;background:var(--atlas-surface-muted,#f3f6f7)}.picker{position:relative}.picker-results{display:grid;gap:3px;border:1px solid var(--atlas-border);padding:5px}.picker-results button{min-height:44px;text-align:left;background:#fff;border:0;padding:7px}.picker-results button:focus-visible,.picker-results button:hover{outline:3px solid var(--atlas-focus,#287c9a)}@media(max-width:800px){.layout{grid-template-columns:1fr}}@media(max-width:480px){.facts{grid-template-columns:1fr}.actions .atlas-button{width:100%}}</style></head>
<body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="atlas-page">
<header class="atlas-page-header"><div><h1>Purchasing</h1><p>Request purchases, review approvals, and record receipt evidence without editing the workbook.</p></div><button class="atlas-button" id="new" type="button">New request</button></header>
<div id="notice" class="atlas-notice" role="status" hidden></div><section class="layout"><aside class="atlas-panel atlas-surface"><label class="atlas-field">Search requests<input id="search" class="atlas-input" type="search"></label><div id="list" class="list"></div></aside><section id="detail" class="atlas-panel atlas-surface" aria-live="polite">Loading purchasing…</section></section></main>
<script>
var purchaseParams=new URLSearchParams(location.search),selected=purchaseParams.get('id')||'',contextJobId=purchaseParams.get('jobId')||'',model,busy=false,vendorChoice=null,vendorSearchSequence=0,purchaseAttemptId='';
function e(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function show(text,error){var n=document.getElementById('notice');n.textContent=text;n.className='atlas-notice '+(error?'atlas-notice--error':'atlas-notice--success');n.hidden=false;}
function call(name,args,done){if(busy)return;busy=true;google.script.run.withSuccessHandler(function(r){busy=false;if(!r||r.ok===false){show(r&&r.error&&r.error.message||'The request could not be completed.',true);if(r&&r.refreshRequired)load();return;}done(r.data);}).withFailureHandler(function(){busy=false;show('The result could not be confirmed. Refresh before another action.',true);load();})[name].apply(google.script.run,args||[]);}
function load(){var detail=document.getElementById('detail');detail.setAttribute('aria-busy','true');google.script.run.withSuccessHandler(function(r){detail.removeAttribute('aria-busy');if(!r||r.ok===false){if(AtlasUi.sessionExpired(r,document.getElementById('notice')))return;show(r&&r.error&&r.error.message||'Purchasing is unavailable.',true);detail.innerHTML='<div class="atlas-error"><h2>Purchasing unavailable</h2><button class="atlas-button" onclick="load()">Retry</button></div>';return;}model=r.data;render();}).withFailureHandler(function(){detail.removeAttribute('aria-busy');show('Purchasing could not be loaded. Check your connection, then retry.',true);detail.innerHTML='<div class="atlas-error"><h2>Purchasing could not be loaded</h2><button class="atlas-button" onclick="load()">Retry</button></div>';}).getPurchasingWorkspace({id:selected,query:document.getElementById('search').value});}
function openRequest(id){selected=id;history.pushState({},'', '?route=purchasing&id='+encodeURIComponent(id));load();}
function render(){document.getElementById('new').hidden=!model.actions.request;document.getElementById('list').innerHTML=model.items.length?model.items.map(function(r){return '<button class="request" aria-current="'+(selected===r.id)+'" onclick="openRequest(\''+e(r.id)+'\')"><b>'+e(r.vendorLabel)+'</b><br>'+e(r.description)+' · '+e(r.status)+'</button>';}).join(''):'<p>No purchase requests found.</p>';if(contextJobId&&!selected)newForm();else detail();}
function detail(){var h=document.getElementById('detail'),r=model.selected;if(!r){h.innerHTML='<h2>Choose a purchase request</h2><p>Open a request or create a new one.</p>';return;}var actions=[],vendorState=r.vendorReferenceState==='LEGACY_UNLINKED'?' <span class="atlas-help">Legacy unlinked Vendor text; no automatic match was made.</span>':r.vendorReferenceState==='UNAVAILABLE'?' <span class="atlas-help">Stored Vendor reference unavailable.</span>':'';if(model.actions.associateVendor)actions.push('<button class="atlas-button" onclick="vendorAssociationForm()">'+(r.vendorId?'Change Vendor':'Associate canonical Vendor')+'</button>');if(model.actions.approve&&r.status==='PENDING_APPROVAL')actions.push('<button class="atlas-button" onclick="approve()">Approve request</button>');if(model.actions.recordReceipt&&(r.status==='APPROVED'||r.status==='APPROVED_NO_APPROVAL_REQUIRED')&&!r.receiptReference)actions.push('<button class="atlas-button" onclick="receiptForm()">Record receipt</button>');h.innerHTML='<h2>'+e(r.description)+'</h2><p>'+e(r.businessJustification)+'</p><div class="facts"><div><b>Status</b><br>'+e(r.status)+'</div><div><b>Requested by</b><br>'+e(r.requester)+'</div><div><b>Vendor</b><br>'+e(r.vendorLabel)+vendorState+'</div><div><b>Amount</b><br>'+e(r.amount)+'</div><div><b>Classification</b><br>'+e(r.classification)+'</div><div><b>Receipt</b><br>'+e(r.receiptReference||'Not recorded')+'</div></div><div class="actions" style="margin-top:14px">'+actions.join('')+'</div><div id="form"></div><p class="atlas-help">Rejection is not available because the canonical purchasing service does not yet define a rejection lifecycle.</p>';}
function newForm(){selected='';vendorChoice=null;document.getElementById('detail').innerHTML='<form class="form" onsubmit="submitRequest(event)"><h2>New purchase request</h2>'+(contextJobId?'<div class="atlas-notice"><b>Work Order context carried forward</b><br>This request will be linked to '+e(contextJobId)+' after Atlas validates the Work Order.</div>':'')+'<div class="picker"><label>Vendor<input name="vendorSearch" role="combobox" aria-autocomplete="list" aria-controls="purchase-vendor-results" aria-expanded="false" autocomplete="off" required oninput="searchPurchaseVendors(this)" onkeydown="pickerKeys(event)"></label><div id="purchase-vendor-results" class="picker-results" role="listbox" hidden></div></div><p class="atlas-help" data-vendor-status aria-live="polite">Choose a canonical Vendor from search results.</p><label>Description<textarea name="description" required></textarea></label><label>Category<input name="category" required></label><label>Classification<select name="classification"><option>JOB</option><option>CAPEX</option><option>OVERHEAD</option></select></label><label>Business justification<textarea name="businessJustification" required></textarea></label><label>Expected ROI / need<textarea name="expectedRoiNeed" required></textarea></label><label>Expected amount<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Notes<textarea name="notes"></textarea></label><button class="atlas-button" type="submit">Submit request</button></form>';}
function searchPurchaseVendors(input){vendorChoice=null;var root=document.getElementById('purchase-vendor-results'),sequence=++vendorSearchSequence,status=input.form.querySelector('[data-vendor-status]');root.hidden=false;root.innerHTML='<p>Searching Vendors…</p>';input.setAttribute('aria-expanded','true');google.script.run.withSuccessHandler(function(r){if(sequence!==vendorSearchSequence)return;if(!r||r.ok===false){root.innerHTML='<p>Vendor search is unavailable. Try again.</p>';return;}var items=r.data||[];root.innerHTML=items.length?items.map(function(item){return '<button type="button" role="option" data-id="'+e(item.id)+'" data-label="'+e(item.label)+'"><b>'+e(item.label)+'</b><br><span>'+e(item.secondary)+'</span></button>';}).join(''):'<p>No active Vendors match this search.</p>';Array.from(root.querySelectorAll('button')).forEach(function(button){button.onclick=function(){vendorChoice={id:button.dataset.id,label:button.dataset.label};input.value=button.dataset.label;root.hidden=true;input.setAttribute('aria-expanded','false');status.textContent='Selected Vendor: '+button.dataset.label;};});}).withFailureHandler(function(){if(sequence!==vendorSearchSequence)return;root.innerHTML='<p>Vendor search is unavailable. Try again.</p>';input.setAttribute('aria-expanded','false');}).searchPurchasingVendors(input.value,25);}
function pickerKeys(event){var root=document.getElementById('purchase-vendor-results'),buttons=Array.from(root.querySelectorAll('button'));if(event.key==='Escape'){root.hidden=true;event.currentTarget.setAttribute('aria-expanded','false');}if(event.key==='ArrowDown'&&buttons.length){event.preventDefault();buttons[0].focus();}}
function vendorAssociationForm(){vendorChoice=null;document.getElementById('form').innerHTML='<form class="form" onsubmit="associateVendor(event)"><h3>Associate canonical Vendor</h3><div class="picker"><label>Find Vendor<input name="vendorSearch" role="combobox" aria-autocomplete="list" aria-controls="purchase-vendor-results" aria-expanded="false" autocomplete="off" required oninput="searchPurchaseVendors(this)" onkeydown="pickerKeys(event)"></label><div id="purchase-vendor-results" class="picker-results" role="listbox" hidden></div></div><p class="atlas-help" data-vendor-status aria-live="polite">The stored legacy text will remain in history; no automatic match is made.</p><button class="atlas-button" type="submit">Save Vendor association</button></form>';}
function associateVendor(event){event.preventDefault();var form=event.currentTarget;if(!vendorChoice){form.querySelector('[data-vendor-status]').textContent='Select a Vendor from the search results; typed text is not saved.';return;}call('associatePurchaseRequestVendor',[selected,vendorChoice.id],function(){show('Vendor association saved.');load();});}
function submitRequest(event){event.preventDefault();var f=event.currentTarget;if(!vendorChoice){f.querySelector('[data-vendor-status]').textContent='Select a Vendor from the search results; typed text is not saved.';return;}if(!purchaseAttemptId)purchaseAttemptId='PRCMD-'+Date.now()+'-'+Math.random().toString(36).slice(2).toUpperCase();var o={requestCommandId:purchaseAttemptId,jobId:contextJobId,vendorId:vendorChoice.id,description:f.description.value,category:f.category.value,classification:f.classification.value,businessJustification:f.businessJustification.value,expectedRoiNeed:f.expectedRoiNeed.value,amount:f.amount.value,notes:f.notes.value};call('submitPurchaseRequest',[o],function(r){purchaseAttemptId='';selected=r.id;show('Purchase request submitted.');load();});}
function approve(){var notes=prompt('Approval notes (optional)')||'';call('approvePurchaseRequest',[selected,'',notes],function(){show('Purchase request approved.');load();});}
function receiptForm(){document.getElementById('form').innerHTML='<form class="form" onsubmit="receipt(event)"><label>Receipt reference<input name="reference" required></label><label>Actual purchase amount<input name="amount" type="number" min="0.01" step="0.01"></label><button class="atlas-button" type="submit">Record receipt</button></form>';}
function receipt(event){event.preventDefault();var f=event.currentTarget;call('recordPurchaseReceipt',[selected,f.reference.value,f.amount.value],function(){show('Receipt recorded.');load();});}
document.getElementById('new').onclick=newForm;document.getElementById('search').addEventListener('change',function(){selected='';load();});load();
</script></body></html>
