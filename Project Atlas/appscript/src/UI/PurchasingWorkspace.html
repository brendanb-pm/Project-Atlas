<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<?!= includeAtlasUi_('UI/AtlasDesignSystem') ?>
<style>.layout{display:grid;grid-template-columns:minmax(260px,.7fr) minmax(0,1.4fr);gap:16px}.list{display:grid;gap:8px}.request{width:100%;text-align:left;min-height:58px;padding:10px;border:1px solid var(--atlas-border);background:#fff;border-radius:6px}.request[aria-current=true]{border:3px solid var(--atlas-accent)}.actions{display:flex;gap:8px;flex-wrap:wrap}.form label{display:grid;gap:5px;margin:10px 0;font-weight:700}.form input,.form select,.form textarea{min-height:44px;padding:8px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.facts div{padding:10px;background:var(--atlas-surface-muted,#f3f6f7)}@media(max-width:800px){.layout{grid-template-columns:1fr}}@media(max-width:480px){.facts{grid-template-columns:1fr}.actions .atlas-button{width:100%}}</style></head>
<body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="atlas-page">
<header class="atlas-page-header"><div><h1>Purchasing</h1><p>Request purchases, review approvals, and record receipt evidence without editing the workbook.</p></div><button class="atlas-button" id="new" type="button">New request</button></header>
<div id="notice" class="atlas-notice" role="status" hidden></div><section class="layout"><aside class="atlas-panel atlas-surface"><label class="atlas-field">Search requests<input id="search" class="atlas-input" type="search"></label><div id="list" class="list"></div></aside><section id="detail" class="atlas-panel atlas-surface" aria-live="polite">Loading purchasing…</section></section></main>
<script>
var selected=(new URLSearchParams(location.search)).get('id')||'',model,busy=false;
function e(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function show(text,error){var n=document.getElementById('notice');n.textContent=text;n.className='atlas-notice '+(error?'atlas-notice--error':'atlas-notice--success');n.hidden=false;}
function call(name,args,done){if(busy)return;busy=true;google.script.run.withSuccessHandler(function(r){busy=false;if(!r||r.ok===false){show(r&&r.error&&r.error.message||'The request could not be completed.',true);if(r&&r.refreshRequired)load();return;}done(r.data);}).withFailureHandler(function(){busy=false;show('The result could not be confirmed. Refresh before another action.',true);load();})[name].apply(google.script.run,args||[]);}
function load(){google.script.run.withSuccessHandler(function(r){if(!r||r.ok===false){show(r&&r.error&&r.error.message||'Purchasing is unavailable.',true);return;}model=r.data;render();}).withFailureHandler(function(){show('Purchasing is unavailable. Ask an administrator to review activation health.',true);}).getPurchasingWorkspace({id:selected,query:document.getElementById('search').value});}
function openRequest(id){selected=id;history.pushState({},'', '?route=purchasing&id='+encodeURIComponent(id));load();}
function render(){document.getElementById('new').hidden=!model.actions.request;document.getElementById('list').innerHTML=model.items.length?model.items.map(function(r){return '<button class="request" aria-current="'+(selected===r.id)+'" onclick="openRequest(\''+e(r.id)+'\')"><b>'+e(r.vendor)+'</b><br>'+e(r.description)+' · '+e(r.status)+'</button>';}).join(''):'<p>No purchase requests found.</p>';detail();}
function detail(){var h=document.getElementById('detail'),r=model.selected;if(!r){h.innerHTML='<h2>Choose a purchase request</h2><p>Open a request or create a new one.</p>';return;}var actions=[];if(model.actions.approve&&r.status==='PENDING_APPROVAL')actions.push('<button class="atlas-button" onclick="approve()">Approve request</button>');if(model.actions.recordReceipt&&(r.status==='APPROVED'||r.status==='APPROVED_NO_APPROVAL_REQUIRED')&&!r.receiptReference)actions.push('<button class="atlas-button" onclick="receiptForm()">Record receipt</button>');h.innerHTML='<h2>'+e(r.description)+'</h2><p>'+e(r.businessJustification)+'</p><div class="facts"><div><b>Status</b><br>'+e(r.status)+'</div><div><b>Requested by</b><br>'+e(r.requester)+'</div><div><b>Vendor</b><br>'+e(r.vendor)+'</div><div><b>Amount</b><br>'+e(r.amount)+'</div><div><b>Classification</b><br>'+e(r.classification)+'</div><div><b>Receipt</b><br>'+e(r.receiptReference||'Not recorded')+'</div></div><div class="actions" style="margin-top:14px">'+actions.join('')+'</div><div id="form"></div><p class="atlas-help">Rejection is not available because the canonical purchasing service does not yet define a rejection lifecycle.</p>';}
function newForm(){selected='';document.getElementById('detail').innerHTML='<form class="form" onsubmit="submitRequest(event)"><h2>New purchase request</h2><label>Vendor<input name="vendor" required></label><label>Description<textarea name="description" required></textarea></label><label>Category<input name="category" required></label><label>Classification<select name="classification"><option>JOB</option><option>CAPEX</option><option>OVERHEAD</option></select></label><label>Business justification<textarea name="businessJustification" required></textarea></label><label>Expected ROI / need<textarea name="expectedRoiNeed" required></textarea></label><label>Expected amount<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Notes<textarea name="notes"></textarea></label><button class="atlas-button" type="submit">Submit request</button></form>';}
function submitRequest(event){event.preventDefault();var f=event.currentTarget,o={vendor:f.vendor.value,description:f.description.value,category:f.category.value,classification:f.classification.value,businessJustification:f.businessJustification.value,expectedRoiNeed:f.expectedRoiNeed.value,amount:f.amount.value,notes:f.notes.value};call('submitPurchaseRequest',[o],function(r){selected=r.id;show('Purchase request submitted.');load();});}
function approve(){var notes=prompt('Approval notes (optional)')||'';call('approvePurchaseRequest',[selected,'',notes],function(){show('Purchase request approved.');load();});}
function receiptForm(){document.getElementById('form').innerHTML='<form class="form" onsubmit="receipt(event)"><label>Receipt reference<input name="reference" required></label><label>Actual purchase amount<input name="amount" type="number" min="0.01" step="0.01"></label><button class="atlas-button" type="submit">Record receipt</button></form>';}
function receipt(event){event.preventDefault();var f=event.currentTarget;call('recordPurchaseReceipt',[selected,f.reference.value,f.amount.value],function(){show('Receipt recorded.');load();});}
document.getElementById('new').onclick=newForm;document.getElementById('search').addEventListener('change',function(){selected='';load();});load();
</script></body></html>
