<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in - Atlas</title><?!= includeAtlasUi_('UI/AtlasDesignSystem'); ?><style>body{min-height:100vh;display:grid;place-items:center}.auth-shell{width:min(460px,calc(100% - 32px));padding:32px}.brand{font-weight:900;letter-spacing:.08em;color:var(--atlas-accent)}.provider-list{display:grid;gap:12px;margin:24px 0}.provider{width:100%;min-height:52px}.auth-shell h1{margin:8px 0}.auth-shell p{color:var(--atlas-text-secondary)}@media(max-width:480px){.auth-shell{padding:22px 18px}}</style></head><body><main class="auth-shell atlas-surface" aria-labelledby="title"><div class="brand">ATLAS</div><h1 id="title">Sign in to Atlas</h1><p>Use your organization account. Signing in does not grant access unless your Atlas membership is active.</p><div id="status" class="atlas-notice" role="status" aria-live="polite">Loading available sign-in options…</div><div id="providers" class="provider-list" aria-label="Sign-in providers"></div><button id="logout" class="atlas-button atlas-button--quiet" hidden>Sign out of Atlas</button><p class="atlas-help">Atlas sign-out ends this application session. It does not globally sign you out of Microsoft or Google.</p></main><script>
var authStateContract=['SIGNED_OUT','SIGNING_IN','AUTHENTICATION_FAILED','IDENTITY_NOT_PROVISIONED','MEMBERSHIP_INACTIVE','TENANT_UNAVAILABLE','COMMERCIAL_ACCESS_RESTRICTED','SESSION_EXPIRED','REAUTHENTICATION_REQUIRED','PROVIDER_TEMPORARILY_UNAVAILABLE'],initialAuthState=authStateContract[0],authMessages={failed:'Authentication could not be completed. Try again or choose another provider.',cancelled:'Sign-in was cancelled. You can try again.',expired:'The sign-in attempt expired. Start a new sign-in.',session_expired:'Your Atlas session expired. Sign in again to continue.',interrupted:'The previous sign-in was interrupted. Start again.',not_provisioned:'This identity is not provisioned for Atlas. Contact your Atlas administrator or try another account.',membership:'Your Atlas membership is inactive or unavailable. You may try another account.',commercial:'Atlas access is restricted for this organization. Contact your Atlas administrator or try another account.'},token=sessionStorage.getItem('atlasSessionToken')||'',returnRoute=new URLSearchParams(location.search).get('return')||'home',signing=false,signingOut=false,watchdog=null,logoutWatchdog=null,providers=[];
function show(message,error){var n=document.getElementById('status');n.textContent=message;n.className='atlas-notice'+(error?' atlas-notice--error':'');n.setAttribute('role',error?'alert':'status')}
function providerButtons(disabled){Array.prototype.forEach.call(document.querySelectorAll('.provider'),function(button){button.disabled=!!disabled;});}
function forgetTransaction(){['atlasAuthFlowId','atlasAuthState','atlasAuthDeadline','atlasAuthReturnRoute'].forEach(function(key){sessionStorage.removeItem(key);});}
function abortTransaction(flow,state){if(flow)google.script.run.withFailureHandler(function(){}).abortAtlasSignIn(flow,state||'');}
function resetAttempt(message,error){clearTimeout(watchdog);watchdog=null;signing=false;providerButtons(false);forgetTransaction();show(message,error);}
function randomFlow(){if(!window.crypto||!crypto.getRandomValues)return '';var bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return Array.prototype.map.call(bytes,function(value){return ('0'+value.toString(16)).slice(-2);}).join('');}
function begin(id){if(signing)return;var flow=randomFlow();if(!flow){show('Secure sign-in is unavailable in this browser.',true);return}signing=true;providerButtons(true);show('Opening '+(id==='MICROSOFT'?'Microsoft':'Google')+' sign-in…');google.script.run.withSuccessHandler(function(response){if(!response||!response.ok){abortTransaction(flow,'');resetAttempt(response&&response.error&&response.error.message||authMessages.failed,true);return}var data=response.data,seconds=Math.max(60,Number(data.transactionTimeoutSeconds||300));sessionStorage.setItem('atlasAuthFlowId',flow);sessionStorage.setItem('atlasAuthState',data.state);sessionStorage.setItem('atlasAuthDeadline',String(Date.now()+seconds*1000));sessionStorage.setItem('atlasAuthReturnRoute',returnRoute);watchdog=setTimeout(function(){abortTransaction(flow,data.state);resetAttempt(authMessages.expired,true);},seconds*1000);location.assign(data.authorizationUrl);}).withFailureHandler(function(){abortTransaction(flow,'');resetAttempt('The sign-in provider is temporarily unavailable. Try again.',true);}).beginAtlasSignIn(id,returnRoute,flow);}
function load(){var staleFlow=sessionStorage.getItem('atlasAuthFlowId')||'',staleState=sessionStorage.getItem('atlasAuthState')||'';if(staleFlow){abortTransaction(staleFlow,staleState);forgetTransaction();}if(token){document.getElementById('logout').hidden=false;show('An Atlas session is active on this device.');}google.script.run.withSuccessHandler(function(response){if(!response||!response.ok){show(response&&response.error&&response.error.message||'Sign-in is temporarily unavailable.',true);return}var data=response.data,root=document.getElementById('providers');providers=data.providers||[];if(!providers.length){show('Sign-in is not configured for this deployment.',true);return}root.innerHTML='';providers.forEach(function(provider){var button=document.createElement('button');button.className='atlas-button atlas-button--primary provider';button.textContent=provider.label;button.setAttribute('aria-label',provider.label);button.onclick=function(){begin(provider.id)};root.appendChild(button)});var state=new URLSearchParams(location.search).get('auth');show(authMessages[state]||'Choose a sign-in provider.',!!authMessages[state]);}).withFailureHandler(function(){show('Sign-in is temporarily unavailable.',true);}).getAtlasSignInConfiguration();}
function finishLogout(message,error){clearTimeout(logoutWatchdog);logoutWatchdog=null;signingOut=false;AtlasUi.setBusy(document.getElementById('logout'),false,'Signing out…');show(message,error);}
function signOut(){if(signingOut)return;var button=document.getElementById('logout');signingOut=true;AtlasUi.setBusy(button,true,'Signing out…');show('Signing out of Atlas…');logoutWatchdog=setTimeout(function(){if(signingOut)finishLogout('Atlas could not confirm sign-out. Your application session remains available; try again.',true);},15000);google.script.run.withSuccessHandler(function(response){if(!response||response.ok===false){if(response&&response.error&&response.error.code==='SESSION_EXPIRED'){sessionStorage.removeItem('atlasSessionToken');token='';button.hidden=true;return finishLogout('You are signed out of Atlas.');}return finishLogout(response&&response.error&&response.error.message||'Atlas could not confirm sign-out. Try again.',true);}sessionStorage.removeItem('atlasSessionToken');token='';button.hidden=true;finishLogout('You are signed out of Atlas. Microsoft or Google may still be signed in.');}).withFailureHandler(function(){finishLogout('Atlas could not confirm sign-out. Your application session remains available; try again.',true);}).logoutAtlasSession(token);}
document.getElementById('logout').onclick=signOut;load();
</script></body></html>
