<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in - Atlas</title><?!= includeAtlasUi_('UI/AtlasDesignSystem'); ?><style>body{min-height:100vh;display:grid;place-items:center}.auth-shell{width:min(460px,calc(100% - 32px));padding:32px}.brand{font-weight:900;letter-spacing:.08em;color:var(--atlas-accent)}.provider-list{display:grid;gap:12px;margin:24px 0}.provider{width:100%;min-height:52px}.auth-shell h1{margin:8px 0}.auth-shell p{color:var(--atlas-text-secondary)}@media(max-width:480px){.auth-shell{padding:22px 18px}}</style></head><body><main class="auth-shell atlas-surface" aria-labelledby="title"><div class="brand">ATLAS</div><h1 id="title">Sign in to Atlas</h1><p>Use your organization account. Signing in does not grant access unless your Atlas membership is active.</p><div id="status" class="atlas-notice" role="status" aria-live="polite">Loading available sign-in options…</div><div id="providers" class="provider-list" aria-label="Sign-in providers"></div><button id="logout" class="atlas-button atlas-button--quiet" hidden>Sign out of Atlas</button><p class="atlas-help">Atlas sign-out ends this application session. It does not globally sign you out of Microsoft or Google.</p></main><script>var authMessages={SIGNED_OUT:'You are signed out of Atlas.',SIGNING_IN:'Opening sign in…',AUTHENTICATION_FAILED:'Authentication could not be completed.',IDENTITY_NOT_PROVISIONED:'This identity is not provisioned for Atlas.',MEMBERSHIP_INACTIVE:'Your Atlas membership is inactive.',TENANT_UNAVAILABLE:'Your organization is unavailable.',COMMERCIAL_ACCESS_RESTRICTED:'Atlas access is restricted for this organization.',SESSION_EXPIRED:'Your Atlas session expired. Sign in again.',REAUTHENTICATION_REQUIRED:'Sign in again to continue this sensitive action.',PROVIDER_TEMPORARILY_UNAVAILABLE:'The sign-in provider is temporarily unavailable.'},token=sessionStorage.getItem('atlasSessionToken')||'',returnRoute=new URLSearchParams(location.search).get('return')||'home';function show(message,error){var n=document.getElementById('status');n.textContent=message;n.className='atlas-notice'+(error?' atlas-notice--error':'');n.setAttribute('role',error?'alert':'status')}function result(response){if(!response||!response.ok){show(response&&response.error&&response.error.message||'Your request could not be completed.',true);return null}return response.data}function begin(id,button){button.disabled=true;show('Opening '+(id==='MICROSOFT'?'Microsoft':'Google')+' sign-in…');google.script.run.withSuccessHandler(function(r){var data=result(r);if(data)location.assign(data.authorizationUrl);else button.disabled=false}).withFailureHandler(function(){show(authMessages.PROVIDER_TEMPORARILY_UNAVAILABLE,true);button.disabled=false}).beginAtlasSignIn(id,returnRoute)}function load(){if(token){document.getElementById('logout').hidden=false;show('An Atlas session is active on this device.');}google.script.run.withSuccessHandler(function(r){var data=result(r);if(!data)return;var root=document.getElementById('providers');if(!data.providers.length){show('Sign-in is not configured for this deployment.',true);return}root.innerHTML='';data.providers.forEach(function(p){var b=document.createElement('button');b.className='atlas-button atlas-button--primary provider';b.textContent=p.label;b.setAttribute('aria-label',p.label);b.onclick=function(){begin(p.id,b)};root.appendChild(b)});show('Choose a sign-in provider.');}).getAtlasSignInConfiguration()}document.getElementById('logout').onclick=function(){google.script.run.withSuccessHandler(function(){sessionStorage.removeItem('atlasSessionToken');token='';document.getElementById('logout').hidden=true;show(authMessages.SIGNED_OUT);}).logoutAtlasSession(token)};load();</script></body></html>
