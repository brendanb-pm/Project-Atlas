<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<?!= includeAtlasUi_('UI/AtlasDesignSystem') ?>
<style>
.tooling-shell{display:grid;gap:18px}.scan-bar,.action-row,.workflow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.scan-bar .atlas-field{flex:1;min-width:230px}.workflow{margin:0;padding:0;list-style:none}.workflow li{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;letter-spacing:.04em}.workflow li:not(:last-child)::after{content:'→';color:var(--atlas-text-muted);margin-left:2px}.workspace-grid{display:grid;grid-template-columns:minmax(260px,.72fr) minmax(0,1.45fr);gap:18px}.result-list{display:grid;gap:8px}.result{width:100%;min-height:60px;padding:10px;text-align:left;border:1px solid var(--atlas-border);border-radius:6px;background:#fff}.result[aria-current="true"]{outline:3px solid var(--atlas-accent);outline-offset:1px}.identity{font:700 .78rem/1.3 Consolas,monospace;overflow-wrap:anywhere}.geometry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.geometry-card{padding:14px;border:1px solid var(--atlas-border);border-radius:7px;background:var(--atlas-surface-muted,#f3f6f7)}.geometry-card.actual{border:3px solid #b45309;background:#fff7ed}.geometry-label{display:block;font-size:.75rem;font-weight:900;letter-spacing:.12em}.geometry-value{display:block;font-size:clamp(1.65rem,4vw,2.6rem);font-weight:900;line-height:1.05;margin-top:4px}.condition,.state{display:inline-flex;align-items:center;min-height:32px;padding:4px 10px;border-radius:999px;font-weight:900}.condition{background:#451a03;color:#fff}.state::before{content:'●';margin-right:7px}.state-ready{background:#dcfce7;color:#14532d}.state-warning,.state-unverified,.state-stale{background:#fef3c7;color:#713f12}.state-blocked,.state-quarantined,.state-retired{background:#fee2e2;color:#7f1d1d}.state-empty,.state-unavailable{background:#e5e7eb;color:#374151}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.fact{padding:10px;border-left:4px solid var(--atlas-border);background:var(--atlas-surface-muted,#f3f6f7);overflow-wrap:anywhere}.fact b{display:block}.preflight{margin-top:14px;padding:15px;border:2px solid var(--atlas-border);border-radius:7px}.preflight[data-state="BLOCKED"]{border-color:#b91c1c}.preflight[data-state="WARNING"],.preflight[data-state="UNVERIFIED"],.preflight[data-state="STALE"]{border-color:#b45309}.reasons{padding-left:20px}.management{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.management section{padding:12px;border:1px solid var(--atlas-border);border-radius:6px}.management h3{margin-top:0}.atlas-button{min-height:46px}.empty-state{padding:24px;text-align:center;border:2px dashed var(--atlas-border);border-radius:7px}.skeleton{height:18px;margin:10px 0;border-radius:4px;background:linear-gradient(90deg,#e5e7eb,#f3f4f6,#e5e7eb);background-size:200% 100%;animation:pulse 1.3s infinite}@keyframes pulse{to{background-position:-200% 0}}@media(max-width:900px){.workspace-grid{grid-template-columns:1fr}.management{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.atlas-page{padding:12px}.geometry,.facts{grid-template-columns:1fr}.scan-bar .atlas-button,.action-row .atlas-button{width:100%}.workflow li{font-size:.7rem}.workflow li:nth-child(even){display:none}}
</style></head>
<body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="atlas-page tooling-shell">
<header class="atlas-page-header"><div><p class="atlas-eyebrow">Operations / Physical tooling</p><h1>Tooling &amp; CAM preflight</h1><p>Scan the physical cutter or holder, confirm as-built geometry, then release the exact assembly to the operation.</p></div></header>
<ol class="workflow" aria-label="Tooling workflow"><li>SCAN</li><li>SELECT</li><li>ASSIGN</li><li>PREFLIGHT</li><li>READY / BLOCKED</li><li>RUN</li></ol>
<section class="atlas-panel atlas-surface"><div class="scan-bar"><label class="atlas-field" for="tool-query"><span>Scan identifier or search tooling</span><input class="atlas-input" id="tool-query" type="search" autocomplete="off" placeholder="Scan QR / Data Matrix, tool ID, serial, or description"></label><button class="atlas-button atlas-button--primary" id="scan" type="button">Scan / find</button><button class="atlas-button" id="retry" type="button" hidden>Retry</button></div><div id="notice" class="atlas-notice" role="status" aria-live="polite" hidden></div></section>
<section class="workspace-grid"><aside class="atlas-panel atlas-surface"><h2>Tool results</h2><div id="results" class="result-list" aria-live="polite"></div></aside><section id="detail" class="atlas-panel atlas-surface" aria-live="polite" aria-busy="true"></section></section>
</main>
<script>
(function(){'use strict';
var requestVersion=0,current=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function stateClass(v){return 'state-'+String(v||'unavailable').toLowerCase().replace(/_/g,'-');}
function notice(message,tone){var n=document.getElementById('notice');n.hidden=!message;n.className='atlas-notice'+(tone?' atlas-notice--'+tone:'');n.textContent=message||'';}
function loading(){document.getElementById('detail').setAttribute('aria-busy','true');document.getElementById('detail').innerHTML='<p role="status">Loading current physical state…</p><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';document.getElementById('results').innerHTML='<p role="status">Searching bounded tooling records…</p>';}
function failure(message){document.getElementById('detail').setAttribute('aria-busy','false');document.getElementById('detail').innerHTML='<div class="empty-state"><h2>Tooling unavailable</h2><p>'+esc(message||'Current tooling state could not be confirmed. Do not run the operation until preflight is available.')+'</p></div>';document.getElementById('results').innerHTML='<p>No confirmed results.</p>';document.getElementById('retry').hidden=false;notice('Tooling unavailable. Retry before assigning or running.','error');}
function renderResults(items,selected){var host=document.getElementById('results');if(!items||!items.length){host.innerHTML='<div class="empty-state"><h3>No tooling found</h3><p>Check the physical identifier or refine the search.</p></div>';return;}host.innerHTML=items.map(function(x){return '<button class="result" type="button" data-id="'+esc(x.id)+'" aria-current="'+(x.id===selected?'true':'false')+'"><b>'+esc(x.description)+'</b><br><span class="identity">'+esc(x.id)+'</span><br><span>'+esc(x.condition)+' · '+esc(x.location||'Location unavailable')+'</span></button>';}).join('');Array.prototype.forEach.call(host.querySelectorAll('.result'),function(button){button.addEventListener('click',function(){select(button.getAttribute('data-id'));});});}
function render(model){current=model;document.getElementById('retry').hidden=true;document.getElementById('detail').setAttribute('aria-busy','false');renderResults(model.results,model.selectedId);if(!model.tool){notice('No physical tool is selected.','');document.getElementById('detail').innerHTML='<div class="empty-state"><h2>Choose a physical tool</h2><p>Scan a cutter container or holder, or select a bounded search result.</p></div>';return;}var t=model.tool,a=model.assembly||{},p=model.preflight||{state:'NOT_ASSIGNED',reasons:['Assign a verified assembly before running.']};notice('Preflight '+p.state.replace(/_/g,' ')+'. '+((p.reasons||[])[0]||'Current tooling state confirmed.'),p.ready?(p.state==='WARNING'?'warning':'success'):'warning');var actual=t.actualDiameter==null?'UNVERIFIED':Number(t.actualDiameter).toFixed(4)+' '+esc(t.unitLabel);var body='<div class="action-row"><span class="state '+stateClass(p.state)+'">'+esc(p.state.replace(/_/g,' '))+'</span><span class="condition">'+esc(t.condition)+'</span></div><p class="identity">'+esc(t.id)+'</p><h2>'+esc(t.description)+'</h2><div class="geometry"><div class="geometry-card"><span class="geometry-label">NOMINAL</span><span class="geometry-value">'+Number(t.nominalDiameter).toFixed(4)+' '+esc(t.unitLabel)+'</span><span>Catalog definition</span></div><div class="geometry-card actual"><span class="geometry-label">ACTUAL</span><span class="geometry-value">'+actual+'</span><span>'+esc(t.verificationStatus)+' · '+esc(t.measurementAge||'No verified measurement')+'</span></div></div><div class="facts"><div class="fact"><span>Holder</span><b>'+esc(a.holderId||'No active cutter')+'</b></div><div class="fact"><span>Assembly</span><b>'+esc(a.id||'NOT ASSIGNED')+'</b></div><div class="fact"><span>Machine / pocket</span><b>'+esc(a.machine||'Not loaded')+' / '+esc(a.pocket||'—')+'</b></div></div><section class="preflight" data-state="'+esc(p.state)+'"><h3>Operation preflight: '+esc(p.state)+'</h3><p>'+esc(model.operation.reference)+' · CAM '+Number(model.operation.expectedDiameter).toFixed(4)+' '+esc(t.unitLabel)+' · radial stock '+Number(model.operation.radialStockToLeave).toFixed(4)+' '+esc(t.unitLabel)+'</p><ul class="reasons">'+(p.reasons||[]).map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul><div class="action-row"><button class="atlas-button atlas-button--primary" type="button" '+(p.ready?'':'disabled')+'>Run operation</button><button class="atlas-button" type="button">Assign to operation</button></div></section><div class="management"><section><h3>Measurement</h3><p>Record and verify as-built diameter/length with source and operator provenance.</p><button class="atlas-button" type="button">Record measurement</button></section><section><h3>Holder / assembly</h3><p>'+esc(a.state||'EMPTY')+' · install, remove, or verify the current physical association.</p><button class="atlas-button" type="button">Manage assembly</button></section><section><h3>History</h3><p>Measurements, conditions, holder moves, and operation usage load on demand.</p><button class="atlas-button" type="button">Load recent history</button></section></div>';document.getElementById('detail').innerHTML=body;}
function accept(version,result){if(version!==requestVersion)return;if(!result||result.ok===false){failure(result&&result.message);return;}render(result.data);}
function load(query){var version=++requestVersion;loading();notice('Loading current tool and assembly state.','');google.script.run.withSuccessHandler(function(result){accept(version,result);}).withFailureHandler(function(){if(version===requestVersion)failure();}).getToolingWorkspace(String(query||''),25);}
function select(id){var version=++requestVersion;document.getElementById('detail').setAttribute('aria-busy','true');google.script.run.withSuccessHandler(function(result){accept(version,result);}).withFailureHandler(function(){if(version===requestVersion)failure();}).getToolingDetail(id);}
document.getElementById('scan').addEventListener('click',function(){load(document.getElementById('tool-query').value);});document.getElementById('retry').addEventListener('click',function(){load(document.getElementById('tool-query').value);});document.getElementById('tool-query').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();load(e.currentTarget.value);}});window.AtlasToolingWorkspace={render:render,loading:loading,failure:failure,accept:accept,getRequestVersion:function(){return requestVersion;}};load('');
})();
</script></body></html>
