<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--ink:#111c21;--muted:#52636a;--line:#9baab0;--accent:#c96a15;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:#e7edef;color:var(--ink);font:16px/1.35 Arial,sans-serif}.toolbar{max-width:800px;margin:18px auto 0;display:flex;justify-content:flex-end;gap:10px}.toolbar button{min-height:44px;padding:0 16px;border:0;border-radius:5px;background:#24353d;color:#fff;font:700 15px Arial;cursor:pointer}.toolbar button:focus-visible{outline:3px solid #1676a0;outline-offset:2px}.page{max-width:800px;min-height:1000px;margin:18px auto 36px;background:var(--paper);padding:44px 48px;box-shadow:0 3px 18px rgba(24,40,47,.18)}.loading,.error{padding:70px 20px;text-align:center;color:var(--muted)}.error{color:#a82b2b}.header{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:4px solid var(--ink);padding-bottom:18px}.logo{font-size:25px;font-weight:800;letter-spacing:.09em}.logo small{display:block;font-size:10px;letter-spacing:.13em;color:var(--muted);margin-top:4px}.document{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}.job-id{font:700 40px/1 Consolas,monospace;margin:30px 0 6px}.status{display:inline-block;margin-top:7px;padding:5px 10px;border:2px solid var(--ink);font-size:13px;font-weight:700;letter-spacing:.06em}.customer{font-size:22px;font-weight:700;margin:20px 0 4px}.description{font-size:27px;font-weight:700;margin:0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);margin:30px 0}.detail{min-height:72px;padding:13px 15px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.detail:nth-child(2n){border-right:0}.detail:nth-last-child(-n+2){border-bottom:0}.detail b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.detail span{font-size:18px;font-weight:700;overflow-wrap:anywhere}.qr-section{display:grid;grid-template-columns:210px 1fr;align-items:center;gap:30px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:26px 0}.qr-box{width:210px;height:210px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff}.qr-box img{display:block;max-width:100%;max-height:100%;image-rendering:auto}.qr-fallback{padding:20px;text-align:center;font-weight:700;color:var(--muted)}.scan-title{font-size:20px;font-weight:800;margin:0 0 6px}.scan-copy{margin:0;color:var(--muted)}.scan-token{font:700 12px/1.3 Consolas,monospace;color:#52636a;margin-top:13px;overflow-wrap:anywhere}.footer{margin-top:28px;font-size:12px;color:var(--muted)}.notes{margin-top:28px;border:1px solid var(--line);padding:14px;min-height:94px}.notes b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.notes p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:620px){.page{margin:0;padding:25px 22px;min-height:100vh}.toolbar{margin:10px}.header{gap:16px}.job-id{font-size:30px}.detail-grid{grid-template-columns:1fr}.detail,.detail:nth-child(2n){border-right:0}.detail:nth-last-child(-n+2){border-bottom:1px solid var(--line)}.detail:last-child{border-bottom:0}.qr-section{grid-template-columns:1fr;justify-items:center;text-align:center}.qr-box{width:190px;height:190px}}@media print{@page{size:letter;margin:.35in}body{background:#fff}.toolbar{display:none}.page{max-width:none;min-height:0;margin:0;padding:0;box-shadow:none}.detail-grid{break-inside:avoid}.qr-section{break-inside:avoid}.job-id{font-size:34px}.notes{min-height:72px}}
  </style>
  <?!= includeAtlasUi_('UI/AtlasDesignSystem') ?>
</head>
<body><?!= includeAtlasUi_('UI/NavigationFrame') ?>
  <div class="toolbar" aria-label="Traveler controls"><button class="button primary" type="button" onclick="window.print()">Print Traveler</button><button class="button secondary" type="button" onclick="loadTraveler()">Refresh</button></div>
  <main id="traveler" class="page" aria-live="polite"><section class="loading">Loading traveler…</section></main>
  <script>
    /* This client obtains a prepared traveler model from Apps Script. It never
       opens or reads a spreadsheet, and it treats the QR token as opaque. */
    var travelerState={token:null,busy:false,model:null};
    function escapeHtml(value){return String(value===undefined||value===null?'':value).replace(/[&<>"']/g,function(character){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];});}
    function text(value,fallback){return value===undefined||value===null||value===''?(fallback||'—'):String(value);}
    function date(value){if(!value)return '—';var parsed=new Date(value);return isNaN(parsed.getTime())?String(value):parsed.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}
    function responseData(result){if(result&&result.ok===false)throw new Error((result.error&&result.error.message)||'Unable to load traveler.');return result&&Object.prototype.hasOwnProperty.call(result,'data')?result.data:result;}
    function renderError(message){document.getElementById('traveler').innerHTML='<section class="error"><h1>Traveler unavailable</h1><p>'+escapeHtml(message)+'</p></section>';}
    function qrMarkup(model){
      /* `qrImageUrl` is generated by the server from an opaque QR token. The
         template deliberately does not compose QR data from customer fields. */
      return model.qrImageUrl?'<img src="'+escapeHtml(model.qrImageUrl)+'" alt="QR code for job '+escapeHtml(text(model.jobId||model.id))+'">':'<div class="qr-fallback">QR image unavailable.<br>Reprint after Atlas restores it.</div>';
    }
    function renderTraveler(model){
      if(!model)throw new Error('Traveler data was empty.');
      travelerState.model=model;
      var jobId=text(model.jobId||model.id),details=[['Customer',model.customerName||model.customerDisplay],['Due',date(model.dueDate)],['Part / work',model.partDescription||model.partName||model.partId||model.description],['Quantity',model.quantity],['PO number',model.poNumber],['Program',model.program],['Machine',model.machine],['Next action',model.nextAction||model.nextRequiredAction]];
      var profile=atlasNavigationProfile(),product=profile.productDisplayName||'Atlas',organization=profile.organizationName||profile.deploymentDisplayName||'OPERATIONAL WORKSPACE';document.getElementById('traveler').innerHTML='<header class="header"><div class="logo">'+escapeHtml(product)+'<small>'+escapeHtml(organization)+'</small></div><div class="document">JOB TRAVELER</div></header><h1 class="job-id">'+escapeHtml(jobId)+'</h1><span class="status">'+escapeHtml(text(model.status,'STATUS NOT SET').replace(/_/g,' '))+'</span><p class="customer">'+escapeHtml(text(model.customerName||model.customerDisplay,'Customer not listed'))+'</p><p class="description">'+escapeHtml(text(model.partDescription||model.partName||model.partId||model.description,'Work description not listed'))+'</p><section class="detail-grid">'+details.map(function(item){return '<div class="detail"><b>'+escapeHtml(item[0])+'</b><span>'+escapeHtml(text(item[1]))+'</span></div>';}).join('')+'</section><section class="qr-section"><div class="qr-box">'+qrMarkup(model)+'</div><div><p class="scan-title">SCAN FOR CURRENT WORK ORDER</p><p class="scan-copy">Use '+escapeHtml(product)+' to see the current status, record work, report a problem, or reprint this traveler.</p></div></section><section class="notes"><b>Shop notes</b><p>'+escapeHtml(text(model.notes,''))+'</p></section><footer class="footer">Printed '+escapeHtml(new Date().toLocaleString())+' · '+escapeHtml(product)+' traveler · Keep with the physical bin or work order.</footer>';
    }
    function loadTraveler(){
      if(travelerState.busy)return;travelerState.busy=true;
      document.getElementById('traveler').innerHTML='<section class="loading">Loading traveler…</section>';
      if(!travelerState.token){renderError('No traveler identifier was supplied.');travelerState.busy=false;return;}
      google.script.run.withSuccessHandler(function(result){travelerState.busy=false;try{renderTraveler(responseData(result));}catch(error){renderError(error.message);}}).withFailureHandler(function(){travelerState.busy=false;renderError('Unable to load traveler. Try again.');}).getTravelerPrintData(travelerState.token);
    }
    function start(){
      var fallback=new URLSearchParams(window.location.search).get('traveler')||new URLSearchParams(window.location.search).get('qr');
      if(google.script.url&&google.script.url.getLocation){google.script.url.getLocation(function(location){travelerState.token=location&&location.parameter&&(location.parameter.traveler||location.parameter.qr)||fallback;loadTraveler();});}else{travelerState.token=fallback;loadTraveler();}
    }
    document.addEventListener('atlasnavigationready',function(){if(travelerState.model)renderTraveler(travelerState.model);});
    start();
  </script>
</body>
</html>
