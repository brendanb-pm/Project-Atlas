<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#1c2c33;--paper:#edf2f3;--line:#c8d4d7;--accent:#b51f2b;--muted:#607176}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px Arial;color:var(--ink)}.wrap{max-width:850px;margin:auto;padding:16px}.head h1{margin:0}.head p{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin:14px 0}.quick,.actions{display:flex;gap:8px;flex-wrap:wrap}.quick button,.save{min-height:48px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 13px;font:inherit;font-weight:700;cursor:pointer}.quick button.active,.save{background:var(--accent);border-color:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}label{display:grid;gap:5px;font-weight:700}input,select,textarea{min-height:44px;border:1px solid #a9b9be;border-radius:5px;padding:8px;font:inherit}textarea{min-height:72px}.wide{grid-column:1/-1}.timeline article{border-left:4px solid var(--accent);padding:0 0 14px 12px;margin:14px 0}.timeline p{margin:4px 0;color:#45585f}.notice{position:fixed;right:14px;bottom:14px;background:#176848;color:#fff;padding:12px;border-radius:6px;font-weight:700}.notice.error{background:#a61e2c}.notice[hidden]{display:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.quick button{flex:1}.wrap{padding:12px}}
</style><?!= includeAtlasUi_('UI/AtlasDesignSystem') ?></head>
<body><?!= includeAtlasUi_('UI/NavigationFrame') ?><main class="wrap"><header class="head"><h1>Sales Activity</h1><p>Capture the interaction, then set the next action before leaving.</p></header>
<section class="card"><div class="quick"><button onclick="type('IN_PERSON_VISIT')">LOG VISIT</button><button onclick="type('PHONE_CALL')">LOG CALL</button><button onclick="type('TEXT_MESSAGE')">LOG TEXT</button><button onclick="type('EMAIL')">LOG EMAIL</button><button onclick="type('MATERIAL_DROP_OFF')">MATERIALS LEFT</button><button onclick="type('FOLLOW_UP')">FOLLOW UP</button></div>
<div class="grid"><label class="wide">Dealer / Account<select id="customer" onchange="timeline()"></select></label><label>Activity<select id="activity"><option>IN_PERSON_VISIT</option><option>PHONE_CALL</option><option>TEXT_MESSAGE</option><option>EMAIL</option><option>MATERIAL_DROP_OFF</option><option>FOLLOW_UP</option><option>REFERRAL</option><option>SOCIAL_MEDIA</option><option>MEETING</option><option>OTHER</option></select></label><label>Outcome<select id="outcome"><option>LEFT_MATERIALS</option><option>INTERESTED</option><option>FOLLOW_UP_REQUIRED</option><option>REQUESTED_PRICING</option><option>REQUESTED_SAMPLE</option><option>REQUESTED_CALLBACK</option><option>NO_RESPONSE</option><option>WON</option><option>LOST</option></select></label><label class="wide">Notes / what happened<textarea id="notes" placeholder="Spoke with counter staff. Owner wasn't available."></textarea></label><label>Material type<select id="material"><option value="">None</option><option>BUSINESS_CARDS</option><option>DEALER_PACKET</option><option>PRICE_SHEET</option><option>SAMPLE</option><option>DISPLAY</option><option>FLYER</option><option>OTHER</option></select></label><label>Quantity left<input id="quantity" inputmode="numeric"></label><label class="wide">Next action<input id="next" placeholder="Call and ask for owner"></label><label>Follow-up due<input id="due" type="date"></label></div>
<div class="actions"><button class="button primary save" onclick="save()">Log Activity</button><button class="button secondary save" onclick="queue()">Open Follow-Up Queue</button></div></section>
<section class="card"><h2>Customer workspace</h2><div id="customer-context">Choose a Customer to see account health and the next action.</div></section><section class="card timeline"><h2>Recent activity</h2><p>Most recent 50 interactions.</p><div id="timeline">Choose a Customer to view activity.</div></section></main><div class="notice" id="notice" hidden role="status" aria-live="polite"></div>
<script>
function msg(text,isError){var notice=document.getElementById('notice');notice.textContent=text;notice.className='notice'+(isError?' error':'');notice.hidden=false;setTimeout(function(){notice.hidden=true;},3500);}
function api(name,arg,success){google.script.run.withSuccessHandler(function(result){if(!result||!result.ok){msg(result&&result.error&&result.error.message||'Unable to complete request.',true);if(result&&result.refreshRequired)setTimeout(boot,0);return;}success(result.data);}).withFailureHandler(function(){msg('Unable to confirm the result. Refresh before retrying.',true);})[name](arg);}
function type(value){document.getElementById('activity').value=value;}
function save(){var activity=document.getElementById('activity').value,outcome=document.getElementById('outcome').value,notes=document.getElementById('notes').value,input={customerId:document.getElementById('customer').value,activityType:activity,activityDatetime:new Date().toISOString(),summary:notes||activity.replace(/_/g,' '),notes:notes,outcome:outcome,materialsLeft:activity==='MATERIAL_DROP_OFF',materialType:document.getElementById('material').value,quantityLeft:document.getElementById('quantity').value,nextAction:document.getElementById('next').value,nextActionDueAt:document.getElementById('due').value};api('createSalesActivity',input,function(){msg('Activity saved.');document.getElementById('notes').value='';timeline();});}
function queue(){api('getSalesFollowUpQueue',undefined,function(data){msg('Overdue: '+data.overdue.length+' · Due today: '+data.dueToday.length+' · Upcoming: '+data.upcoming.length);});}
function esc(value){return String(value||'').replace(/[&<>"']/g,function(character){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];});}
function boot(){var requested=(new URLSearchParams(location.search)).get('customer')||'';document.querySelector('label.wide').firstChild.nodeValue='Customer';api('getSalesCustomerDirectory','',function(model){var customers=model.items||[],select=document.getElementById('customer');select.innerHTML=customers.map(function(customer){return '<option value="'+esc(customer.id)+'">'+esc(customer.name)+'</option>';}).join('');if(requested&&customers.some(function(customer){return customer.id===requested;}))select.value=requested;timeline();});}
function timeline(){var id=document.getElementById('customer').value;if(!id)return;api('getSalesCustomerWorkspace',id,function(model){var health=model.health||{},next=model.nextAction;document.getElementById('customer-context').innerHTML='<h3>'+esc(model.customer.name)+'</h3><p><b>Account health:</b> '+esc(String(health.staleness||'Current').replace(/_/g,' '))+(health.daysSinceLastContact===null?'':' · '+esc(health.daysSinceLastContact)+' days since contact')+'</p><p><b>Next action:</b> '+(next?esc(next.action)+' · '+esc(String(next.dueAt).slice(0,10))+' · '+esc(next.ownerUserId||'Unassigned'):'No next action recorded')+'</p>';var rows=model.timeline||[];document.getElementById('timeline').innerHTML=rows.length?rows.map(function(activity){return '<article><b>'+esc(activity.activityType.replace(/_/g,' '))+' · '+esc(activity.ownerUserId)+'</b><p>'+esc(activity.summary)+'</p><p>Outcome: '+esc(activity.outcome)+' · Next: '+esc(activity.nextAction||'Closed')+(activity.nextActionDueAt?' · '+esc(String(activity.nextActionDueAt).slice(0,10)):'')+'</p></article>';}).join(''):'No activity yet. Log the first Customer interaction above.';});}
boot();
</script></body></html>
