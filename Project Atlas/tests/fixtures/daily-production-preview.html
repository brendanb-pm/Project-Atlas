<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Production QA</title><style>:root{--border:#cbd6da;--danger:#a72b2b;--warning:#8a5c00;--success:#176f42;--canvas:#eef2f3}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:#17262d;font:15px/1.45 Arial,sans-serif}.page{max-width:1200px;margin:auto;padding:20px 16px 32px}header{display:flex;justify-content:space-between;gap:16px}h1{margin:0}.button{min-height:44px;padding:0 16px;border:1px solid #9eafb6;background:#fff;border-radius:5px;font-weight:700}.buckets{display:grid;gap:18px}.bucket{border-radius:7px;overflow:hidden}.bucket-head{display:flex;justify-content:space-between;padding:12px 16px;background:#263840;color:#fff}.overdue .bucket-head{background:#7e2020}.today .bucket-head{background:#8a4b0b}.bucket-head h2{margin:0}.list{display:grid;gap:10px;padding:12px;background:#f8fafb}.card{display:grid;grid-template-columns:1.2fr .9fr .9fr 1.2fr auto;gap:12px;align-items:center;padding:14px;background:#fff;border:1px solid var(--border);border-left:6px solid var(--warning);border-radius:6px}.card.blocked{border-left-color:var(--danger)}.card.ready{border-left-color:var(--success)}.card h3,.card p{margin:3px 0}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;color:#40545d}.blocker{color:var(--danger);font-weight:800}.pill{display:inline-block;padding:4px 9px;border:1px solid;border-radius:999px;font-weight:800}.pill.blocked{color:var(--danger)}.pill.risk{color:var(--warning)}.pill.ready{color:var(--success)}.states{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty,.message{background:#fff;padding:24px;text-align:center}.message{border-left:5px solid var(--danger)}@media(max-width:1000px){.card{grid-template-columns:1fr 1fr}}@media(max-width:620px){.page{padding:12px}header{display:block}.card{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .button{width:100%}}</style></head><body><main class="page"><header><div><h1>Daily Production</h1><p>Committed Work Orders that require attention now.</p><p>As of Friday, Aug 14 · Business timezone America/Los_Angeles</p></div><button class="button">Refresh board</button></header><div id="content" class="buckets"></div></main><script>const state=new URLSearchParams(location.search).get('state')||'populated',jobs=[{bucket:'overdue',label:'Overdue',id:'WO-1042',customer:'Northstar',service:'Repair fixture',due:'Aug 13',owner:'Morgan Lead',operation:'Final inspection',status:'RUNNING',blocker:'Inspection report missing',materials:'READY',tooling:'READY',ready:'BLOCKED'},{bucket:'today',label:'Due today',id:'WO-1048',customer:'Cascade',service:'Machine brackets',due:'Today 3:00 PM',owner:'Alex Operator',operation:'Operation 2',status:'RUNNING',blocker:'',materials:'READY',tooling:'READY',ready:'READY'},{bucket:'tomorrow',label:'Due tomorrow',id:'WO-1051',customer:'H2',service:'H2 Plate Assemblies',due:'Sat, Aug 15',owner:'Morgan Lead',operation:'Not started',status:'NOT STARTED',blocker:'Awaiting fixture confirmation',materials:'READY',tooling:'UNKNOWN',ready:'BLOCKED'},{bucket:'week',label:'This week',id:'WO-1054',customer:'Summit',service:'Coated housings',due:'Sun, Aug 16',owner:'Unassigned',operation:'Material prep',status:'PLANNED',blocker:'',materials:'UNKNOWN',tooling:'READY',ready:'AT RISK'}];function card(j){return `<article class="card ${j.ready==='BLOCKED'?'blocked':j.ready==='READY'?'ready':''}"><div><span class="eyebrow">Work Order</span><h3>${j.id}</h3><p>${j.customer} · ${j.service}</p></div><div><span class="eyebrow">Promised</span><p><b>${j.due}</b></p><p>Owner: <b>${j.owner}</b></p></div><div><span class="eyebrow">Production</span><p><b>${j.operation}</b><br>${j.status}</p>${j.blocker?`<p class="blocker">BLOCKER: ${j.blocker}</p>`:'<p>No active blocker</p>'}</div><div><span class="eyebrow">Readiness</span><p><span class="pill ${j.ready==='BLOCKED'?'blocked':j.ready==='READY'?'ready':'risk'}">${j.ready}</span></p><div class="states"><span>Materials<br><b>${j.materials}</b></span><span>Tooling<br><b>${j.tooling}</b></span></div></div><div class="actions"><button class="button">Open Work Order</button><button class="button">Update</button></div></article>`}const content=document.getElementById('content');if(state==='loading')content.innerHTML='<div class="empty">Loading committed Work Orders…</div>';else if(state==='error')content.innerHTML='<div class="message"><h2>Board unavailable</h2><p>Refresh when the connection is restored. No Work Order was changed.</p></div>';else if(state==='uncertain')content.innerHTML='<div class="message"><h2>Update not confirmed</h2><p>Refresh authoritative Work Order state before trying another update.</p></div>';else {const source=state==='empty'?[]:jobs;content.innerHTML=['overdue','today','tomorrow','week'].map((key,i)=>{const rows=source.filter(j=>j.bucket===key),label=['Overdue','Due today','Due tomorrow','This week'][i];return `<section class="bucket ${key}"><div class="bucket-head"><div><h2>${label}</h2>${key==='overdue'?'<b>PAST COMMITMENT</b>':''}</div><b>${rows.length} Work Orders</b></div><div class="list">${rows.length?rows.map(card).join(''):'<div class="empty">No committed work in this bucket.</div>'}</div></section>`}).join('')}</script></body></html>
