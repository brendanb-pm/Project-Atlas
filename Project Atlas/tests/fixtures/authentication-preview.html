<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas sign in preview</title><style>:root{--ink:#17262d;--muted:#63747c;--canvas:#eef2f3;--surface:#fff;--border:#cbd6da;--accent:#b86113;--focus:#1676a0}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:var(--canvas);color:var(--ink);font:15px/1.45 Inter,"Segoe UI",sans-serif}.shell{width:min(460px,calc(100% - 32px));padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 24px #17262d20}.brand{font-weight:900;letter-spacing:.08em;color:var(--accent)}h1{margin:8px 0;font-size:1.8rem}p{color:var(--muted)}.status{padding:12px 16px;border:1px solid #a8cad7;border-left:4px solid #255e75;border-radius:4px;background:#f1f8fa}.providers{display:grid;gap:12px;margin:24px 0}button{min-height:52px;border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:#fff;font:700 .95rem inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.help{font-size:.82rem}@media(max-width:480px){.shell{padding:22px 18px}}</style></head><body><main class="shell" aria-labelledby="title"><div class="brand">ATLAS</div><h1 id="title">Sign in to Atlas</h1><p>Use your organization account. Signing in does not grant access unless your Atlas membership is active.</p><div class="status" role="status" aria-live="polite">Choose a sign-in provider.</div><div class="providers" aria-label="Sign-in providers"><button>Continue with Microsoft</button><button>Continue with Google</button></div><p class="help">Atlas sign-out ends this application session. It does not globally sign you out of Microsoft or Google.</p></main></body></html>
