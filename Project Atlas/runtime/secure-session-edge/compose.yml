name: atlas-local

services:
  atlas-postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ATLAS_POSTGRES_DB:?Set ATLAS_POSTGRES_DB in the ignored Docker environment file}
      POSTGRES_USER: ${ATLAS_POSTGRES_USER:?Set ATLAS_POSTGRES_USER in the ignored Docker environment file}
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:?Set ATLAS_POSTGRES_PASSWORD in the ignored Docker environment file}
    ports:
      - "127.0.0.1:${ATLAS_POSTGRES_PORT:?Set ATLAS_POSTGRES_PORT in the ignored Docker environment file}:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    networks:
      - atlas_db
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  atlas_pgdata:

networks:
  atlas_db:
