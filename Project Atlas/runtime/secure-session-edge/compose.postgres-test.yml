services:
  atlas-postgres:
    restart: "no"
    ports: !override
      - "127.0.0.1::5432"
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "atlas_test_bootstrap", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes: !reset {}
